<rect x="185" y="280" width="630" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="324.0" text-anchor="middle" font-size="23" style="fill:#1e293b">程序检查 ＋ 专家评分细则 ＋ 偏好判断</text>
<path d="M820,316 C950,316 940,250 867.5,219" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
