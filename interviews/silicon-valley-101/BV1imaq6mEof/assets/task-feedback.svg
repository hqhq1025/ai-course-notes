<text x="867.5" y="166.0" text-anchor="middle" font-size="23" style="fill:#1e293b">验证器</text>
<path d="M235,158.0 L269,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480,158.0 L514,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M725,158.0 L759,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
