<text x="377.5" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工具与沙箱</text>
<rect x="525" y="108" width="195" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="622.5" y="166.0" text-anchor="middle" font-size="23" style="fill:#1e293b">执行结果</text>
