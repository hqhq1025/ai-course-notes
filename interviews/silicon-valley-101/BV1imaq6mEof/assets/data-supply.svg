<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372">
<title>数据供给的四种能力来源</title><desc>四栏表示招聘网络、众包组织、内部培养、工程合成的不同能力来源，不代表公司互斥分类。蓝色是找到人，绿色是组织交付，橙色是培养质量，紫色是工程加工；底部说明它们都要形成可用训练信号。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="372" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">数据供给的四种能力来源</text>
<rect x="35" y="100" width="195" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="132.5" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">招聘网络</text>
<text x="132.5" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">找到领域专家</text>
<path d="M132.5,215 C132.5,240 500,240 500,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280" y="100" width="195" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="377.5" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">众包组织</text>
<text x="377.5" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">灵活调配产能</text>
<path d="M377.5,215 C377.5,240 500,240 500,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="525" y="100" width="195" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="622.5" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">内部培养</text>
<text x="622.5" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">积累质量经验</text>
<path d="M622.5,215 C622.5,240 500,240 500,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770" y="100" width="195" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="867.5" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工程合成</text>
<text x="867.5" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">搭建任务环境</text>
<path d="M867.5,215 C867.5,240 500,240 500,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="274" width="500" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="318.0" text-anchor="middle" font-size="23" style="fill:#1e293b">交付可用的训练信号</text>
</svg>
