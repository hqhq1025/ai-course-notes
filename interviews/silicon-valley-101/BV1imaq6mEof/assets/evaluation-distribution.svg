<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="388" viewBox="0 0 1000 388">
<title>从多项评测到真实任务体验</title><desc>三个评测维度对应不同任务，各自成绩经过任务分布和权重形成总分。总分与真实任务体验并列对照而非等同；两条支路提醒分别观察跨任务能力和具体产品体验。图没有给出经验权重。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="388" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从多项评测到真实任务体验</text>
<rect x="45" y="100" width="260" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">代码任务</text>
<path d="M175,177 C175,198 500,198 500,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="100" width="260" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">行业任务</text>
<path d="M500,177 C500,198 500,198 500,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="695" y="100" width="260" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="825.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">长程工作流</text>
<path d="M825,177 C825,198 500,198 500,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="229" width="500" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="273.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务分布与权重 → 综合得分</text>
<text x="500" y="338" text-anchor="middle" font-size="23" style="fill:#1e293b">同时对照：跨任务表现 · 真实用户体验</text>
</svg>
