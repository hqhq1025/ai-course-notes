<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424">
<title>先采购原材料，再加工训练环境</title><desc>上行是原材料与权利的获取，下行是把材料组织成可运行任务。箭头连接专业知识和项目材料、使用许可、任务设计、工具沙箱、验证与交付；采购能力和工程加工都影响最终质量。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="424" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">先采购原材料，再加工训练环境</text>
<rect x="45" y="100" width="270" height="104" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180.0" y="143.0" text-anchor="middle" font-size="23" style="fill:#1e293b">专业知识</text>
<text x="180.0" y="177.0" text-anchor="middle" font-size="23" style="fill:#1e293b">项目材料</text>
<rect x="365" y="100" width="270" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="143.0" text-anchor="middle" font-size="23" style="fill:#1e293b">获取资料</text>
<text x="500.0" y="177.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确使用许可</text>
<rect x="685" y="100" width="270" height="104" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="820.0" y="160.0" text-anchor="middle" font-size="23" style="fill:#1e293b">设计真实任务</text>
<path d="M320,152.0 L354,152.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M640,152.0 L674,152.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="685" y="275" width="270" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="820.0" y="319.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工具与沙箱</text>
<rect x="365" y="275" width="270" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="319.0" text-anchor="middle" font-size="23" style="fill:#1e293b">验证任务结果</text>
<rect x="45" y="275" width="270" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="180.0" y="319.0" text-anchor="middle" font-size="23" style="fill:#1e293b">交付训练环境</text>
<path d="M820,209 L820,264" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680,311 L646,311" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360,311 L326,311" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="392" text-anchor="middle" font-size="22" style="fill:#1e293b">原材料的获取能力与加工能力共同决定交付</text>
</svg>
