<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="384" viewBox="0 0 1000 384">
<title>专家数据需要同时解决三类质量问题</title><desc>三列区分测试内容进入训练集、评分或答案错误、提交者伪造材料。下行是各类问题的对应处理。底部强调专家激励贯穿数据提交和复核过程；流程记录和第二专家复核存在成本，不能天然消除作弊。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="384" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">专家数据需要同时解决三类质量问题</text>
<rect x="45" y="96" width="260" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="140.0" text-anchor="middle" font-size="23" style="fill:#1e293b">数据污染</text>
<rect x="45" y="226" width="260" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="175.0" y="270.0" text-anchor="middle" font-size="23" style="fill:#1e293b">隔离测试内容</text>
<path d="M175,173 L175,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="96" width="260" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="140.0" text-anchor="middle" font-size="23" style="fill:#1e293b">测试或答案错误</text>
<rect x="370" y="226" width="260" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="270.0" text-anchor="middle" font-size="23" style="fill:#1e293b">复核标准与解法</text>
<path d="M500,173 L500,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="695" y="96" width="260" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="825.0" y="140.0" text-anchor="middle" font-size="23" style="fill:#1e293b">伪造任务材料</text>
<rect x="695" y="226" width="260" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="825.0" y="270.0" text-anchor="middle" font-size="23" style="fill:#1e293b">核对过程与结果</text>
<path d="M825,173 L825,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="344" text-anchor="middle" font-size="23" style="fill:#1e293b">贯穿全程：让提交者与复核者的激励对齐</text>
</svg>
