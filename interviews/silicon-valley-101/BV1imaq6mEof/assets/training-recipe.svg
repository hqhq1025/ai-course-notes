<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410">
<title>把任务变成适合模型的学习信号</title><desc>相同任务可以进入两种训练方式：答案和轨迹用于监督微调，执行反馈用于强化学习。底部共同条件包含难度匹配、资源预算和捷径检查；评测只看最终成功时，仍不能直接替代训练配方。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="410" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">把任务变成适合模型的学习信号</text>
<rect x="310" y="93" width="380" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="137.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务与环境</text>
<path d="M395,170 C395,192 250,185 250,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M605,170 C605,192 750,185 750,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="228" width="410" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="250.0" y="272.0" text-anchor="middle" font-size="23" style="fill:#1e293b">答案与轨迹 → 监督微调</text>
<rect x="545" y="228" width="410" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="750.0" y="272.0" text-anchor="middle" font-size="23" style="fill:#1e293b">执行反馈 → 强化学习</text>
<text x="500" y="362" text-anchor="middle" font-size="23" style="fill:#1e293b">共同条件：难度匹配 · 资源预算 · 捷径检查</text>
</svg>
