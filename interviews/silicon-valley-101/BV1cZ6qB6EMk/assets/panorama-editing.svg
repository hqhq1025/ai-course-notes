<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465">
<title>先拍后剪：全景专用能力接通用模型</title><desc>上方保留用户想讲的故事，下方才是素材处理链。全景模型先从360度素材选视角和高光，通用模型组织平面内容，最后结合节奏与特效交付。压缩目标是减少冗余输入同时保留任务需要的事件。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="465" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">先拍后剪：全景专用能力接通用模型</text>
<rect x="185" y="85" width="630" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="129.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用户意图：纪实故事／高光片段／氛围表达</text>
<path d="M500,161 L500,207" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="220" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="135.0" y="264.0" text-anchor="middle" font-size="23" style="fill:#1e293b">360° 素材</text>
<text x="135.0" y="298.0" text-anchor="middle" font-size="23" style="fill:#1e293b">保留完整现场</text>
<rect x="275" y="220" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="380.0" y="264.0" text-anchor="middle" font-size="23" style="fill:#1e293b">专用全景理解</text>
<text x="380.0" y="298.0" text-anchor="middle" font-size="23" style="fill:#1e293b">选择视角与事件</text>
<rect x="520" y="220" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="625.0" y="264.0" text-anchor="middle" font-size="23" style="fill:#1e293b">通用模型编排</text>
<text x="625.0" y="298.0" text-anchor="middle" font-size="23" style="fill:#1e293b">连成故事</text>
<rect x="765" y="220" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="870.0" y="264.0" text-anchor="middle" font-size="23" style="fill:#1e293b">剪辑与生成特效</text>
<text x="870.0" y="298.0" text-anchor="middle" font-size="23" style="fill:#1e293b">形成可分享视频</text>
<path d="M245,273.0 L264,273.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,273.0 L509,273.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M735,273.0 L754,273.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="410" text-anchor="middle" font-size="23" style="fill:#1e293b">降低输入冗余，而非只按固定间隔丢弃画面</text>
</svg>
