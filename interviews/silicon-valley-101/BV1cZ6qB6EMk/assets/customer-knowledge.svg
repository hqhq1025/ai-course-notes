<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
<title>客服资料怎样变成可执行的知识</title><desc>左侧的文档、图片和对话先被清洗成知识库。用户意图决定检索和流程，复杂优惠需要继续核对规则，退货归因保留人工复审。底部是从业务相关标签回到产品和服务的反馈。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">客服资料怎样变成可执行的知识</text>
<rect x="35" y="100" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">文档／详情页</text>
<text x="140.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">客服对话</text>
<rect x="275" y="100" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">清洗与结构化</text>
<text x="380.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">建立知识库</text>
<rect x="515" y="100" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">意图识别＋RAG</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检索业务知识</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">规则与工作流</text>
<text x="860.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">回答／处理／复审</text>
<path d="M250,153.0 L264,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="95" y="290" width="810" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="334.0" text-anchor="middle" font-size="23" style="fill:#1e293b">业务标签：肤质与反馈 · 产品／物流意见 · 退货归因</text>
<text x="500" y="418" text-anchor="middle" font-size="22" style="fill:#1e293b">RAG：检索相关资料，再让模型结合资料生成回答</text>
</svg>
