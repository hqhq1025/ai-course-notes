<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<title>成本下降发生在三个层次</title><desc>三列分别指向模型计算、软硬配合与云端利用率。三条路径一起影响单位有效任务成本；底部提醒首包时延、生成速度与并发仍需按具体工作负载考察。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="430" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">成本下降发生在三个层次</text>
<text x="175" y="105" text-anchor="middle" font-size="26" style="fill:#1e293b">模型结构</text>
<rect x="40" y="130" width="270" height="105" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="173.5" text-anchor="middle" font-size="23" style="fill:#1e293b">小模型／稀疏激活</text>
<text x="175.0" y="207.5" text-anchor="middle" font-size="23" style="fill:#1e293b">混合精度／MTP</text>
<path d="M175,242 L175,279" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="105" text-anchor="middle" font-size="26" style="fill:#1e293b">软硬配合</text>
<rect x="365" y="130" width="270" height="105" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="173.5" text-anchor="middle" font-size="23" style="fill:#1e293b">芯片与模型协同</text>
<text x="500.0" y="207.5" text-anchor="middle" font-size="23" style="fill:#1e293b">适合任务的执行</text>
<path d="M500,242 L500,279" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="825" y="105" text-anchor="middle" font-size="26" style="fill:#1e293b">资源调度</text>
<rect x="690" y="130" width="270" height="105" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="825.0" y="173.5" text-anchor="middle" font-size="23" style="fill:#1e293b">不同时段与任务</text>
<text x="825.0" y="207.5" text-anchor="middle" font-size="23" style="fill:#1e293b">空闲资源用于跑批</text>
<path d="M825,242 L825,279" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="290" width="700" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="334.0" text-anchor="middle" font-size="23" style="fill:#1e293b">单位有效任务成本下降</text>
<text x="500" y="405" text-anchor="middle" font-size="22" style="fill:#1e293b">同时考察：回答效果 · 首包时延 · 生成速度 · 并发</text>
</svg>
