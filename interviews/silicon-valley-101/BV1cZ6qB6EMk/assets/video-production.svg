<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
<title>可控的视频如何进入广告生产</title><desc>从产品素材和参考视频进入生成、筛选与交付。上方呈现生产链，下方区分生成成本与销售收入；成本和售价来自嘉宾接触案例，差额还需要支付筛选、修改、人员和销售成本。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">可控的视频如何进入广告生产</text>
<rect x="35" y="100" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">素材与参考</text>
<text x="140.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">角色／声音</text>
<rect x="275" y="100" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">多镜头生成</text>
<text x="380.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可控性提升</text>
<rect x="515" y="100" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">筛选与修改</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检查可交付性</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">投放交付</text>
<text x="860.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">广告主／代理</text>
<path d="M250,153.0 L264,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="270" width="395" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="257.5" y="314.0" text-anchor="middle" font-size="23" style="fill:#1e293b">15 秒生成成本：15 元以下</text>
<rect x="545" y="270" width="395" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="742.5" y="314.0" text-anchor="middle" font-size="23" style="fill:#1e293b">合格广告售价：25—50 元</text>
<text x="500" y="409" text-anchor="middle" font-size="22" style="fill:#1e293b">口述案例量级；收入减生成成本还不是净利润</text>
</svg>
