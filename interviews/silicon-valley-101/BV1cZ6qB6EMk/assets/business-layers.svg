<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445">
<title>从模型权重到完整任务结果</title><desc>从左到右增加服务商承担的工作。开源用户仍需部署运维；模型API交付推理能力；Agent服务把模型、工具、流程组合成任务结果。下方反馈环路说明社区与商业服务可以相互促进。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="445" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从模型权重到完整任务结果</text>
<rect x="35" y="105" width="275" height="130" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="172.5" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">开源模型权重</text>
<text x="172.5" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用户部署与运维</text>
<rect x="362" y="105" width="275" height="130" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="499.5" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">模型 API（MaaS）</text>
<text x="499.5" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">托管推理与并发</text>
<rect x="689" y="105" width="275" height="130" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="826.5" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Agent 服务</text>
<text x="826.5" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工具＋流程＋结果</text>
<path d="M315,170.0 L351,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M642,170.0 L678,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120" y="305" width="760" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="349.0" text-anchor="middle" font-size="23" style="fill:#1e293b">社区反馈 → 模型改进 → 易用服务 → 更多应用</text>
<text x="500" y="420" text-anchor="middle" font-size="22" style="fill:#1e293b">token 反映使用量；收入还取决于模型、任务和定价</text>
</svg>
