<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<title>自然语言如何接到实际服务</title><desc>上方显示点咖啡任务经过理解、选择与交易服务的执行链。下方端侧和云端不是两种独立产品，而是围绕延时、隐私、复杂度与负载协作；眼镜属于节目讨论的硬件入口。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="440" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">自然语言如何接到实际服务</text>
<rect x="35" y="90" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="134.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用户需求</text>
<text x="140.0" y="168.0" text-anchor="middle" font-size="23" style="fill:#1e293b">语音／视觉</text>
<rect x="275" y="90" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="134.0" text-anchor="middle" font-size="23" style="fill:#1e293b">理解意图</text>
<text x="380.0" y="168.0" text-anchor="middle" font-size="23" style="fill:#1e293b">偏好与上下文</text>
<rect x="515" y="90" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="134.0" text-anchor="middle" font-size="23" style="fill:#1e293b">选择并调用工具</text>
<text x="620.0" y="168.0" text-anchor="middle" font-size="23" style="fill:#1e293b">菜单／口味／订单</text>
<rect x="755" y="90" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="134.0" text-anchor="middle" font-size="23" style="fill:#1e293b">服务返回</text>
<text x="860.0" y="168.0" text-anchor="middle" font-size="23" style="fill:#1e293b">确认交易结果</text>
<path d="M250,143.0 L264,143.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,143.0 L504,143.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,143.0 L744,143.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="270" width="390" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="265.0" y="314.0" text-anchor="middle" font-size="23" style="fill:#1e293b">端侧</text>
<text x="265.0" y="348.0" text-anchor="middle" font-size="23" style="fill:#1e293b">及时交互／本地信息</text>
<rect x="540" y="270" width="390" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="735.0" y="314.0" text-anchor="middle" font-size="23" style="fill:#1e293b">云端</text>
<text x="735.0" y="348.0" text-anchor="middle" font-size="23" style="fill:#1e293b">复杂任务／服务接入</text>
<path d="M466,308 L528,308" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M534,335 L472,335" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="415" text-anchor="middle" font-size="22" style="fill:#1e293b">任务分配随设备能力和业务条件变化</text>
</svg>
