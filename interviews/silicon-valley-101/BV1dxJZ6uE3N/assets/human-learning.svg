<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="397" viewBox="0 0 1000 397">
<title>人和模型怎样互相提供学习材料</title><desc>上方箭头表示人提供日常示范、新问题与评价；下方反向箭头表示模型帮助人学习知识和工具。研究目标单独列出，提醒读者跨场景熟练不等于已实现自主学习。这里的学习包括人的学习和提供训练/反馈材料，不主张每次交流都会更新模型权重。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="397" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">人和模型怎样互相提供学习材料</text>
<rect x="70" y="131" width="220" height="102" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180.0" y="190.0" text-anchor="middle" font-size="23" style="fill:#1e293b">人</text>
<rect x="710" y="131" width="220" height="102" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="820.0" y="190.0" text-anchor="middle" font-size="23" style="fill:#1e293b">模型</text>
<path d="M295,151 L699,151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="125" text-anchor="middle" font-size="21" style="fill:#1e293b">日常示范 · 新问题 · 评价</text>
<path d="M705,218 L301,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="256" text-anchor="middle" font-size="21" style="fill:#1e293b">帮助人学习知识与工具</text>
<rect x="130" y="300" width="740" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">研究目标：学会如何学习</text>
</svg>
