<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445">
<title>同一模型，三种任务体验</title><desc>从左到右读每一行。机器人行保留分叉花茎造成失败及捏窄后成功的动作变化；编程行描述更长任务中的稳定性；科研行描述借助 GUI 学习旧软件流程。三行是不同任务的经验，不是同一指标下的模型比分。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="445" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">同一模型，三种任务体验</text>
<text x="91" y="131" text-anchor="middle" font-size="23" style="fill:#1e293b">机器人</text>
<rect x="180" y="88" width="230" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="295.0" y="132.0" text-anchor="middle" font-size="23" style="fill:#1e293b">插花遇阻</text>
<rect x="455" y="88" width="230" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="570.0" y="132.0" text-anchor="middle" font-size="23" style="fill:#1e293b">捏窄分叉花茎</text>
<rect x="730" y="88" width="230" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="845.0" y="132.0" text-anchor="middle" font-size="23" style="fill:#1e293b">成功插入</text>
<path d="M415,124.0 L444,124.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M690,124.0 L719,124.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="91" y="235" text-anchor="middle" font-size="23" style="fill:#1e293b">编程</text>
<rect x="180" y="192" width="230" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="295.0" y="236.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务持续更久</text>
<rect x="455" y="192" width="230" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="570.0" y="236.0" text-anchor="middle" font-size="23" style="fill:#1e293b">记住上下文</text>
<rect x="730" y="192" width="230" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="845.0" y="236.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检查长期稳定性</text>
<path d="M415,228.0 L444,228.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M690,228.0 L719,228.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="91" y="339" text-anchor="middle" font-size="23" style="fill:#1e293b">科研</text>
<rect x="180" y="296" width="230" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="295.0" y="340.0" text-anchor="middle" font-size="23" style="fill:#1e293b">旧软件难接入</text>
<rect x="455" y="296" width="230" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="570.0" y="340.0" text-anchor="middle" font-size="23" style="fill:#1e293b">操作图形界面</text>
<rect x="730" y="296" width="230" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="845.0" y="340.0" text-anchor="middle" font-size="23" style="fill:#1e293b">学习工作流程</text>
<path d="M415,332.0 L444,332.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M690,332.0 L719,332.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="416" text-anchor="middle" font-size="21" style="fill:#64748b">比较任务变化，不合成统一得分</text>
</svg>
