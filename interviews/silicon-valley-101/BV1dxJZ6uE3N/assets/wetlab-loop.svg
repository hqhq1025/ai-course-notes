<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="397" viewBox="0 0 1000 397">
<title>把候选假设接到实验反馈</title><desc>沿箭头读四个环节。模型提出候选假设后，实验方案必须匹配实验室预算、设备和时间，再由实验人员或设备执行湿实验。结果回流用于修订假设。本图展示协作关系，不提供生物实验操作配方。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="397" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">把候选假设接到实验反馈</text>
<rect x="35" y="111" width="195" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="132.5" y="172.0" text-anchor="middle" font-size="23" style="fill:#1e293b">候选假设</text>
<rect x="280" y="111" width="195" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="377.5" y="155.0" text-anchor="middle" font-size="23" style="fill:#1e293b">资源匹配的</text>
<text x="377.5" y="189.0" text-anchor="middle" font-size="23" style="fill:#1e293b">实验方案</text>
<rect x="525" y="111" width="195" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="622.5" y="172.0" text-anchor="middle" font-size="23" style="fill:#1e293b">湿实验执行</text>
<rect x="770" y="111" width="195" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="867.5" y="172.0" text-anchor="middle" font-size="23" style="fill:#1e293b">结果回流</text>
<path d="M235,164.0 L269,164.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480,164.0 L514,164.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M725,164.0 L759,164.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867.5,222 C867.5,298 132.5,298 132.5,228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="500" y="260" text-anchor="middle" font-size="21" style="fill:#64748b">用实验结果修订假设</text>
<rect x="240" y="309" width="520" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="348.0" text-anchor="middle" font-size="23" style="fill:#1e293b">共同约束：预算 · 设备 · 时间</text>
</svg>
