<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="383" viewBox="0 0 1000 383">
<title>基准解题与真实研究的任务差别</title><desc>两列分别展示已定义任务和开放研究的条件。左侧给定输入、目标和测试；右侧还要界定问题、等待实验反馈并分配资源。水平并列表示任务差别，不表示基准没有价值，也不是能力优劣排名。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="383" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">基准解题与真实研究的任务差别</text>
<rect x="50" y="90" width="425" height="150" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="262.5" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">固定输入</text>
<text x="262.5" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确目标</text>
<text x="262.5" y="207.0" text-anchor="middle" font-size="23" style="fill:#1e293b">已知测试</text>
<rect x="525" y="90" width="425" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="737.5" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">未知目标</text>
<text x="737.5" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">实验反馈</text>
<text x="737.5" y="207.0" text-anchor="middle" font-size="23" style="fill:#1e293b">资源约束</text>
<path d="M262.5,245 L262.5,264" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M737.5,245 L737.5,264" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50" y="275" width="425" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="262.5" y="319.0" text-anchor="middle" font-size="23" style="fill:#1e293b">基准解题</text>
<rect x="525" y="275" width="425" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="737.5" y="319.0" text-anchor="middle" font-size="23" style="fill:#1e293b">真实研究</text>
</svg>
