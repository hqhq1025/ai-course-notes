<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="523" viewBox="0 0 1000 523">
<title>按任务条件划分规划与控制</title><desc>主链从慢速规划到可执行子目标、本地快速控制及物理环境。两条回流分别将执行反馈用于调整规划和快速控制。下方两栏区分几何外观与动力学：重建形状不能自动补齐接触、摩擦或流体的即时反馈。图不指定固定频率或已实现的统一架构。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="523" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">按任务条件划分规划与控制</text>
<rect x="35" y="120" width="195" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="132.5" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">慢速规划</text>
<rect x="280" y="120" width="195" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="377.5" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可执行子目标</text>
<rect x="525" y="120" width="195" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="622.5" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">本地快速控制</text>
<rect x="770" y="120" width="195" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="867.5" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">物理环境</text>
<path d="M235,156.0 L269,156.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480,156.0 L514,156.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M725,156.0 L759,156.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867.5,115 C867.5,76 132.5,76 132.5,109" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<path d="M867.5,197 C867.5,280 622.5,280 622.5,203" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="500" y="267" text-anchor="middle" font-size="21" style="fill:#64748b">执行反馈同时用于规划和控制</text>
<rect x="70" y="329" width="410" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="275.0" y="375.0" text-anchor="middle" font-size="23" style="fill:#1e293b">几何外观</text>
<text x="275.0" y="409.0" text-anchor="middle" font-size="23" style="fill:#1e293b">形状、位置、空间关系</text>
<rect x="520" y="329" width="410" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="725.0" y="375.0" text-anchor="middle" font-size="23" style="fill:#1e293b">动力学</text>
<text x="725.0" y="409.0" text-anchor="middle" font-size="23" style="fill:#1e293b">接触、摩擦、运动响应</text>
<text x="500" y="491" text-anchor="middle" font-size="21" style="fill:#64748b">分层边界随任务变化；几何重建不等于动力学准确</text>
</svg>
