<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="391" viewBox="0 0 1000 391">
<title>围绕持续问题积累实验数据</title><desc>从持续问题出发选择实验，验证结果产生新的数据，再改进下一轮。数据不是脱离问题堆积；选择什么实验决定得到哪种反馈。底部注明工业酶与药物研发的验证周期不同，不用虚构数值或曲线代表两类任务。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="391" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">围绕持续问题积累实验数据</text>
<rect x="35" y="101" width="150" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="110.0" y="145.0" text-anchor="middle" font-size="23" style="fill:#1e293b">持续问题</text>
<rect x="230" y="101" width="150" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="305.0" y="145.0" text-anchor="middle" font-size="23" style="fill:#1e293b">选择实验</text>
<rect x="425" y="101" width="150" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="145.0" text-anchor="middle" font-size="23" style="fill:#1e293b">验证结果</text>
<rect x="620" y="101" width="150" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="695.0" y="145.0" text-anchor="middle" font-size="23" style="fill:#1e293b">积累数据</text>
<rect x="815" y="101" width="150" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="890.0" y="145.0" text-anchor="middle" font-size="23" style="fill:#1e293b">改进下一轮</text>
<path d="M190,137.0 L219,137.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M385,137.0 L414,137.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M580,137.0 L609,137.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M775,137.0 L804,137.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M890,178 C890,266 110,266 110,184" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="500" y="218" text-anchor="middle" font-size="21" style="fill:#64748b">新数据改变下一轮的问题与实验选择</text>
<rect x="160" y="283" width="680" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="327.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工业酶应用与药物研发：反馈周期不同</text>
</svg>
