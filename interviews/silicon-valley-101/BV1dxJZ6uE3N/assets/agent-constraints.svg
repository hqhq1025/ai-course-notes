<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392">
<title>个人 Agent 落地的三个条件</title><desc>三个并列条件共同影响任务能否完成。访问权关乎平台和网络能否进入；代理身份关乎是否获用户授权及网站是否认可代理关系；成本包括模型 token 和沙箱计算。个人设备可能改变部分条件，但没有自动满足其余条件。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="392" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">个人 Agent 落地的三个条件</text>
<rect x="40" y="91" width="270" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="137.0" text-anchor="middle" font-size="23" style="fill:#1e293b">访问权</text>
<text x="175.0" y="171.0" text-anchor="middle" font-size="23" style="fill:#1e293b">平台与网络可进入</text>
<rect x="365" y="91" width="270" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="137.0" text-anchor="middle" font-size="23" style="fill:#1e293b">代理身份</text>
<text x="500.0" y="171.0" text-anchor="middle" font-size="23" style="fill:#1e293b">授权及代理关系</text>
<rect x="690" y="91" width="270" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="825.0" y="137.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可承受成本</text>
<text x="825.0" y="171.0" text-anchor="middle" font-size="23" style="fill:#1e293b">token ＋ 沙箱</text>
<path d="M175,206 C175,232 500,227 500,247" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500,206 C500,232 500,227 500,247" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M825,206 C825,232 500,227 500,247" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290" y="258" width="420" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="302.0" text-anchor="middle" font-size="23" style="fill:#1e293b">完成个人 Agent 任务</text>
<text x="500" y="365" text-anchor="middle" font-size="21" style="fill:#64748b">本地设备只改变部分条件，三项需分别检验</text>
</svg>
