<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><title>长任务系统的三层支撑</title><desc>三个并列模块共同支撑长任务：模型理解当前信息，记忆与分工选择上下文，工具反馈提供任务进度。图中不把百万上下文当成任务成功保证。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs><rect width="1000" height="340" fill="white"/>
<text x="500" y="48" font-size="30" text-anchor="middle">长任务系统的三层支撑</text>
<rect x="40.0" y="108" width="280.0" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="180.0" y="159" font-size="23" text-anchor="middle">模型能力</text>
<rect x="360.0" y="108" width="280.0" height="86" rx="10" fill="#f3e8ff" stroke="#a855f7"/>
<text x="500.0" y="159" font-size="23" text-anchor="middle">记忆与任务分工</text>
<rect x="680.0" y="108" width="280.0" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
<text x="820.0" y="159" font-size="23" text-anchor="middle">工具和环境反馈</text>
<path d="M180.0,199 C180.0,220 500,220 500,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M500.0,199 C500.0,220 500,220 500,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M820.0,199 C820.0,220 500,220 500,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="274" font-size="22" text-anchor="middle">持续完成可检查的任务</text>
<text x="500" y="321" font-size="19" text-anchor="middle">上下文容量、有效利用和持续任务分别检查</text>
</svg>
