<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><title>求解与验证使用不同的工作上下文</title><desc>从任务条件读到候选，再按任务选择测试、证明检查或证据审查。验证反馈回到候选修改。分开的工作上下文能减少自我重复，但仍需关注共同错误。</desc>
