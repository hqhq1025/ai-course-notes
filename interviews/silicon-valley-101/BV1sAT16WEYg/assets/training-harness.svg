<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><title>模型与脚手架交替改进</title><desc>左脚右脚比喻对应模型训练和脚手架调整。成功要检查整体任务；仅增加搜索数据可能让模型一开始就搜索，偏离先分析再行动的目标。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs><rect width="1000" height="340" fill="white"/>
<text x="500" y="48" font-size="30" text-anchor="middle">模型与脚手架交替改进</text>
<rect x="40.0" y="108" width="200.0" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="140.0" y="159" font-size="23" text-anchor="middle">观察任务失败</text>
<path d="M245.0,151 L269.0,151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="280.0" y="108" width="200.0" height="86" rx="10" fill="#f3e8ff" stroke="#a855f7"/>
<text x="380.0" y="159" font-size="23" text-anchor="middle">更新数据与训练</text>
<path d="M485.0,151 L509.0,151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520.0" y="108" width="200.0" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
<text x="620.0" y="159" font-size="23" text-anchor="middle">调整脚手架</text>
<path d="M725.0,151 L749.0,151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="760.0" y="108" width="200.0" height="86" rx="10" fill="#d1fae5" stroke="#22c55e"/>
<text x="860.0" y="159" font-size="23" text-anchor="middle">检查整体效果</text>
<path d="M860.0,199 C860.0,274 140.0,274 140.0,205" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="245" font-size="20" text-anchor="middle">根据反馈调整下一轮</text>
<text x="500" y="321" font-size="19" text-anchor="middle">案例：先分解问题，再按需要搜索</text>
</svg>
