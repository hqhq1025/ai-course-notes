<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><title>单环、多轮递归与持续可靠</title><desc>从左到右是不同要求：单次诊断训练有效；多轮有继续改进能力；长时间运行仍能控制漂移、成本和目标。这里是概念阶段，没有实验时间轴或实测百分比。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs><rect width="1000" height="340" fill="white"/>
<text x="500" y="48" font-size="30" text-anchor="middle">单环、多轮递归与持续可靠</text>
<rect x="40.0" y="108" width="280.0" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
<text x="180.0" y="159" font-size="23" text-anchor="middle">跑通一次改进</text>
<path d="M325.0,151 L349.0,151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="360.0" y="108" width="280.0" height="86" rx="10" fill="#f3e8ff" stroke="#a855f7"/>
<text x="500.0" y="159" font-size="23" text-anchor="middle">多轮重复提升</text>
<path d="M645.0,151 L669.0,151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="680.0" y="108" width="280.0" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
<text x="820.0" y="159" font-size="23" text-anchor="middle">维持目标与约束</text>
<text x="500" y="321" font-size="19" text-anchor="middle">“最快半年”是李辈滨在 2026-07-06 节目中的单环预测</text>
</svg>
