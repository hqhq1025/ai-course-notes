<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350">
<title>把知识变成能解释、能使用的能力</title><desc>顺箭头读四环节，虚线表示项目复盘反过来决定补什么基础。法律复习与代码项目都依靠自己的解释和实际任务反馈。</desc>
