<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350">
<title>从目标作品反推学习路径</title><desc>先看作品和解释，再找关键区分点，补解决当前问题所需知识；最后借出处和真人检查，模型模拟的专家不是真实专家发言。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="350" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从目标作品反推学习路径</text>
<rect x="32" y="100" width="195" height="112" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="129.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察好作品</text>
<text x="129.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">建立质量标准</text>
<rect x="279" y="100" width="195" height="112" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="376.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">找关键差异</text>
<text x="376.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确自己不懂处</text>
<rect x="526" y="100" width="195" height="112" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="623.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">追问并补基础</text>
<text x="623.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定义与具体例子</text>
<rect x="773" y="100" width="195" height="112" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="870.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">查源与真人反馈</text>
<text x="870.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">再做自己的作品</text>
<path d="M232,156.0 L268,156.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M479,156.0 L515,156.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M726,156.0 L762,156.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M870,218 V260 H130 V219" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="500" y="316" text-anchor="middle" font-size="22" style="fill:#64748b">验证后的作品成为下一轮比较对象</text>
</svg>
