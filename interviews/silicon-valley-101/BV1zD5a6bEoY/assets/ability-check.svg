<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350">
<title>用四个问题检查自己的学习</title><desc>四栏是依据访谈整理的自我检查问题。用真实课程或项目回答，可以把工具熟练度和个人能力分别看清。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="350" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">用四个问题检查自己的学习</text>
<rect x="32" y="100" width="195" height="112" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="129.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能解释吗</text>
<text x="129.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">说清核心原理</text>
<rect x="279" y="100" width="195" height="112" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="376.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能判断吗</text>
<text x="376.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">发现错误与取舍</text>
<rect x="526" y="100" width="195" height="112" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="623.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能迁移吗</text>
<text x="623.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">换一个任务应用</text>
<rect x="773" y="100" width="195" height="112" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="870.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能接续吗</text>
<text x="870.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工具受限时推进</text>
<text x="500" y="316" text-anchor="middle" font-size="22" style="fill:#64748b">检查真实任务，避免只凭顺畅感判断</text>
</svg>
