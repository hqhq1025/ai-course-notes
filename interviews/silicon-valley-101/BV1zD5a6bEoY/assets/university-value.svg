<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350">
<title>大学提供的四种资源</title><desc>四栏并列，分别表示知识、关系、自我探索和社会信号。Alfred 与 Kolento 给这些资源不同权重。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="350" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">大学提供的四种资源</text>
<rect x="32" y="100" width="195" height="112" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="129.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">学科基础</text>
<text x="129.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">理解专业语言</text>
<rect x="279" y="100" width="195" height="112" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="376.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">同辈与导师</text>
<text x="376.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">交流并建立信任</text>
<rect x="526" y="100" width="195" height="112" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="623.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">自我认识</text>
<text x="623.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">辨明兴趣和价值</text>
<rect x="773" y="100" width="195" height="112" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="870.5" y="147.0" text-anchor="middle" font-size="23" style="fill:#1e293b">学历信号</text>
<text x="870.5" y="181.0" text-anchor="middle" font-size="23" style="fill:#1e293b">获得社会认可</text>
<text x="500" y="316" text-anchor="middle" font-size="22" style="fill:#64748b">每个人要为不同资源分配时间</text>
</svg>
