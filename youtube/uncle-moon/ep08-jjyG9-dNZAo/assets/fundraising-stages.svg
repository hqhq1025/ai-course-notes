<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<title>投资意向与实际到账是不同阶段</title><desc>四个阶段说明从意向到实际交割的区别。下方对照朱啸虎未交割的意向与后来另一家机构的实际投资，避免将两段经历混为一谈。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="460" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">投资意向与实际到账是不同阶段</text>
<rect x="35" y="100" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">表达投资意向</text>
<text x="140.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">金额与条件</text>
<rect x="275" y="100" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">形成条款文件</text>
<text x="380.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确协商基础</text>
<rect x="515" y="100" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">完成正式协议</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">落实交割条件</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">资金实际到账</text>
<text x="860.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可用于运营</text>
<path d="M250,153.0 L264,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55" y="285" width="425" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="267.5" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">朱啸虎：600万元口头意向</text>
<text x="267.5" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">后续未交割</text>
<rect x="520" y="285" width="425" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="732.5" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">另一家机构：后续投资</text>
<text x="732.5" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">嘉宾称实际获得约100万美元</text>
</svg>
