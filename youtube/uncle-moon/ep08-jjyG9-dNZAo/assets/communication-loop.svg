<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465">
<title>语音翻译的链路与用户反馈</title><desc>上方四步是源语音到译文语音的概念链路。下方用户评价反向帮助定位识别、译意与发声的具体问题；真正沟通还涉及语境和表达选择。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="465" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">语音翻译的链路与用户反馈</text>
<rect x="35" y="95" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">语音识别 ASR</text>
<text x="140.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">音频变成文字</text>
<rect x="275" y="95" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">文本翻译</text>
<text x="380.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">理解语境与含义</text>
<rect x="515" y="95" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">语音合成 TTS</text>
<text x="620.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">文字变成声音</text>
<rect x="755" y="95" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">对方实际接收</text>
<text x="860.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">理解与回应</text>
<path d="M250,148.0 L264,148.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,148.0 L504,148.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,148.0 L744,148.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="100" y="290" width="800" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="334.0" text-anchor="middle" font-size="23" style="fill:#1e293b">真实用户评价：意思准确吗？听感自然吗？等待够短吗？</text>
<path d="M200,280 L200,236 L140,236 L140,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<path d="M800,216 L800,278" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="500" y="435" text-anchor="middle" font-size="22" style="fill:#1e293b">解释意图与保留含蓄，仍由用户和具体情境决定</text>
