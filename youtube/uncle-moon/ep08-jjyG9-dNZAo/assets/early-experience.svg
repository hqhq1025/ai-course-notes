<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390">
<title>先接触真实工作，再作职业选择</title><desc>上方四步连接主动联系、真实任务、观察日常和选择方向。下方提醒这是一条基于个人经历的学习路径，并不要求读者采取同样的休学决定。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="390" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">先接触真实工作，再作职业选择</text>
<rect x="35" y="120" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">主动联系</text>
<text x="140.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">教授／实验室</text>
<rect x="275" y="120" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">参加真实工作</text>
<text x="380.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务与协作</text>
<rect x="515" y="120" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察日常体验</text>
<text x="620.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">兴趣与适配</text>
<rect x="755" y="120" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">决定下一步</text>
<text x="860.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">继续／转向</text>
<path d="M250,173.0 L264,173.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,173.0 L504,173.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,173.0 L744,173.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="327" text-anchor="middle" font-size="22" style="fill:#1e293b">提前体验帮助选择；一次成功联系也不能保证所有机会</text>
</svg>
