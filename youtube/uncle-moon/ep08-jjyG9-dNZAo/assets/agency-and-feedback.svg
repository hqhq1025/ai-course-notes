<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425">
<title>把能做的事与无法保证的结果分开</title><desc>蓝色框内是可主动调整的行动，橙色框内是机会与反馈的不确定性。两者共同影响观察结果，结果再用于更新下一次行动。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="425" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">把能做的事与无法保证的结果分开</text>
<rect x="50" y="105" width="420" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="260.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可以调整：准备、联系与尝试</text>
<rect x="530" y="105" width="420" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="740.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">无法保证：时机、回应与机会</text>
<path d="M260,187 L420,252" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,187 L580,252" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="265" width="500" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="309.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察结果并更新做法</text>
<text x="500.0" y="343.0" text-anchor="middle" font-size="23" style="fill:#1e293b">承认机会差异，保留行动空间</text>
</svg>
