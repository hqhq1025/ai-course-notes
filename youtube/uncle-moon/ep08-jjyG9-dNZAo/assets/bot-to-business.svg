<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
<title>机器人能力要放进具体业务</title><desc>上方表现机器人从权限到程序处理再到聊天动作的功能路径。下方说明大厂合作还需要业务目标、数据理解和交付衔接，不能仅靠演示程序。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">机器人能力要放进具体业务</text>
<rect x="35" y="100" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">聊天平台权限</text>
<text x="140.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能读／能发什么</text>
<rect x="275" y="100" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">程序读取事件</text>
<text x="380.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">消息与上下文</text>
<rect x="515" y="100" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">调用处理能力</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">规则／模型</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">回到群聊行动</text>
<text x="860.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">回复／协作</text>
<path d="M250,153.0 L264,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="90" y="285" width="820" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">走进成熟业务：理解场景与数据 → 明确目标 → 持续交付</text>
</svg>
