<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">验证清楚问题</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察真实结果</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
