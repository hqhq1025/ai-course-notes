<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="100" y="290" width="800" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="334.0" text-anchor="middle" font-size="23" style="fill:#1e293b">持续支持：合伙人信任 · 生活安排 · 自我接纳</text>
