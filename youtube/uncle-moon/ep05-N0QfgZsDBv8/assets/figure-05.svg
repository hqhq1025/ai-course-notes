<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515">
<title>把 Agent 错误转成可检测、可恢复的过程</title><desc>执行前明确权限，执行中观察结果，失败时依据可恢复边界处理；Undo与Microreboot是不同粒度的恢复方式。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="515" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">把 Agent 错误转成可检测、可恢复的过程</text>
<rect x="35" y="100" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">操作请求</text>
<text x="140.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">身份与权限</text>
<rect x="280" y="100" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">执行动作</text>
<text x="385.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">记录可观察结果</text>
<rect x="525" y="100" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">发现失败</text>
<text x="630.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定位影响范围</text>
<rect x="770" y="100" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">恢复与再验证</text>
<text x="875.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">继续任务</text>
<path d="M250,155.0 L269,155.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,155.0 L514,155.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,155.0 L759,155.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="305" width="400" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="270.0" y="349.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Undo</text>
<text x="270.0" y="383.0" text-anchor="middle" font-size="23" style="fill:#1e293b">回退可撤销操作</text>
<rect x="530" y="305" width="400" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="730.0" y="349.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Microreboot</text>
<text x="730.0" y="383.0" text-anchor="middle" font-size="23" style="fill:#1e293b">局部重启故障组件</text>
<text x="500" y="475" text-anchor="middle" font-size="23" style="fill:#1e293b">外部副作用与依赖决定恢复边界</text>
</svg>
