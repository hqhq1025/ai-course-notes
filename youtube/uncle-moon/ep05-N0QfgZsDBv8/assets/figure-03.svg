<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<title>AI 运维需要完成一个恢复闭环</title><desc>顺序为观察、诊断、执行和验证；底部故障环境产生重复评估任务，验证服务恢复而非只读一段诊断文字。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="480" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">AI 运维需要完成一个恢复闭环</text>
<rect x="35" y="115" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察系统</text>
<text x="140.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">告警／日志</text>
<rect x="280" y="115" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">形成假设</text>
<text x="385.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定位故障</text>
<rect x="525" y="115" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">执行修复</text>
<text x="630.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">调用工具</text>
<rect x="770" y="115" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">验证结果</text>
<text x="875.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">服务恢复</text>
<path d="M250,170.0 L269,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,170.0 L514,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,170.0 L759,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867,232 L867,280 L140,280 L140,236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140" y="325" width="720" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">SREGym：部署系统 → 注入故障 → 评估实际恢复</text>
</svg>
