<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555">
<title>形式化建模与模型检查各做什么</title><desc>从程序和需求构建抽象模型与性质，再由模型检查寻找反例。结果反馈给规格和实现；安全性与活性是不同性质。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="555" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">形式化建模与模型检查各做什么</text>
<rect x="35" y="105" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="151.0" text-anchor="middle" font-size="23" style="fill:#1e293b">需求与程序</text>
<text x="140.0" y="185.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确预期</text>
<rect x="280" y="105" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="151.0" text-anchor="middle" font-size="23" style="fill:#1e293b">抽象状态模型</text>
<text x="385.0" y="185.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定义行为</text>
<rect x="525" y="105" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="151.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检查性质</text>
<text x="630.0" y="185.0" text-anchor="middle" font-size="23" style="fill:#1e293b">探索状态</text>
<rect x="770" y="105" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="151.0" text-anchor="middle" font-size="23" style="fill:#1e293b">发现反例</text>
<text x="875.0" y="185.0" text-anchor="middle" font-size="23" style="fill:#1e293b">修改模型／代码</text>
<path d="M250,160.0 L269,160.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,160.0 L514,160.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,160.0 L759,160.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867,224 L867,278 L380,278 L380,224" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="335" width="410" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="265.0" y="379.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Safety 安全性</text>
<text x="265.0" y="413.0" text-anchor="middle" font-size="23" style="fill:#1e293b">坏事不发生</text>
<rect x="530" y="335" width="410" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="735.0" y="379.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Liveness 活性</text>
<text x="735.0" y="413.0" text-anchor="middle" font-size="23" style="fill:#1e293b">条件成立时最终有进展</text>
<text x="500" y="522" text-anchor="middle" font-size="23" style="fill:#1e293b">AI 协助建模；检查结论依赖模型、性质与假设</text>
