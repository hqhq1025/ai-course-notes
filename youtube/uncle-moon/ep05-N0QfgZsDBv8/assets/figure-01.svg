<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
<title>潜伏的配置错误怎样在故障时暴露</title><desc>上方为正常运行路径，下方为恢复路径；配置只在恢复时读取，因此故障注入和提前检查能够发现平时没有触发的错误。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="500" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">潜伏的配置错误怎样在故障时暴露</text>
<rect x="45" y="115" width="240" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165.0" y="159.0" text-anchor="middle" font-size="23" style="fill:#1e293b">正常请求</text>
<text x="165.0" y="193.0" text-anchor="middle" font-size="23" style="fill:#1e293b">未触发恢复路径</text>
<rect x="380" y="115" width="240" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="159.0" text-anchor="middle" font-size="23" style="fill:#1e293b">系统表面正常</text>
<text x="500.0" y="193.0" text-anchor="middle" font-size="23" style="fill:#1e293b">错误配置潜伏</text>
<path d="M290,170 L365,170" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="300" width="240" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="165.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">外部故障发生</text>
<rect x="380" y="300" width="240" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">启动恢复</text>
<text x="500.0" y="378.0" text-anchor="middle" font-size="23" style="fill:#1e293b">读取错误配置</text>
<rect x="715" y="300" width="240" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="835.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">恢复失败</text>
<text x="835.0" y="378.0" text-anchor="middle" font-size="23" style="fill:#1e293b">暴露配置问题</text>
<path d="M290,336.0 L369,336.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M625,353.0 L704,353.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500,228 L500,288" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="500" y="464" text-anchor="middle" font-size="23" style="fill:#1e293b">研究方向：在真正故障到来前，检查这些潜伏路径</text>
</svg>
