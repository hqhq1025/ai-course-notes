<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495" viewBox="0 0 1000 495">
<title>问题、方法与技能在实践中相互校正</title><desc>问题决定方法和技能需求；实践反馈既可以修正方法，也可以促使问题重述，导师和工具提供支持。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="495" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">问题、方法与技能在实践中相互校正</text>
<rect x="45" y="120" width="260" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">找到愿意长期投入</text>
<text x="175.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">而且有意义的问题</text>
<rect x="370" y="120" width="260" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">选择能检验想法</text>
<text x="500.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">的研究方法</text>
<rect x="695" y="120" width="260" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="825.0" y="164.0" text-anchor="middle" font-size="23" style="fill:#1e293b">补齐实际需要</text>
<text x="825.0" y="198.0" text-anchor="middle" font-size="23" style="fill:#1e293b">的技能与知识</text>
<path d="M310,175 L354,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M635,175 L679,175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="315" width="520" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="359.0" text-anchor="middle" font-size="23" style="fill:#1e293b">实际尝试、反馈、修正</text>
<path d="M825,236 L825,368 L772,368" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M227,368 L175,368 L175,236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
