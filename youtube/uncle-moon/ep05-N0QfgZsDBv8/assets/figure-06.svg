<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<title>生产经验怎样变成研究问题</title><desc>工作现场提供具体问题，工程实现提供约束，反思把经验提炼为问题，研究再返回实践。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="460" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">生产经验怎样变成研究问题</text>
<rect x="35" y="115" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">进入生产团队</text>
<text x="140.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">询问真实困难</text>
<rect x="280" y="115" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">参与实际交付</text>
<text x="385.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">理解系统约束</text>
<rect x="525" y="115" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">反思方案</text>
<text x="630.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">代价与替代路径</text>
<rect x="770" y="115" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">形成研究问题</text>
<text x="875.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可验证的假设</text>
<path d="M250,170.0 L269,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,170.0 L514,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,170.0 L759,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867,232 L867,280 L140,280 L140,236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="367" text-anchor="middle" font-size="24" style="fill:#1e293b">职业选择同时看：学习内容、合作的人、生活条件</text>
</svg>
