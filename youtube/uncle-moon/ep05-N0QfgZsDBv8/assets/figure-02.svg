<text x="630.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">抽象机制</text>
<text x="630.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">并发／异步</text>
<rect x="770" y="115" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">方案与实验</text>
<text x="875.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检验解释</text>
<path d="M250,170.0 L269,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,170.0 L514,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,170.0 L759,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867,232 L867,278 L140,278 L140,236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="145" y="325" width="710" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">导师与同伴：选问题 → 提供反馈 → 继续深入</text>
