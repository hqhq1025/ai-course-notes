<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445">
<title>PPO：先让价值估计适应当前策略</title><desc>上行表示初始价值估计误差如何影响策略更新。下行表示嘉宾采用先预热critic再联合训练的办法；这是对应训练设置中的经验。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="445" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">PPO：先让价值估计适应当前策略</text>
<rect x="35" y="100" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">当前策略采样</text>
<text x="140.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">产生训练轨迹</text>
<rect x="275" y="100" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">初始 critic</text>
<text x="380.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">价值估计误差</text>
<rect x="515" y="100" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">优势估计偏差</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">更新方向受影响</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">策略更新</text>
<text x="860.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">可能偏离期望</text>
<path d="M250,153.0 L264,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="80" y="285" width="380" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="270.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">先训练 critic</text>
<text x="270.0" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">拟合当前策略的回报</text>
<rect x="540" y="285" width="380" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="730.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">再进入 PPO 联合训练</text>
<text x="730.0" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">持续检查奖励与效果</text>
<path d="M468,338 L528,338" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="425" text-anchor="middle" font-size="21" style="fill:#1e293b">预热是节目中的实践方法，时长和设置随任务决定</text>
</svg>
