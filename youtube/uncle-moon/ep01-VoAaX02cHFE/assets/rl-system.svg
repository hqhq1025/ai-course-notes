<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<title>强化学习的吞吐取决于整个执行链</title><desc>模型采样依赖工具和环境执行；反馈送入训练后继续采样。CPU并发与GPU训练都影响整体进展；底部列出扩大集群后新增的系统要求。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="480" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">强化学习的吞吐取决于整个执行链</text>
<rect x="35" y="110" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">GPU 模型采样</text>
<text x="140.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">生成下一步动作</text>
<rect x="275" y="110" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">CPU／沙箱工具</text>
<text x="380.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">执行代码与调用</text>
<rect x="515" y="110" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务反馈</text>
<text x="620.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">成功条件与奖励</text>
<rect x="755" y="110" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">GPU 策略更新</text>
<text x="860.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">训练后继续采样</text>
<path d="M250,163.0 L264,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,163.0 L504,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,163.0 L744,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M865,225 L865,270 L140,270 L140,225" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="325" width="270" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">正确性</text>
<text x="180.0" y="403.0" text-anchor="middle" font-size="23" style="fill:#1e293b">相同目标与数值行为</text>
<rect x="365" y="325" width="270" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">故障恢复</text>
<text x="500.0" y="403.0" text-anchor="middle" font-size="23" style="fill:#1e293b">节点失效后接续训练</text>
<rect x="685" y="325" width="270" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="820.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">资源利用率</text>
<text x="820.0" y="403.0" text-anchor="middle" font-size="23" style="fill:#1e293b">通信与计算协同</text>
<text x="500" y="466" text-anchor="middle" font-size="21" style="fill:#1e293b">节点数量增加后，小集群经验需要在真实规模上检验</text>
</svg>
