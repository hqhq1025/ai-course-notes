<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490">
<title>能力形成与研发反馈处于不同层次</title><desc>上层是模型训练流程，下层是模型辅助研发再改善训练的循环。持续学习需要明确改变的是权重、上下文还是研发流程，不能把研发反馈直接当作每轮在线训练。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="490" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">能力形成与研发反馈处于不同层次</text>
<rect x="35" y="110" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">预训练</text>
<text x="140.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">学习广泛的数据规律</text>
<rect x="275" y="110" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">SFT</text>
<text x="380.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">学习任务示范</text>
<rect x="515" y="110" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">RL 与蒸馏</text>
<text x="620.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">反馈／教师信号</text>
<rect x="755" y="110" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">推理使用</text>
<text x="860.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">文本／多模态任务</text>
<path d="M250,163.0 L264,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,163.0 L504,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,163.0 L744,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="320" width="350" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="260.0" y="364.0" text-anchor="middle" font-size="23" style="fill:#1e293b">模型辅助研究与编码</text>
<text x="260.0" y="398.0" text-anchor="middle" font-size="23" style="fill:#1e293b">改善数据和系统</text>
<rect x="565" y="320" width="350" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="740.0" y="364.0" text-anchor="middle" font-size="23" style="fill:#1e293b">下一轮训练</text>
<text x="740.0" y="398.0" text-anchor="middle" font-size="23" style="fill:#1e293b">得到新的模型版本</text>
<path d="M440,370 L553,370" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M860,227 L860,303" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M745,435 L745,465 L255,465 L255,435" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
