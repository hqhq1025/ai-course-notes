<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<title>判断力如何在探索中形成</title><desc>从不同研究问题中认识约束，借助导师与同行形成判断，再通过实验和真实使用修正判断。循环表示观点可以改变，不是一次预测决定一切。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="420" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">判断力如何在探索中形成</text>
<rect x="35" y="110" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">接触不同问题</text>
<text x="140.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">通信／生物／统计</text>
<rect x="275" y="110" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">辨认关键约束</text>
<text x="380.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能力／资源／需求</text>
<rect x="515" y="110" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">选择可试的方向</text>
<text x="620.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">LLM／系统／反馈</text>
<rect x="755" y="110" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">从结果修正判断</text>
<text x="860.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">实验与社区使用</text>
<path d="M250,163.0 L264,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,163.0 L504,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,163.0 L744,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M865,225 L865,278 L140,278 L140,225" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="326" width="700" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="370.0" text-anchor="middle" font-size="23" style="fill:#1e293b">导师与同行：提供判断逻辑，而非替代个人选择</text>
</svg>
