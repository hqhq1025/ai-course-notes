<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<title>人的判断把 Agent 产出接到任务结果</title><desc>先定义任务，再生成实现、验证和改进。偏好评测与任务验证回答不同问题；代码的可维护性需要具体标准和可执行改进。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="440" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">人的判断把 Agent 产出接到任务结果</text>
<rect x="35" y="110" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定义任务与标准</text>
<text x="140.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">行为／约束／维护</text>
<rect x="275" y="110" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Agent 生成实现</text>
<text x="380.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">代码与操作</text>
<rect x="515" y="110" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">验证真实结果</text>
<text x="620.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">测试／反馈／评审</text>
<rect x="755" y="110" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定位并指导改进</text>
<text x="860.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">具体问题与方案</text>
<path d="M250,163.0 L264,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,163.0 L504,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,163.0 L744,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M865,225 L865,275 L380,275 L380,225" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55" y="325" width="410" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="260.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">偏好：读者更喜欢哪个回答</text>
<rect x="535" y="325" width="410" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="740.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务：系统是否完成目标</text>
</svg>
