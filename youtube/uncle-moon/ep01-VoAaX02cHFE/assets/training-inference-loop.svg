<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<title>从任务执行回到模型训练</title><desc>推理产生轨迹，任务和奖励筛选可用反馈，强化学习更新策略，再交回推理系统；原始轨迹需经整理才能成为有效反馈。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="430" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从任务执行回到模型训练</text>
<rect x="35" y="110" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">推理与工具执行</text>
<text x="140.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">SGLang 支持服务</text>
<rect x="275" y="110" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">记录任务轨迹</text>
<text x="380.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">输入／动作／结果</text>
<rect x="515" y="110" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">环境与奖励</text>
<text x="620.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">评价任务完成</text>
<rect x="755" y="110" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">后训练更新</text>
<text x="860.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Miles 支持训练</text>
<path d="M250,163.0 L264,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,163.0 L504,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,163.0 L744,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M865,223 L865,275 L140,275 L140,224" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="263" text-anchor="middle" font-size="21" style="fill:#1e293b">新模型进入下一轮服务</text>
<rect x="130" y="325" width="740" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">同一业务的私有数据 → 更贴近任务的训练反馈</text>
</svg>
