<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465">
<title>社区和商业项目提供不同资源</title><desc>左列是开源社区的使用与贡献，右列是商业场景的工作负载与规模资源。两边通过真实问题、验证和可复用改进相连；底部是用户选择的基础。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="465" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">社区和商业项目提供不同资源</text>
<rect x="65" y="100" width="370" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">开源社区</text>
<text x="250.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">采用／反馈／贡献</text>
<rect x="565" y="100" width="370" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="750.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">商业项目</text>
<text x="750.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">负载／资源／服务</text>
<path d="M445,140 L552,140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M555,176 L448,176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="280" width="640" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="324.0" text-anchor="middle" font-size="23" style="fill:#1e293b">真实问题 → 规模验证 → 可复用的系统改进</text>
<path d="M250,214 L250,266" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M750,214 L750,266" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="420" text-anchor="middle" font-size="23" style="fill:#1e293b">价值取决于任务效果、成本和交付时机</text>
</svg>
