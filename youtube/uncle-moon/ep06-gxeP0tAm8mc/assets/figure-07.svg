<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505">
<title>虚拟仿真需要接回实机反馈</title><desc>观测实际负载后建模，在虚拟环境试验候选方案，再在真实系统验证，误差反馈到模型。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="505" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">虚拟仿真需要接回实机反馈</text>
<rect x="35" y="115" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">真实负载观测</text>
<text x="140.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务与硬件信息</text>
<rect x="280" y="115" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">建立系统模型</text>
<text x="385.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">表示运行过程</text>
<rect x="525" y="115" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">虚拟试验</text>
<text x="630.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">比较候选配置</text>
<rect x="770" y="115" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">实机验证</text>
<text x="875.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">收益与误差</text>
<path d="M250,170.0 L269,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,170.0 L514,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,170.0 L759,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867,235 L867,285 L385,285 L385,235" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="620" y="315" text-anchor="middle" font-size="22" style="fill:#1e293b">校准模型</text>
<rect x="100" y="360" width="800" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="404.0" text-anchor="middle" font-size="23" style="fill:#1e293b">客户价值：减少试错成本，找到可落地的优化方案</text>
</svg>
