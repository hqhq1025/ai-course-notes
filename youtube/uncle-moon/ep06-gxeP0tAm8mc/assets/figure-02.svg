<path d="M765,385 L752,385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520,385 L507,385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M275,385 L262,385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="508" text-anchor="middle" font-size="23" style="fill:#1e293b">AI 可协助局部设计和检查；最终仍要通过工程验证</text>
