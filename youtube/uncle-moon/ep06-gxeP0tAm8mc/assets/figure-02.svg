<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545">
<title>芯片从设计到量产的主要环节</title><desc>两行分别是设计与制造，箭头从需求经过逻辑验证和物理设计进入流片，再经过封装测试到系统。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="545" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">芯片从设计到量产的主要环节</text>
<rect x="35" y="100" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">需求与架构</text>
<text x="140.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">功能／功耗目标</text>
<rect x="280" y="100" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">RTL 设计</text>
<text x="385.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">描述数字逻辑</text>
<rect x="525" y="100" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">功能验证</text>
<text x="630.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检查设计行为</text>
<rect x="770" y="100" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">物理设计</text>
<text x="875.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">布局与布线</text>
<path d="M250,155.0 L269,155.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,155.0 L514,155.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,155.0 L759,155.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="330" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="376.0" text-anchor="middle" font-size="23" style="fill:#1e293b">系统使用</text>
<text x="140.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">软件与应用</text>
<rect x="280" y="330" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="376.0" text-anchor="middle" font-size="23" style="fill:#1e293b">封装和测试</text>
<text x="385.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">成品筛选</text>
<rect x="525" y="330" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="376.0" text-anchor="middle" font-size="23" style="fill:#1e293b">晶圆制造</text>
<text x="630.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">多道工艺加工</text>
<rect x="770" y="330" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="376.0" text-anchor="middle" font-size="23" style="fill:#1e293b">流片</text>
<text x="875.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">提交制造设计</text>
