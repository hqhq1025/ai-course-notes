<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595">
<title>AI 加速器在不同位置改变系统</title><desc>四行是节目讨论的架构取向，不是性能排名；每种路线都要适配模型、编译器、容量与系统规模。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="595" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">AI 加速器在不同位置改变系统</text>
<rect x="40" y="100" width="235" height="75" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="157.5" y="145.5" text-anchor="middle" font-size="23" style="fill:#1e293b">NVIDIA GPU</text>
<rect x="300" y="100" width="660" height="75" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="630.0" y="145.5" text-anchor="middle" font-size="23" style="fill:#1e293b">通用并行计算、软件生态与系统集成</text>
<rect x="40" y="205" width="235" height="75" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="157.5" y="250.5" text-anchor="middle" font-size="23" style="fill:#1e293b">Groq</text>
<rect x="300" y="205" width="660" height="75" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="630.0" y="250.5" text-anchor="middle" font-size="23" style="fill:#1e293b">确定性调度与片上存储取向</text>
<rect x="40" y="310" width="235" height="75" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="157.5" y="355.5" text-anchor="middle" font-size="23" style="fill:#1e293b">Cerebras</text>
<rect x="300" y="310" width="660" height="75" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="355.5" text-anchor="middle" font-size="23" style="fill:#1e293b">晶圆级集成，减少部分跨芯片搬运</text>
<rect x="40" y="415" width="235" height="75" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="157.5" y="460.5" text-anchor="middle" font-size="23" style="fill:#1e293b">SambaNova</text>
<rect x="300" y="415" width="660" height="75" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="630.0" y="460.5" text-anchor="middle" font-size="23" style="fill:#1e293b">可重构数据流与模型映射</text>
<text x="500" y="563" text-anchor="middle" font-size="22" style="fill:#1e293b">比较条件：模型、精度、输入长度、批大小、服务目标</text>
</svg>
