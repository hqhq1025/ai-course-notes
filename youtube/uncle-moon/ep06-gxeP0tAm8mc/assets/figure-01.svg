<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455">
<title>有效算力由整条执行链决定</title><desc>应用需求经模型和运行时转成芯片上的工作；下方指出优化要回到实际任务的结果与成本。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="455" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">有效算力由整条执行链决定</text>
<rect x="35" y="115" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">应用需求</text>
<text x="140.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">回答／服务目标</text>
<rect x="280" y="115" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">模型与算法</text>
<text x="385.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">运算与数据</text>
<rect x="525" y="115" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">软件运行时</text>
<text x="630.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">映射与调度</text>
<rect x="770" y="115" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">芯片与系统</text>
<text x="875.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">计算／存储／互联</text>
<path d="M250,170.0 L269,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,170.0 L514,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,170.0 L759,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140" y="320" width="720" height="72" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="364.0" text-anchor="middle" font-size="23" style="fill:#1e293b">优化目标：满足效果与时延要求的有效任务成本</text>
</svg>
