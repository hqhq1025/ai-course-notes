<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>预填充与解码使用同一模型的不同方式</title><desc>上行一次处理已知输入，生成键值缓存；下行反复生成新token并更新缓存，数据搬运与计算共同影响时延。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="560" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">预填充与解码使用同一模型的不同方式</text>
<rect x="35" y="110" width="235" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="152.5" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">输入 token 序列</text>
<text x="152.5" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">已知上下文</text>
<rect x="370" y="110" width="260" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Prefill 预填充</text>
<text x="500.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">处理完整输入</text>
<rect x="730" y="110" width="235" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="847.5" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">KV 缓存</text>
<text x="847.5" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">保留键和值</text>
<path d="M276,165 L354,165" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M636,165 L714,165" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="340" width="235" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="152.5" y="384.0" text-anchor="middle" font-size="23" style="fill:#1e293b">已生成 token</text>
<text x="152.5" y="418.0" text-anchor="middle" font-size="23" style="fill:#1e293b">逐步扩展序列</text>
<rect x="370" y="340" width="260" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="384.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Decode 解码</text>
<text x="500.0" y="418.0" text-anchor="middle" font-size="23" style="fill:#1e293b">预测下一个 token</text>
<rect x="730" y="340" width="235" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="847.5" y="384.0" text-anchor="middle" font-size="23" style="fill:#1e293b">读取并更新</text>
<text x="847.5" y="418.0" text-anchor="middle" font-size="23" style="fill:#1e293b">KV 缓存</text>
<path d="M276,395 L354,395" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M636,395 L714,395" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M849,228 L849,327" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500,450 L500,495 L153,495 L153,453" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
