<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<title>AI 工具把工程师的学习反馈缩短</title><desc>从基础知识形成问题，借助AI实现候选，再以真实反馈检验；判断能力来自持续修正。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="470" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">AI 工具把工程师的学习反馈缩短</text>
<rect x="35" y="115" width="210" height="110" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">理解计算机基础</text>
<text x="140.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">知道数据怎样流动</text>
<rect x="280" y="115" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="385.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">定义实际问题</text>
<text x="385.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确交付目标</text>
<rect x="525" y="115" width="210" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用 AI 辅助实现</text>
<text x="630.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">生成与试验</text>
<rect x="770" y="115" width="210" height="110" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="875.0" y="161.0" text-anchor="middle" font-size="23" style="fill:#1e293b">读懂结果</text>
<text x="875.0" y="195.0" text-anchor="middle" font-size="23" style="fill:#1e293b">修正下一次判断</text>
<path d="M250,170.0 L269,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495,170.0 L514,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,170.0 L759,170.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M867,233 L867,283 L140,283 L140,233" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="374" text-anchor="middle" font-size="24" style="fill:#1e293b">学习成果体现在解释、验证与交付能力中</text>
</svg>
