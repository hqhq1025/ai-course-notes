<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>指令集、实现与制造属于不同层次</title><desc>三层依次说明软件约定、具体微架构和制造；开放指令集只开放其中一层，制程节点不能直接解释全部性能。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="560" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">指令集、实现与制造属于不同层次</text>
<rect x="110" y="105" width="780" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="146.0" text-anchor="middle" font-size="23" style="fill:#1e293b">指令集 ISA</text>
<text x="500.0" y="180.0" text-anchor="middle" font-size="23" style="fill:#1e293b">软件可见的指令与行为约定；如 RISC-V</text>
<rect x="110" y="240" width="780" height="100" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="281.0" text-anchor="middle" font-size="23" style="fill:#1e293b">微架构与芯片设计</text>
<text x="500.0" y="315.0" text-anchor="middle" font-size="23" style="fill:#1e293b">具体流水线、缓存、互联与实现取舍</text>
<rect x="110" y="375" width="780" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="416.0" text-anchor="middle" font-size="23" style="fill:#1e293b">制造、封装与系统</text>
<text x="500.0" y="450.0" text-anchor="middle" font-size="23" style="fill:#1e293b">晶圆工艺、良率、封装、供电和散热</text>
<path d="M500,211 L500,229" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500,346 L500,364" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="529" text-anchor="middle" font-size="22" style="fill:#1e293b">节点名不是所有尺寸；能效、密度、成本需要一起看</text>
</svg>
