<text x="830.0" y="399.0" text-anchor="middle" font-size="23" style="fill:#1e293b">生态与维护</text>
<text x="830.0" y="433.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工具／伙伴／长期投入</text>
