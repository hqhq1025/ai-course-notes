<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465">
<title>不同资产可能暴露于同一种风险</title><desc>上方同一个科技行业变化可以同时影响工资、雇主股票与当地住房需求。三条路径指向家庭现金流，说明资产名称不同不等于风险来源不同。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="465" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">不同资产可能暴露于同一种风险</text>
<rect x="290" y="75" width="420" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="119.0" text-anchor="middle" font-size="23" style="fill:#1e293b">科技行业与雇主状况</text>
<rect x="40" y="225" width="270" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="269.0" text-anchor="middle" font-size="23" style="fill:#1e293b">工资与职业</text>
<text x="175.0" y="303.0" text-anchor="middle" font-size="23" style="fill:#1e293b">未来收入</text>
<path d="M500,155 C500,185 175,185 175,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="365" y="225" width="270" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="269.0" text-anchor="middle" font-size="23" style="fill:#1e293b">雇主股票</text>
<text x="500.0" y="303.0" text-anchor="middle" font-size="23" style="fill:#1e293b">持仓市值</text>
<path d="M500,155 C500,185 500,185 500,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="690" y="225" width="270" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="825.0" y="269.0" text-anchor="middle" font-size="23" style="fill:#1e293b">当地房产</text>
<text x="825.0" y="303.0" text-anchor="middle" font-size="23" style="fill:#1e293b">需求与房贷</text>
<path d="M500,155 C500,185 825,185 825,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="415" text-anchor="middle" font-size="22" style="fill:#1e293b">规划先看家庭现金流、消费底线与集中暴露</text>
</svg>
