<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
<title>技术落地需要组织配合</title><desc>上方是管理者搭建的支持条件，下方才是团队执行和实验的闭环。上下两层配合，算法才有进入产品和收到反馈的机会。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">技术落地需要组织配合</text>
<rect x="70" y="85" width="860" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="129.0" text-anchor="middle" font-size="23" style="fill:#1e293b">管理支持：统一优先级 · 数据与实验基础 · 跨团队清障</text>
<path d="M500,167 L500,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="230" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="274.0" text-anchor="middle" font-size="23" style="fill:#1e293b">业务问题</text>
<text x="140.0" y="308.0" text-anchor="middle" font-size="23" style="fill:#1e293b">团队提出方案</text>
<rect x="275" y="230" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="380.0" y="274.0" text-anchor="middle" font-size="23" style="fill:#1e293b">数据与原型</text>
<text x="380.0" y="308.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检验可行性</text>
<rect x="515" y="230" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="620.0" y="274.0" text-anchor="middle" font-size="23" style="fill:#1e293b">上线实验</text>
<text x="620.0" y="308.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察影响</text>
<rect x="755" y="230" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="860.0" y="274.0" text-anchor="middle" font-size="23" style="fill:#1e293b">复盘与迭代</text>
<text x="860.0" y="308.0" text-anchor="middle" font-size="23" style="fill:#1e293b">下一步责任</text>
<path d="M250,283.0 L264,283.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,283.0 L504,283.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,283.0 L744,283.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="418" text-anchor="middle" font-size="22" style="fill:#1e293b">自主提出方案，也要对交付与结果负责</text>
</svg>
