<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<title>从学习问题到可观察的结果</title><desc>从理解评价规则到补足能力，再到真实任务与结果。箭头代表学习和实践的次序；商业反馈帮助选择下一步，不表示所有技术工作都必须立即赚钱。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="380" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从学习问题到可观察的结果</text>
<rect x="35" y="115" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="159.0" text-anchor="middle" font-size="23" style="fill:#1e293b">明确问题</text>
<text x="140.0" y="193.0" text-anchor="middle" font-size="23" style="fill:#1e293b">评价规则</text>
<rect x="275" y="115" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="159.0" text-anchor="middle" font-size="23" style="fill:#1e293b">补足能力</text>
<text x="380.0" y="193.0" text-anchor="middle" font-size="23" style="fill:#1e293b">课程／项目</text>
<rect x="515" y="115" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="159.0" text-anchor="middle" font-size="23" style="fill:#1e293b">进入真实任务</text>
<text x="620.0" y="193.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用户／业务</text>
<rect x="755" y="115" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="159.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察结果</text>
<text x="860.0" y="193.0" text-anchor="middle" font-size="23" style="fill:#1e293b">调整方向</text>
<path d="M250,168.0 L264,168.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,168.0 L504,168.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,168.0 L744,168.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="295" text-anchor="middle" font-size="22" style="fill:#1e293b">从考试、CMU 项目到机器学习应用：先问要解决什么</text>
</svg>
