<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465">
<title>局部提速与整体收益之间还有哪些环节</title><desc>上方是20%工作环节提速5倍的假设算例，其余80%不变时，总耗时降到84%。下方说明任务效率还要经过交付和获客，才能形成可分配收益。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="465" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">局部提速与整体收益之间还有哪些环节</text>
<rect x="40" y="85" width="425" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="252.5" y="129.0" text-anchor="middle" font-size="23" style="fill:#1e293b">原总耗时：100%</text>
<text x="252.5" y="163.0" text-anchor="middle" font-size="23" style="fill:#1e293b">待提速环节 20% ＋ 其余 80%</text>
<rect x="535" y="85" width="425" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="747.5" y="129.0" text-anchor="middle" font-size="23" style="fill:#1e293b">新总耗时：84%</text>
<text x="747.5" y="163.0" text-anchor="middle" font-size="23" style="fill:#1e293b">20% ÷ 5 ＋ 80%</text>
<path d="M475,140 L523,140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="285" width="270" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务提速</text>
<text x="175.0" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">完成有效工作</text>
<rect x="365" y="285" width="270" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">交付与获客</text>
<text x="500.0" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">形成业务结果</text>
<rect x="690" y="285" width="270" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="825.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">收益与分配</text>
<text x="825.0" y="363.0" text-anchor="middle" font-size="23" style="fill:#1e293b">调整参与激励</text>
<path d="M315,338.0 L354,338.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M640,338.0 L679,338.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="440" text-anchor="middle" font-size="22" style="fill:#1e293b">教学算例：整体速度约为原来的 1.19 倍</text>
</svg>
