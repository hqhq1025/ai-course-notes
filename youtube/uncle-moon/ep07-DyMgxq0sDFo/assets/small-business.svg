<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<title>从真实需求到能持续经营的小项目</title><desc>四个阶段依次是需求证据、产品提供、成本收入和迭代。需求既可来自本人长期遇到的问题，也可来自关键词等外部线索，但仍要看用户是否使用。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="420" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从真实需求到能持续经营的小项目</text>
<rect x="35" y="105" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">找到真实需求</text>
<text x="140.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">亲历／搜索</text>
<rect x="275" y="105" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">做出可用产品</text>
<text x="380.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">备考资料</text>
<rect x="515" y="105" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">算清每笔账</text>
<text x="620.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">收入／成本</text>
<rect x="755" y="105" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察用户反馈</text>
<text x="860.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">继续／调整</text>
<path d="M250,158.0 L264,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,158.0 L504,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,158.0 L744,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130" y="285" width="740" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">“零人”仍需要选题、查看运行与经营决策</text>
</svg>
