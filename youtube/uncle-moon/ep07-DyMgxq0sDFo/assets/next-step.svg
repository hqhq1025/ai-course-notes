<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415">
<title>从自己的约束出发做一次小规模实践</title><desc>四个步骤将家庭财务约束、既有经验、一手信息和小规模产品尝试连接起来。结果帮助下一次选择；人物的具体职业和消费安排无需照搬。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="415" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从自己的约束出发做一次小规模实践</text>
<rect x="35" y="105" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">梳理生活目标</text>
<text x="140.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">时间／现金流</text>
<rect x="275" y="105" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">盘点行业经验</text>
<text x="380.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">能解决的问题</text>
<rect x="515" y="105" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">接触一手实践</text>
<text x="620.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">客户／做事者</text>
<rect x="755" y="105" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="149.0" text-anchor="middle" font-size="23" style="fill:#1e293b">试做一个产品</text>
<text x="860.0" y="183.0" text-anchor="middle" font-size="23" style="fill:#1e293b">观察使用反馈</text>
<path d="M250,158.0 L264,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,158.0 L504,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,158.0 L744,158.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130" y="280" width="740" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="324.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用实际结果更新判断，再决定下一步投入</text>
</svg>
