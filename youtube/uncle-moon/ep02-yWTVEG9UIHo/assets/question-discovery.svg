<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445">
<title>寻找问题：历史线索与一线观察</title><desc>两种输入进入同一个判断过程：历史告诉我们哪些约束曾重要，一线观察告诉我们哪些约束正在变化；小规模探索检验问题是否成立。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="445" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">寻找问题：历史线索与一线观察</text>
<rect x="60" y="95" width="380" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">技术史与经典论文</text>
<text x="250.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">当时约束／解决方式</text>
<rect x="560" y="95" width="380" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="750.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">真实系统与工程工作</text>
<text x="750.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">现在瓶颈／需求变化</text>
<path d="M250,207 L250,252 L490,252" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M750,207 L750,252 L510,252" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205" y="280" width="590" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="324.0" text-anchor="middle" font-size="23" style="fill:#1e293b">提出问题 → 小规模探索 → 修正判断</text>
<text x="500" y="422" text-anchor="middle" font-size="21" style="fill:#1e293b">导师提供方向和反馈，学生保留探索与解决问题的空间</text>
</svg>
