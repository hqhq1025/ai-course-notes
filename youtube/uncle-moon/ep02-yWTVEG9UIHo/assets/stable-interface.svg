<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490">
<title>稳定接口连接多样化的上下层</title><desc>上方是应用和Agent，中间是相对稳定的请求响应接口，下方有不同模型与推理后端。这个细腰是网络历史的类比，缓存数据层仍需建立自己的兼容约定。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="490" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">稳定接口连接多样化的上下层</text>
<rect x="45" y="90" width="270" height="65" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180.0" y="130.5" text-anchor="middle" font-size="23" style="fill:#1e293b">应用</text>
<path d="M180,162 L180,195 L500,195 L500,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="365" y="90" width="270" height="65" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="130.5" text-anchor="middle" font-size="23" style="fill:#1e293b">Agent</text>
<path d="M500,162 L500,195 L500,195 L500,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="685" y="90" width="270" height="65" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="820.0" y="130.5" text-anchor="middle" font-size="23" style="fill:#1e293b">开发工具</text>
<path d="M820,162 L820,195 L500,195 L500,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="235" y="230" width="530" height="80" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="278.0" text-anchor="middle" font-size="23" style="fill:#1e293b">兼容的请求与响应格式</text>
<path d="M500,317 L500,345 L180,345 L180,366" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="380" width="270" height="65" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="180.0" y="420.5" text-anchor="middle" font-size="23" style="fill:#1e293b">模型与服务 A</text>
<path d="M500,317 L500,345 L500,345 L500,366" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="365" y="380" width="270" height="65" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="420.5" text-anchor="middle" font-size="23" style="fill:#1e293b">推理引擎 B</text>
<path d="M500,317 L500,345 L820,345 L820,366" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="685" y="380" width="270" height="65" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="820.0" y="420.5" text-anchor="middle" font-size="23" style="fill:#1e293b">硬件与平台 C</text>
<text x="500" y="474" text-anchor="middle" font-size="21" style="fill:#1e293b">模块可替换仍需承担传输、调度和兼容成本</text>
</svg>
