<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485">
<title>相同上下文：重算还是加载已有 KV</title><desc>上行首次读取长文档，prefill生成KV缓存；下行后续请求在兼容同前缀时加载缓存，再处理新增问题并解码。缓存减少部分重算，加载和存储仍占用资源。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="485" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">相同上下文：重算还是加载已有 KV</text>
<rect x="35" y="100" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">首次：文档＋问题</text>
<text x="140.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">输入 token</text>
<rect x="275" y="100" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Prefill</text>
<text x="380.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">计算 K、V 张量</text>
<rect x="515" y="100" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">Decode</text>
<text x="620.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">逐步生成回答</text>
<rect x="755" y="100" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="144.0" text-anchor="middle" font-size="23" style="fill:#1e293b">保存可复用 KV</text>
<text x="860.0" y="178.0" text-anchor="middle" font-size="23" style="fill:#1e293b">准备后续加载</text>
<path d="M250,153.0 L264,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,153.0 L504,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,153.0 L744,153.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="300" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">后续：同文档</text>
<text x="140.0" y="378.0" text-anchor="middle" font-size="23" style="fill:#1e293b">新的问题</text>
<rect x="275" y="300" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">加载前缀 KV</text>
<text x="380.0" y="378.0" text-anchor="middle" font-size="23" style="fill:#1e293b">兼容模型与位置</text>
<rect x="515" y="300" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">处理新增 token</text>
<text x="620.0" y="378.0" text-anchor="middle" font-size="23" style="fill:#1e293b">继续生成</text>
<rect x="755" y="300" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="344.0" text-anchor="middle" font-size="23" style="fill:#1e293b">本次回答</text>
<text x="860.0" y="378.0" text-anchor="middle" font-size="23" style="fill:#1e293b">任务结果</text>
<path d="M250,353.0 L264,353.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,353.0 L504,353.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,353.0 L744,353.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M865,215 L865,257 L380,257 L380,288" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="466" text-anchor="middle" font-size="21" style="fill:#1e293b">示意比较不表示固定的节省比例</text>
</svg>
