<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<title>从研究协作到平等的公司决策</title><desc>左侧提出机会和方向，右侧提供实现约束，中间通过信任形成阶段行动。底部用客户反馈与进展代替等待论文截止日。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="440" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">从研究协作到平等的公司决策</text>
<rect x="45" y="95" width="350" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="220.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">方向与需求判断</text>
<text x="220.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">为什么值得做</text>
<rect x="605" y="95" width="350" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="780.0" y="139.0" text-anchor="middle" font-size="23" style="fill:#1e293b">技术与执行判断</text>
<text x="780.0" y="173.0" text-anchor="middle" font-size="23" style="fill:#1e293b">现在能做到哪一步</text>
<path d="M405,148 L488,148" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M595,180 L512,180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="137" text-anchor="middle" font-size="23" style="fill:#1e293b">共同</text>
<text x="500" y="169" text-anchor="middle" font-size="23" style="fill:#1e293b">决策</text>
<rect x="135" y="285" width="730" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="329.0" text-anchor="middle" font-size="23" style="fill:#1e293b">阶段交付 → 用户反馈 → 调整优先级 → 下一次交付</text>
<path d="M220,215 L220,274" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,215 L780,274" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="418" text-anchor="middle" font-size="20" style="fill:#1e293b">既有师生合作带来信任；联创之间平等讨论技术反对意见</text>
</svg>
