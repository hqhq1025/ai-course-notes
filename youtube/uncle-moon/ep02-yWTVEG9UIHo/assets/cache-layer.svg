<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485">
<title>LMCache 连接推理引擎与存储层</title><desc>上方不同推理引擎经过连接器进入缓存管理层，再接下方不同存储介质。旁注压缩与片段复用是不同能力；共享接口不消除模型兼容要求。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="485" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">LMCache 连接推理引擎与存储层</text>
<rect x="65" y="90" width="370" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250.0" y="134.0" text-anchor="middle" font-size="23" style="fill:#1e293b">推理引擎 A</text>
<text x="250.0" y="168.0" text-anchor="middle" font-size="23" style="fill:#1e293b">加载／保存 KV</text>
<rect x="565" y="90" width="370" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="750.0" y="134.0" text-anchor="middle" font-size="23" style="fill:#1e293b">推理引擎 B</text>
<text x="750.0" y="168.0" text-anchor="middle" font-size="23" style="fill:#1e293b">加载／保存 KV</text>
<path d="M250,203 L250,228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M750,203 L750,228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="95" y="245" width="810" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="289.0" text-anchor="middle" font-size="23" style="fill:#1e293b">LMCache：缓存管理、传输与连接器</text>
<path d="M175,324 L175,353" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="270" height="64" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="175.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">CPU 内存</text>
<path d="M500,324 L500,353" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="365" y="370" width="270" height="64" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="500.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">本地 SSD</text>
<path d="M825,324 L825,353" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="690" y="370" width="270" height="64" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="825.0" y="410.0" text-anchor="middle" font-size="23" style="fill:#1e293b">远程存储</text>
<text x="500" y="470" text-anchor="middle" font-size="20" style="fill:#1e293b">CacheGen：压缩传输；CacheBlend：选择性重算后的片段复用</text>
</svg>
