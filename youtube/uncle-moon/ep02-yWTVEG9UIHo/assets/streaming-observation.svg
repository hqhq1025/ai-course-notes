<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<title>视频体验是整条传输链的结果</title><desc>上行展示服务到用户的传输路径。播放器上报的体验指标汇集成大规模观测，帮助分析网络和服务质量，观测相关性不自动定位唯一故障。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="460" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">视频体验是整条传输链的结果</text>
<rect x="35" y="110" width="210" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">内容服务与编码</text>
<text x="140.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">准备视频片段</text>
<rect x="275" y="110" width="210" height="106" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="380.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">CDN 节点</text>
<text x="380.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">靠近用户缓存</text>
<rect x="515" y="110" width="210" height="106" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="620.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">网络传输</text>
<text x="620.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">带宽与拥塞</text>
<rect x="755" y="110" width="210" height="106" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="860.0" y="154.0" text-anchor="middle" font-size="23" style="fill:#1e293b">用户播放器</text>
<text x="860.0" y="188.0" text-anchor="middle" font-size="23" style="fill:#1e293b">缓冲／解码／显示</text>
<path d="M250,163.0 L264,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,163.0 L504,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M730,163.0 L744,163.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="185" y="315" width="630" height="72" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="359.0" text-anchor="middle" font-size="23" style="fill:#1e293b">播放观测汇总：清晰度／卡顿／起播等待</text>
<path d="M865,225 L865,350 L828,350" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M175,350 L140,350 L140,225" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="438" text-anchor="middle" font-size="22" style="fill:#1e293b">把体验数据用于发现共同问题和选择优化位置</text>
</svg>
