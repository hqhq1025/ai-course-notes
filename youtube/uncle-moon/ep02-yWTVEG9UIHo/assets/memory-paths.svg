<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445">
<title>改进模型行为的三条互补路径</title><desc>三列分别改变权重、上下文和推理中间状态。缓存管理能节约重算；更深的内部状态优化需结合任务质量检验，不等于永久训练。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, sans-serif; fill:#1e293b; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="445" fill="white"/>
<text x="500" y="49" text-anchor="middle" font-size="30" style="fill:#1e293b">改进模型行为的三条互补路径</text>
<text x="175" y="110" text-anchor="middle" font-size="26" style="fill:#1e293b">训练模型</text>
<rect x="40" y="142" width="270" height="118" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="192.0" text-anchor="middle" font-size="23" style="fill:#1e293b">改变模型权重</text>
<text x="175.0" y="226.0" text-anchor="middle" font-size="23" style="fill:#1e293b">训练数据与优化</text>
<path d="M175,268 L175,312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="110" text-anchor="middle" font-size="26" style="fill:#1e293b">组织上下文</text>
<rect x="365" y="142" width="270" height="118" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="500.0" y="192.0" text-anchor="middle" font-size="23" style="fill:#1e293b">选择输入内容</text>
<text x="500.0" y="226.0" text-anchor="middle" font-size="23" style="fill:#1e293b">检索／提示／历史</text>
<path d="M500,268 L500,312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="825" y="110" text-anchor="middle" font-size="26" style="fill:#1e293b">管理内部状态</text>
<rect x="690" y="142" width="270" height="118" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="825.0" y="192.0" text-anchor="middle" font-size="23" style="fill:#1e293b">保存与复用 KV</text>
<text x="825.0" y="226.0" text-anchor="middle" font-size="23" style="fill:#1e293b">研究选择和优化</text>
<path d="M825,268 L825,312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="325" width="700" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="500.0" y="369.0" text-anchor="middle" font-size="23" style="fill:#1e293b">共同目标：任务效果、效率与适合当前问题的行为</text>
</svg>
