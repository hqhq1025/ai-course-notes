<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><style>text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;}</style><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker></defs><rect width="1000" height="440" fill="white"/><text x="500" y="48" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b">git add 冻结的是当时的内容</text><rect x="70" y="115" width="210" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/><text x="175.0" y="153.0" font-size="20" fill="#1e40af" text-anchor="middle">工作区：A</text><text x="175.0" y="181.0" font-size="16" fill="#1e40af" text-anchor="middle">正在编辑的文件</text><rect x="395" y="115" width="210" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.7"/><text x="500.0" y="153.0" font-size="20" fill="#b45309" text-anchor="middle">暂存区：A</text><text x="500.0" y="181.0" font-size="16" fill="#b45309" text-anchor="middle">add 时的快照</text><rect x="720" y="115" width="210" height="90" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.7"/><text x="825.0" y="153.0" font-size="20" fill="#166534" text-anchor="middle">提交：A</text><text x="825.0" y="181.0" font-size="16" fill="#166534" text-anchor="middle">普通 commit 的内容</text><path d="M285,160 L384,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="335" y="135" font-size="17" fill="#1e293b" text-anchor="middle">git add</text><path d="M610,160 L709,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="660" y="135" font-size="17" fill="#1e293b" text-anchor="middle">git commit</text><rect x="70" y="255" width="210" height="70" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.7"/><text x="175.0" y="283.0" font-size="20" fill="#6b21a8" text-anchor="middle">工作区：B</text><text x="175.0" y="311.0" font-size="16" fill="#6b21a8" text-anchor="middle">add 后再次编辑</text><path d="M175,210 L175,244" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="295" y="236" font-size="17" fill="#6b21a8" text-anchor="middle">继续修改</text><text x="660" y="285" font-size="20" fill="#1e293b" text-anchor="middle">暂存区仍为 A；B 不会自动进入提交</text><text x="500" y="365" font-size="17" fill="#475569" text-anchor="middle">再次 git add 才更新暂存区；git diff 可观察 B 相对 A 的差异</text><text x="500" y="409" font-size="15" fill="#64748b" text-anchor="middle">据第 3 讲绘制</text></svg>
