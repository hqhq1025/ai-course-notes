<style>
  :root {
    --bg: #ffffff; --fg: #111111;
    --muted: #555555; --border: #999999;
    --blue: #1e3a8a; --cyan: #0e7490; --green: #15803d;
    --purple: #6d28d9; --red: #b91c1c; --orange: #c2410c; --yellow: #a16207;
    --code-bg: #fafbfc; --quote-bg: #f7f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;                   /* 满屏，无外框 */
    display: none;
    padding: 3vh 4vw;
    overflow: hidden;
    font-size: clamp(20px, 3.25vh, 35px);
    line-height: 1.7;
  }
  .slide .inner {
    position: relative; z-index: 1;   /* 盖在顶部光斑 ::before 之上 */
    display: flow-root;         /* 包含首尾 margin 和浮动，保证测量完整 */
    width: 100%;
    overflow-wrap: anywhere;
    transform-origin: top left;
  }
  /* 翻页过渡：新页沿翻页方向推入、旧页同速推出（--dir 由 JS 按方向设置）。
     两页首尾相接一起移动，任何时刻都铺满屏幕，不会露出白底闪烁。 */
  .slide.active { display: block; z-index: 2; animation: pagein .28s cubic-bezier(.22, .61, .36, 1); }
  .slide.leaving { display: block; z-index: 1; animation: pageout .28s cubic-bezier(.22, .61, .36, 1); }
  @keyframes pagein  { from { transform: translateX(calc(100% * var(--dir, 1))); } }
  /* 旧页少退出 4px：被新页压在下面，盖住两页接缝处的亚像素圆整白线 */
  @keyframes pageout { to   { transform: translateX(calc(var(--dir, 1) * (4px - 100%))); } }
  .slide.no-anim { animation: none; }  /* 初始首页直接显示（须置于上方两条规则之后） */
  /* 标题条：JS 把每页开头的 <h1> 提到 .inner 之外 → 不参与整页等比缩放，
     负 margin 抵消 slide 的 padding，左右/上方始终顶格；无圆角。
     深色毛玻璃：模糊的是 ::before 生成的顶部彩色光斑。 */
  .slide .titlebar {
    position: relative; z-index: 2;
    margin: -3vh -4vw .8em;      /* slide padding 为 3vh 4vw */
    padding: .3em 4vw;           /* 与正文（h2/p/li）左线对齐 */
    background: rgba(59, 7, 100, .72);    /* purple-950 玻璃 */
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    border-bottom: 1px solid rgba(255, 255, 255, .25);
  }
  .slide .titlebar h1 {
    font-size: 1.55em; color: #fff;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .35);
  }
  .slide .titlebar h1 :is(b, strong) { color: #fca5a5; }  /* 深色条上红色加粗提亮 */
  .slide .inner h1 { font-size: 1.55em; margin: 0 0 .6em; border-bottom: 2px solid #8fa3c8; padding-bottom: .3em; }  /* 非页首 h1 兜底 */
  /* 顶部静态彩色光斑：给毛玻璃提供可被模糊的背景（无动画），正文区仍为白底 */
  .slide::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 5em;
    z-index: 0;
    background:
      radial-gradient(30em 10em at 12% -30%, rgba(59, 130, 246, .5), transparent 60%),
      radial-gradient(26em 9em at 58% -50%, rgba(139, 92, 246, .42), transparent 60%),
      radial-gradient(30em 10em at 94% -25%, rgba(6, 182, 212, .4), transparent 60%);
    pointer-events: none;
  }
  .slide h2 { font-size: 1.25em; color: var(--fg); margin: 1em 0 .5em; }
  .slide h3 { font-size: 1.2em; color: var(--muted); margin: 1em 0 .4em; }
  .slide p { margin: .5em 0; }
  .slide :is(b, strong), .slide :is(h1, h2, h3) :is(b, strong) { color: var(--red); }
  .slide ul, .slide ol { padding-left: 1.6em; margin: .5em 0; }
  .slide li { margin: .25em 0; }
  .slide blockquote {
    border-left: 3px solid var(--border); padding: .3em 1.2em; margin: .8em 0;
    color: var(--muted); background: var(--quote-bg);
  }
  .slide blockquote::before {
    content: "\201C";
    float: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.8em;
    line-height: .9;
    margin: .05em .25em 0 0;
    color: #bdbdbd;
    user-select: none;
  }
  .slide code {
    font-size: .9em;
    font-family: "LXGW WenKai Mono", "霞鹜文楷等宽", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .slide pre {
    background: var(--code-bg); border: 1px solid #e5e7eb; border-radius: 8px;
    padding: .4em .6em; margin: .8em 0; overflow: visible;
  }
  .slide pre code { background: none; padding: 0; color: var(--fg); }
  .slide pre code.hljs { overflow: visible; }
  .slide a { color: var(--muted); }
  .slide a.badlink {
    color: var(--red); text-decoration: line-through;
    cursor: not-allowed;
  }
  .slide img.badlink {
    border: 2px dashed var(--red); border-radius: 6px;
    min-width: 8em; min-height: 4em;
    background: repeating-linear-gradient(45deg, #fff, #fff 8px, #fde8e8 8px, #fde8e8 16px);
  }
  .slide .badge {
    display: inline-block;
    font-size: .6em; font-weight: 700;
    color: #fff; background: var(--red);
    border-radius: 3px; padding: .1em .4em;
    vertical-align: .2em;
    text-decoration: none;
  }
  .slide hr { border: none; border-top: 2px solid var(--border); margin: 1.2em 0; }
  .slide img {
    display: block;
    max-width: 90%;
    margin: .8em auto;
    border-radius: 8px;
  }
  /* 图片先限制到正文可用高度，再与其余正文一起参与缩放。支持多图。 */
  .slide .inner img {
    max-height: var(--image-height, 60vh);
    object-fit: contain;
  }
  #pager {
    position: fixed; right: 2.5vw; bottom: 2.5vh;
    font-size: 14px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  /* AI 补充内容（行内 span）：inline-block 让 padding 上下左右都实际占位生效 */
  .slide span.aigc {
    display: inline-block;
    border: 1px dashed #ddccf0;      /* 极淡紫，几乎隐形的虚线 */
    border-radius: 4px;
    padding-left: 0.45em;
    background: #fff;
    color: rgba(76, 29, 149, .75);   /* purple-900，25% 透明 */
  }
  .slide .aigc::before {
    content: "";
    display: inline-block;
    width: .95em; height: .95em;
    margin-right: .2em;
    vertical-align: -.1em;
    background-color: #6b21a8;
    clip-path: polygon(50% 4%, 62% 36%, 96% 50%, 62% 64%, 50% 96%, 36% 64%, 4% 50%, 36% 36%);
  }
  .slide .aigc a { color: rgba(76, 29, 149, .75); }
</style>

c\u5c31\u662f\u4f60\u7684\u5b66\u4e60\u7d20\u6750\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u516c\u4f17\u53f7\u4e0a\u6ee1\u5929\u90fd\u662f GitHub \u94fe\u63a5\u3002\u003c/li\u003e\n\u003cli\u003e\u54ea\u6015\u6ca1\u6709\u4eba\u544a\u8bc9\u4f60\u54ea\u4e2a\u597d\u3001\u54ea\u4e2a\u4e0d\u597d\uff0c\u770b\u5f97\u591a\u4e86\uff0c\u4e5f\u4f1a\u6709\u611f\u89c9\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u201c\u4e0a\u8bfe\u803d\u8bef\u5b66\u4e60\u201d\u7684\u672c\u8d28\u003c/h2\u003e\n\u003cp\u003e\u8bfe\u5916\u7684\u4fe1\u606f\u91cf\u3001\u4fe1\u606f\u5bc6\u5ea6\u5de8\u5927\uff0c\u4f46\u6211\u4eec\u4ece\u672a\u6559\u8fc7\u003cstrong\u003e\u5982\u4f55\u7528\u597d\u003c/strong\u003e\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u628a\u4e00\u6b21\u6d4f\u89c8\u53d8\u6210\u4e00\u4e2a\u5177\u4f53\u95ee\u9898\uff1a\u8fd9\u4e2a\u9879\u76ee\u91cc\u7684\u54ea\u4e00\u4e2a\u7ec6\u8282\uff0c\u662f\u6211\u81ea\u5df1\u505a\u65f6\u4e0d\u4f1a\u60f3\u5230\u7684\uff1f\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u7559\u610f\uff1a\u8ba9\u6bcf\u4e00\u6b21\u9605\u8bfb\u90fd\u6210\u4e3a\u5b66\u4e60\u003c/h1\u003e\n\u003ch2\u003eVirtually Implement\uff1a\u5148\u5728\u8111\u4e2d\u505a\u4e00\u904d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u770b\u5230\u95ee\u9898\uff0c\u5148\u95ee\u81ea\u5df1\uff1a\u6211\u4f1a\u600e\u4e48\u60f3\uff1f\u5982\u4f55 approach\uff1f\u003c/li\u003e\n\u003cli\u003e\u518d\u770b\u4f5c\u8005\u7684\u505a\u6cd5\uff1a\u003c/li\u003e\n\u003cli\u003e\u5982\u679c\u4e00\u81f4\u2014\u2014\u5f88\u597d\u3002\u003c/li\u003e\n\u003cli\u003e\u5982\u679c\u4e0d\u4e00\u81f4\u2014\u2014\u5c31\u662f\u4e00\u4e2a\u5b66\u4e60\u7684\u673a\u4f1a\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5bf9\u7ec6\u8282\u4fdd\u6301\u6ce8\u610f\u529b\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u8bfb\u522b\u4eba\u7684\u4e1c\u897f\uff0c\u751a\u81f3 AI \u751f\u6210\u7684\u4e1c\u897f\uff0c\u90fd\u8981\u6709\u201c\u611f\u77e5\u7ec6\u8282\u201d\u7684\u610f\u8bc6\u3002\u003c/li\u003e\n\u003cli\u003e\u54ea\u6015\u53ea\u770b\u5230\u4e00\u6bb5\u8bdd\uff0c\u4e5f\u53ef\u4ee5\u9884\u6d4b\u4e0b\u4e00\u6bb5\u662f\u4ec0\u4e48\u3002\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u7559\u610f\u003c/strong\u003e\u4f7f\u4f60\u6301\u7eed\u5b66\u4e60\u3001\u6c34\u5e73\u6301\u7eed\u4e0a\u5347\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u5bf9\u7167\u65f6\u518d\u8ffd\u95ee\u4e00\u53e5\uff1a\u201c\u8fd9\u4e2a\u5dee\u5f02\u6765\u81ea\u4ec0\u4e48\u7ea6\u675f\u6216\u5047\u8bbe\uff1f\u201d\u5b66\u4e60\u7814\u7a76\u4e2d\u7684\u201c\u81ea\u6211\u89e3\u91ca\u201d\uff0c\u4e5f\u5173\u6ce8\u628a\u89e3\u9898\u6b65\u9aa4\u4e0e\u80cc\u540e\u7684\u539f\u7406\u8054\u7cfb\u8d77\u6765\u3002\u003ca href=\"https://onlinelibrary.wiley.com/doi/abs/10.1207/s15516709cog1302_1\"\u003eChi et al. (1989)\u003c/a\u003e\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eGit\uff1a\u542c\u8bf4\u8fc7\uff0c\u8fd8\u662f\u7528\u8fc7\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u4e0a\u5468\u7684\u4fdd\u7814\u9762\u8bd5\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u89e3\u91ca\u4ec0\u4e48\u662f Git\uff1a\u591a\u591a\u5c11\u5c11\u90fd\u80fd\u8bf4\u4e24\u53e5\u3002\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit rebase\u003c/code\u003e \u662f\u4ec0\u4e48\uff1a0/10\u3002\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit merge\u003c/code\u003e \u51b2\u7a81\u4ee5\u540e\uff0c\u4f1a\u89c2\u5bdf\u5230\u4ec0\u4e48\uff1f\u003cul\u003e\n\u003cli\u003e\u7adf\u7136\u6ca1\u6709\u4eba\u8bf4\u51fa\uff1a\u6587\u672c\u5185\u5bb9\u51b2\u7a81\u65f6\uff0c\u53cc\u65b9\u5185\u5bb9\u548c\u51b2\u7a81\u6807\u8bb0\u4f1a\u76f4\u63a5\u5199\u5165\u5de5\u4f5c\u533a\u6587\u4ef6\uff1b\u003ccode\u003egit status\u003c/code\u003e \u663e\u793a \u003ccode\u003eboth modified\u003c/code\u003e\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u7b2c\u4e00\u6ca1\u7528\u8fc7\uff0c\u7b2c\u4e8c\u6ca1\u6709\u7559\u610f\u003c/h2\u003e\n\u003cp\u003e\u5982\u679c\u5e73\u65f6\u5237\u5404\u79cd\u6750\u6599\uff0c\u591a\u591a\u5c11\u5c11\u4f1a\u5237\u5230\uff1b\u771f\u6b63\u7528\u8fc7\uff0c\u4e5f\u8981\u7559\u610f\u773c\u524d\u53d1\u751f\u7684\u4e8b\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u89c2\u5bdf\u5165\u53e3\uff1a\u003ca href=\"https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging\"\u003e\u6253\u5f00\u51b2\u7a81\u6587\u4ef6\uff0c\u770b\u770b Git \u7559\u4e0b\u4e86\u4ec0\u4e48\u003c/a\u003e\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eGit \u4e4b\u524d\uff0c\u7248\u672c\u600e\u4e48\u7ba1\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u5148\u628a\u65e7\u7684\u7559\u4e0b\u6765\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6700\u76f4\u63a5\uff1a\u590d\u5236\u6574\u4e2a\u76ee\u5f55\uff0c\u53eb \u003ccode\u003e\u4f5c\u4e1a-v1\u003c/code\u003e\u3001\u003ccode\u003e\u4f5c\u4e1a-v2\u003c/code\u003e\u3001\u003ccode\u003e\u4f5c\u4e1a-\u6700\u7ec8\u7248\u003c/code\u003e\u3002\u003c/span\u003e\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u80fd\u627e\u56de\u65e7\u6587\u4ef6\uff1b\u4f46\u201c\u54ea\u4efd\u4ece\u54ea\u4efd\u6539\u6765\u3001\u8c01\u6539\u4e86\u4ec0\u4e48\u201d\uff0c\u8981\u9760\u4eba\u8bb0\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7528\u5de5\u5177\u8bb0\uff1aRCS \u7b49\u5de5\u5177\u66ff\u4f60\u4fdd\u5b58\u6587\u4ef6\u7684\u5386\u53f2\u7248\u672c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u518d\u8ba9\u5927\u5bb6\u4e00\u8d77\u6539\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eCVS\u3001SVN\uff1a\u628a\u5386\u53f2\u653e\u5728\u4e00\u53f0\u670d\u52a1\u5668\uff0c\u5927\u5bb6\u53d6\u51fa\u6587\u4ef6\u3001\u4fee\u6539\uff0c\u518d\u4ea4\u56de\u53bb\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eGit\uff1a\u4fdd\u5b58\u9879\u76ee\u7684\u4e00\u4e2a\u4e2a\u7248\u672c\uff0c\u4e5f\u8bb0\u5f55\u5b83\u4eec\u7684\u6765\u8def\uff0c\u5e2e\u52a9\u5927\u5bb6\u6c47\u5408\u6539\u52a8\uff1b\u901a\u5e38\u6bcf\u4e2a\u4eba\u672c\u5730\u5c31\u6709\u5b8c\u6574\u5386\u53f2\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control\"\u003e\u7248\u672c\u7ba1\u7406\u7684\u51e0\u79cd\u505a\u6cd5 \u00b7 Pro Git\u003c/a\u003e\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eGit \u4ece\u54ea\u91cc\u6765\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u4e00\u4e2a\u5927\u9879\u76ee\uff0c\u903c\u51fa\u4e86\u81ea\u5df1\u7684\u5de5\u5177\u003c/h2\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u003cimg alt=\"Linux \u5185\u6838\u7248\u672c\u7ba1\u7406\u5386\u53f2\uff1a1991\u20142002 \u5e74\u7528\u8865\u4e01\u4e0e\u6253\u5305\u6587\u4ef6\uff0c2002 \u5e74\u91c7\u7528 BitKeeper\uff0c2005 \u5e74\u514d\u8d39\u4f7f\u7528\u6743\u88ab\u6536\u56de\u540e\u5f00\u53d1 Git\u3002\" src=\"data:image/webp;base64,UklGRnBCAABXRUJQVlA4IGRCAACQhQGdASoABeABPu12tFUppyUjIZTJYTAdiWlu/DOUDSvl0TANTTkCw1hU+E9N3l/9FPnm/Q7vMm9Af5TJUPG39w/tn4xeKv+F+3j05/H/pH8n+Y/999w/Iv1j/VPqr/KvuL+8/tPoB/pf8/+Ono78kf8T1BfzH+ff63+8+wD83/xO3x2P/i/9v/QewL7JfY/+5/iPFz/vPQf7Ef+P/JfAB/Pv7N/5PXv/a+D7+T/4v7ffAF/NP8/+1vu0f3/7ZeiT9F/2/sKfsiIBP9DLxtqKVRbMAlD6GXjbUUqi2YBKH0MvG2opVFswCUPoZeNtRSqLZgEofQy8bailUUbKYuSMCSDJIvjawXEU7Ooy+nSvA3syUV9BggUgkb/BqFtdbhg8ET6gTE0sU5OSPCdwIW6N+HTOxk4yNCsZBl421FKotmASh9DLxtqKVRbMAlD6GXjbT2/2SAmQF7O7eu/+ef4qkK6DQB7pFM6mbG33nhkWScHiMtSUlzF8iVOA4B1JN2CHy3CbAxuWukcBhLlLO0NoCHqzvHFKf5+KcwOK9ED1PiSSXkJFoLSqWQmlSvV7uU+gpBjVXkAzeTCdd4oBUTUomGl34zqgi3K7SK+5y75niCOzN5YkLdLc9Qa1RGLf6GXjbUUqi2YBKH0MvG2opVFswCUPoZbJounhB/TlIY54ozOOIXRB/nAP0xuhUmuBQCfyv4m0v3EBEa2tvMojd9N5LNopy2o24FQuQM7TDeLf6GXjbUUqi2YBKH0MvG2opVFswCUPoZemeU8HHdg/NeH0SXWhY0aJcwCUPoZeNtRSqLZgEofQy8bailUWzAJQ+hl421FKotmASh9DLxtqKVRbMAlD6GXjbUUqirBkyMjTftt32277bd9tsYp1qontLRiWl8TUIiT0obowN0aR62WaiWmgwPiHFW4hxVuIcVbiHFW4 c6\u7f51\u7edc\u003c/h2\u003e\n\u003cp\u003e\u5b66\u4e60\u7684\u65b9\u5f0f\uff0c\u662f\u81ea\u7136\u5730\u201c\u5916\u63a8\u201d\u5b83\uff0c\u8fd9\u6837\u53ef\u4ee5\u5e2e\u4f60\u8bb0\u5fc6\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4f60\u77e5\u9053\u6539\u9519\u4e86\u60f3\u64a4\u9500 \u2192 \u9879\u76ee\u4e5f\u9700\u8981\u80fd\u56de\u53bb\u7684\u65e7\u72b6\u6001\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4f60\u77e5\u9053\u51e0\u4e2a\u6587\u4ef6\u8981\u914d\u5957 \u2192 \u5e94\u5f53\u8bb0\u4f4f\u9879\u76ee\u5728\u540c\u4e00\u65f6\u523b\u7684\u6837\u5b50\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4f60\u77e5\u9053\u591a\u4eba\u4f1a\u540c\u65f6\u4fee\u6539 \u2192 \u9700\u8981\u77e5\u9053\u5404\u81ea\u4ece\u54ea\u91cc\u51fa\u53d1\uff0c\u624d\u80fd\u6c47\u5408\u6539\u52a8\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u8ba9\u201c\u5feb\u7167\u201d\u6210\u4e3a\u63a8\u51fa\u6765\u7684\u9700\u6c42\u003c/h2\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u8bd5\u7740\u9884\u6d4b\uff1a\u5220\u9664\u4e00\u4e2a\u5df2\u7ecf\u63d0\u4ea4\u8fc7\u7684\u6587\u4ef6\uff0c\u518d\u63d0\u4ea4\u4e00\u6b21\uff0c\u65e7\u7248\u672c\u91cc\u8fd8\u80fd\u627e\u5230\u5b83\u5417\uff1f\u80fd\u2014\u2014\u65b0\u5feb\u7167\u91cc\u6ca1\u6709\u5b83\uff0c\u65e7\u5feb\u7167\u4ecd\u7136\u8bb0\u7740\u5b83\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u4ece\u7a7a\u767d\u5f00\u59cb\u003c/h1\u003e\n\u003ch2\u003eTutorial \u544a\u8bc9\u4f60\u7684\u57fa\u672c\u6a21\u578b\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003egit init\u003c/code\u003e \u4f1a\u5f97\u5230\u4e00\u4e2a\u7a7a\u7684 repository (repo)\u3002\u53ef\u4ee5\u4f7f\u7528\u4e00\u4e9b\u4e0d\u77e5\u9053\u4ec0\u4e48\u610f\u601d\u7684\u547d\u4ee4\uff0c\u548c GitHub\u3001GitLab\u3001\u2026\u2026\u5efa\u7acb\u5173\u8054\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003egit clone\u003c/code\u003e\uff1a\u4ece\u8fdc\u5904\u4e0b\u8f7d\u4ee3\u7801\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit add\u003c/code\u003e\uff1a\u53ef\u4ee5\u201c\u6dfb\u52a0\u201d\u5230 Staging Area (Index)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit commit\u003c/code\u003e\uff1a\u53ef\u4ee5\u201c\u63d0\u4ea4\u201d\u4e00\u4e2a\u5feb\u7167\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5c31\u53ef\u4ee5\u5f00\u5de5\u4e86\uff1f\u003c/h2\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u003ccode\u003egit add hello.c\u003c/code\u003e \u4e4b\u540e\uff0c\u53c8\u6539\u4e86 \u003ccode\u003ehello.c\u003c/code\u003e\uff0c\u4e0b\u4e00\u6b21 commit \u4f1a\u63d0\u4ea4\u54ea\u4e2a\u7248\u672c\uff1f\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u63d0\u4ea4\u7684\u662f \u003cstrong\u003eadd \u65f6\u6682\u5b58\u7684\u5185\u5bb9\u003c/strong\u003e\u3002\u4f1a\u8fd0\u884c\u4e00\u4e2a\u547d\u4ee4\uff0c\u548c\u77e5\u9053\u5b83\u6539\u53d8\u4e86\u4ec0\u4e48\uff0c\u662f\u4e24\u56de\u4e8b\u3002\u003ca href=\"https://git-scm.com/docs/git-add\"\u003eGit \u5b98\u65b9\u8bf4\u660e\u003c/a\u003e\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u83b7\u53d6\u4e0b\u4e00\u7ea7\u77e5\u8bc6\u003c/h1\u003e\n\u003ch2\u003e\u5b66\u4f1a\u8ffd\u95ee\uff0c\u5b66\u4e60\u624d\u8fdb\u5165\u6b63\u8f68\u003c/h2\u003e\n\u003cp\u003e\u7edd\u5927\u90e8\u5206\u4eba\u90fd\u5012\u5728\u4e86\u201c\u83b7\u53d6\u4e0b\u4e00\u7ea7\u77e5\u8bc6\u201d\u7684\u8def\u4e0a\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u80fd\u8fd0\u884c\u201d\u4ee5\u540e\uff1a\u4e3a\u4ec0\u4e48\u522b\u4eba\u8fd8\u8981\u5199 \u003ccode\u003e.gitignore\u003c/code\u003e\uff1f\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u6587\u4ef6\u90fd\u5728\u201d\u4ee5\u540e\uff1a\u4e3a\u4ec0\u4e48\u6362\u4e00\u53f0\u7535\u8111\u5c31\u7f16\u8bd1\u4e0d\u4e86\uff1f\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eBest Practice \u4ece\u54ea\u91cc\u6765\uff1f\u003c/h2\u003e\n\u003cp\u003e\u8f6f\u4ef6\u548c\u7cfb\u7edf\u90fd\u6709\u003cstrong\u003e\u7ea6\u5b9a\u4fd7\u6210\u003c/strong\u003e\u7684 best practice\uff0c\u800c\u6bcf\u4e00\u4e2a\u90fd\u662f\u8840\u7684\u6559\u8bad\uff0c\u6216\u8005\u5bf9\u65e7\u8bbe\u8ba1\u5fcd\u65e0\u53ef\u5fcd\u7684\u4ea7\u7269\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u628a\u6e90\u7801\u548c\u7f16\u8bd1\u4ea7\u7269\u4e00\u8d77\u63d0\u4ea4\uff1a\u6e90\u7801\u6539\u4e86\uff0c\u4ea7\u7269\u5fd8\u4e86\u66f4\u65b0\u2014\u2014\u540c\u4e00\u4ef6\u4e8b\u6709\u4e86\u4e24\u4efd\u4e92\u76f8\u77db\u76fe\u7684\u72b6\u6001\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u628a\u81ea\u5df1\u7684\u7edd\u5bf9\u8def\u5f84\u5199\u8fdb\u914d\u7f6e\uff1a\u5728\u6211\u7535\u8111\u4e0a\u80fd\u8dd1\uff0c\u5230\u4e86\u540c\u5b66\u90a3\u91cc\u5c31\u5931\u6548\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u201c\u76ee\u5f55\u91cc\u6709\u4ec0\u4e48\u201d\u548c\u201c\u9879\u76ee\u9700\u8981\u5171\u540c\u4fdd\u5b58\u4ec0\u4e48\u201d\uff0c\u662f\u4e24\u4e2a\u95ee\u9898\u3002\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u591a\u95ee\u4e00\u53e5\uff1a\u4e3a\u4ec0\u4e48\u3001\u8be5\u4e0d\u8be5\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u54ea\u6015\u53ea\u662f\u653e\u4e00\u4e2a hello.c\u003c/h2\u003e\n\u003cp\u003e\u7f3a\u5c11\u8db3\u591f\u7684\u77e5\u8bc6\uff0c\u4e5f\u4f1a\u72af\u9519\u8bef\u3002\u8fd9\u65f6\u5019\uff0c\u5bf9\u7ec6\u8282\u7684\u201c\u6ce8\u610f\u529b\u201d\u5c31\u975e\u5e38\u91cd\u8981\u4e86\u3002\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAGENTS.md: \u5728\u505a\u4efb\u4f55 git \u64cd\u4f5c\u4e4b\u524d\uff0c\u90fd\u9010\u4e2a\u6587\u4ef6\u68c0\u67e5\u53d8\u5316\uff0c\u5e76\u4e3a\u6211 (\u65b0\u624b) \u89e3\u91ca\u662f\u5426\u7b26\u5408 best practice\uff0c\u4e3a\u4ec0\u4e48\uff0c\u4ee5\u53ca\u76f8\u5173\u7684\u6982\u5ff5\u3002\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003e\u8ba9\u89e3\u91ca\u957f\u51fa\u4e0b\u4e00\u6b21\u5224\u65ad\u7684\u80fd\u529b\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ccode\u003ehello.c\u003c/code\u003e\uff1a\u7a0b\u5e8f\u7684\u6e90\u7801\uff0c\u8981\u4fdd\u5b58\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ccode\u003ehello\u003c/code\u003e\uff1a\u5982\u679c\u662f\u7f16\u8bd1\u51fa\u6765\u7684\u53ef\u6267\u884c\u6587\u4ef6\uff0c\u901a\u5e38\u4e0d\u63d0\u4ea4\uff1b\u4fdd\u5b58\u6e90\u7801\u548c\u6784\u5efa\u65b9\u6cd5\uff0c\u8ba9\u522b\u4eba\u4e5f\u80fd\u751f\u6210\u5b83\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u63a5\u7740\u8ffd\u95ee\uff1a\u8fd9\u4e2a\u6587\u4ef6\u662f\u9879\u76ee\u7684\u8f93\u5165\uff0c\u8fd8\u662f\u6784\u5efa\u3001\u8fd0\u884c\u7559\u4e0b\u7684\u4ea7\u7269\uff1f\u522b\u4eba\u62ff\u5230\u4ed3\u5e93\uff0c\u662f\u5426\u5177\u5907\u91cd\u5efa\u5b83\u7684\u6761\u4ef6\uff1f\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u8fdb\u7ec4\u4ee5\u540e\u7684\u9ad8\u8840\u538b\u65f6\u523b\u003c/h1\u003e\n\u003ch2\u003e\u6211\u548c\u8bb8\u591a\u7814\u7a76\u751f\u65b0\u751f\u90fd\u8bf4\u8fc7\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u751f\u6210\u7684\u6587\u4ef6\u4e0d\u63d0\u4ea4 (\u003ccode\u003edist/\u003c/code\u003e\u3001log\u3001\u2026\u2026)\u003c/li\u003e\n\u003cli\u003e\u4e2a\u4eba\u7684\u914d\u7f6e\u4e0d\u63d0\u4ea4 (\u003ccode\u003e.vscode\u003c/code\u003e \u4e2d\u7684\u4e2a\u4eba\u8bbe\u7f6e\u7b49)\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5224\u65ad\u7684\u662f\u7528\u9014\uff1a\u56e2\u961f\u5171\u4eab\u3001\u53ef\u79fb\u690d\u7684\u914d\u7f6e\u53ef\u4ee5\u63d0\u4ea4\uff0c\u4e0d\u80fd\u53ea\u770b\u76ee\u5f55\u540d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u5bc6\u94a5\u4e0d\u80fd\u63d0\u4ea4 (\u5ba1\u7a3f\u7684\u65f6\u5019\u89c1\u8fc7\u597d\u591a)\u003c/li\u003e\n\u003cli\u003e\u4e34\u65f6\u6587\u4ef6\u4e0d\u63d0\u4ea4 (\u003ccode\u003e.DS_Store\u003c/code\u003e\u3001\u2026\u2026)\u003c/li\u003e\n\u003cli\u003e\u89c4\u5219\u662f\u6d3b\u7684\uff1apackage lock, generated header, ...\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5ffd\u7565\u4e0d\u7b49\u4e8e\u9057\u5fd8\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://git-scm.com/docs/gitignore\"\u003e\u003ccode\u003e.gitignore\u003c/code\u003e\u003c/a\u003e \u4e0d\u4f1a\u8ba9\u5df2\u7ecf\u88ab\u8ddf\u8e2a\u7684\u6587\u4ef6\u81ea\u52a8\u9000\u51fa\u7248\u672c\u7ba1\u7406\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5bc6\u94a5\u4e00\u65e6\u6cc4\u9732\uff0c\u5220\u6389\u5f53\u524d\u6587\u4ef6\u4e5f\u4e0d\u80fd\u6536\u56de\u522b\u4eba\u62ff\u5230\u7684\u526f\u672c\uff1b\u5e94\u5148\u64a4\u9500\u6216\u8f6e\u6362\u51ed\u636e\uff0c\u518d\u5904\u7406\u5386\u53f2\u3002\u003ca href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository\"\u003eGitHub \u6307\u5357\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5927\u5199\u8fd8\u662f\u5c0f\u5199\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u771f\u5b9e\u9879\u76ee\u4e2d\u7684\u4e00\u4e2a\u9009\u62e9\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-markdown\"\u003e[TYPO-CHECK] Docs should be typo-free\nv.s.\n[typo-check] Docs should be typo-free\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCheck-rule \u7684\u540d\u5b57\u5e94\u8be5\u662f\u5927\u5199\u8fd8\u662f\u5c0f\u5199\uff1f\u003c/p\u003e\n\u003ch2\u003e\u76f4\u89c9\u4e5f\u503c\u5f97\u8ffd\u95ee\u003c/h2\u003e\n\u003cp\u003e\u6211\u7684\u76f4\u89c9\u662f\u201c\u5927\u5199\u4f3c\u4e4e\u66f4\u597d\uff0c\u4f46\u4e0d\u662f\u6781\u5f3a\u201d\uff0c\u4f46\u4e0d\u592a\u8bf4\u5f97\u51fa\u539f\u56e0\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u5148\u60f3\u4e00\u60f3\uff1a\u65b9\u62ec\u53f7\u91cc\u7684\u5b57\u7b26\uff0c\u662f\u4e00\u53e5\u8bdd\u7684\u4e00\u90e8\u5206\uff0c\u8fd8\u662f\u4e00\u4e2a\u53ef\u4ee5\u88ab\u5f15\u7528\u7684\u89c4\u5219\u540d\u5b57\uff1f\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u8fd9\u91cc\uff0c\u6211\u4f1a\u9009 TYPO-CHECK\u003c/h1\u003e\n\u003ch2\u003e\u7528\u5b57\u5f62\u63d0\u793a\u4e0d\u540c\u7684\u89d2\u8272\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ccode\u003e[TYPO-CHECK]\u003c/code\u003e \u662f\u56fa\u5b9a\u7684\u89c4\u5219\u6807\u8bc6\uff1b\u003ccode\u003eDocs should be typo-free\u003c/code\u003e \u662f\u89e3\u91ca\u89c4\u5219\u7684\u81ea\u7136\u8bed\u8a00\u3002\u5927\u5199\u8ba9\u4e24\u8005\u5728\u89c6\u89c9\u4e0a\u66f4\u5bb9\u6613\u5206\u5f00\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8ba8\u8bba\u201c\u8fdd\u53cd\u4e86 \u003ccode\u003eTYPO-CHECK\u003c/code\u003e\u201d\u65f6\uff0c\u8fd9\u4e2a\u77ed\u540d\u5b57\u4e5f\u66f4\u50cf\u4e00\u4e2a\u660e\u786e\u7684\u5f15\u7528\u3002\u8fd9\u662f\u6b64\u5904\u7684\u8bbe\u8ba1\u5224\u65ad\uff0c\u5e76\u975e\u201c\u5927\u5199\u603b\u662f\u66f4\u53ef\u8bfb\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u7ea6\u5b9a\u8d4b\u4e88\u5b57\u5f62\u542b\u4e49\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e00\u4e2a\u7c7b\u6bd4\uff1a\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8174.html\"\u003eRFC 8174\u003c/a\u003e \u660e\u786e\uff0c\u003ccode\u003eMUST\u003c/code\u003e \u7b49\u5173\u952e\u8bcd\u4ec5\u5728\u5927\u5199\u65f6\u627f\u8f7d\u7ea6\u5b9a\u7684\u7279\u6b8a\u542b\u4e49\uff0c\u907f\u514d\u4e0e\u666e\u901a\u884c\u6587\u6df7\u6dc6\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5b83\u6ca1\u6709\u89c4\u5b9a check-rule \u5fc5\u987b\u5927\u5199\u3002\u9879\u76ee\u82e5\u5df2\u6709\u5c0f\u5199\u89c4\u5219\u4f53\u7cfb\uff0c\u6216\u5de5\u5177\u8981\u6c42\u5c0f\u5199\uff0c\u5e94\u4f18\u5148\u4fdd\u6301\u4e00\u81f4\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u6240\u4ee5\u201c\u5927\u5199\u4f3c\u4e4e\u66f4\u597d\uff0c\u4f46\u4e0d\u662f\u6781\u5f3a\u201d\uff1a\u8fd9\u91cc\u6709\u8ba9\u89c4\u5219\u6807\u8bc6\u66f4\u9192\u76ee\u7684\u7406\u7531\uff0c\u4e5f\u6709\u6bd4\u8fd9\u70b9\u504f\u597d\u66f4\u91cd\u8981\u7684\u4e0a\u4e0b\u6587\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u544a\u522b\u53e4\u6cd5\u5b66\u4e60\u003c/h1\u003e\n\u003ch2\u003e\u8ba1\u7b97\u673a\u79d1\u5b66\u5b9a\u5f8b\uff1a\u4f60\u60f3\u8981\u7684\u5c31\u4e00\u5b9a\u6709\u4eba\u505a\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u628a\u5173\u952e\u7ec6\u8282\u4ee5\u76f4\u89c2\u7684\u65b9\u5f0f\u5448\u73b0\u51fa\u6765\u003c/li\u003e\n\u003cli\u003e\u4eba\u7c7b\u7684\u89c6\u89c9\u7cfb\u7edf\u662f\u975e\u5e38\u9ad8\u6548\u7684\u003cul\u003e\n\u003cli\u003e\u8f6f\u4ef6\u53ef\u89c6\u5316\u5df2\u7ecf\u51e0\u5341\u5e74\u8fdb\u5c55\u7f13\u6162\uff0c\u7136\u540e\uff0c\u5ffd\u7136\u6240\u6709\u95ee\u9898\u90fd\u89e3\u51b3\u4e86\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u628a\u771f\u5b9e\u7684 Git Repo \u5c55\u5f00\u7ed9\u4f60\u770b\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u5b9e\u73b0 gitv \u547d\u4ee4\u884c\u5de5\u5177 (nodejs)\uff0c\u628a\u4e00\u4e2a\u003cstrong\u003e\u771f\u5b9e\u003c/strong\u003e\u7684 git repo (\u4f60\u53ef\u4ee5\u4f7f\u7528 git \u547d\u4ee4) \u8def\u5f84\u91cc\u7684\u4e3b\u8981\u6982\u5ff5\u5f7b\u5e95\u3001\u5b8c\u6574\u5730\u53ef\u89c6\u5316\u3002\u5c55\u793a\u4efb\u4f55\u5bf9\u8c61\u4e4b\u524d\uff0c\u90fd\u4ece\u6587\u4ef6\u7cfb\u7edf\u91cc\u7684\u771f\u5b9e\u6587\u4ef6\u3001\u539f\u59cb bytes \u51fa\u53d1\uff0c\u5c55\u793a\u4e00\u6b65\u6b65\u5982\u4f55\u89e3\u6790\uff0c\u89e3\u6790\u6210\u4e86\u4ec0\u4e48\u3002\u901a\u8fc7\u7a7a\u95f4\u5408\u7406\u7684\u65b9\u5f0f\u6392\u5e03\u5404\u7c7b\u5bf9\u8c61\uff0c\u5e76\u652f\u6301\u62d6\u52a8\uff1b\u660e\u5feb\u3001\u6781\u7b80\u7684\u98ce\u683c\uff0c\u4e0d\u8981\u591a\u4f59\u7684 tooltip text \u7b49\uff0c\u5728\u80fd\u591f self-explain \u7684\u65f6\u5019\u7edd\u4e0d\u51fa\u73b0\u6587\u5b57\u3002\u5927\u5c0f\u6587\u4ef6\u7684\u53ef\u89c6\u5316\u90fd\u8981\u6709\u4e0d\u9519\u7684\u89c6\u89c9\u6548\u679c\uff0c\u5bf9\u4e8e\u6709\u5177\u4f53\u5185\u5bb9\u7684\u6587\u4ef6\uff0c\u6709\u9002\u5f53\u7684\u5927\u5c0f\u548c\u89c6\u89c9\u98ce\u683c\u663e\u793a\u5185\u5bb9\u3001diff \u7b49\u3002\u542f\u52a8\u4e00\u4e2a http server\uff0c\u6301\u7eed\u76d1\u542c\u76ee\u5f55\u4e2d git \u7684\u53d8\u5316\uff0c\u5e76\u4e14\u5728\u53d1\u751f\u53d8\u5316\u540e\uff0c\u7528 css \u52a8\u753b\u6548\u679c\u5c55\u793a repo \u53d1\u751f\u7684\u53d8\u5316\u3002\u6d45\u8272\u80cc\u666f\u9002\u5408\u8bfe\u5802\u5c55\u793a\u3002\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003e\u76f4\u63a5\u751f\u6210\uff0c\u73b0\u573a\u5bf9\u6bd4\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGPT-6 \u76f4\u51fa v.s. \u003ca href=\"https://learngitbranching.js.org/\"\u003ehttps://learngitbranching.js.org/\u003c/a\u003e; \u56fd\u6a21\u76f4\u51fa v.s. \u003ca href=\"https://code.cs61a.org/\"\u003ehttps://code.cs61a.org/\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4ece\u770b\u61c2\u5230\u5b66\u61c2\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7b97\u6cd5\u53ef\u89c6\u5316\u7814\u7a76\u7684\u542f\u53d1\uff1a\u5b66\u4e60\u8005\u600e\u6837\u4f7f\u7528\u53ef\u89c6\u5316\uff0c\u6bd4\u53ef\u89c6\u5316\u5c55\u793a\u4e86\u4ec0\u4e48\u66f4\u5f71\u54cd\u5b66\u4e60\u6548\u679c\u3002\u003ca href=\"https://faculty.cc.gatech.edu/~stasko/papers/jvlc02.pdf\"\u003eHundhausen \u7b49\uff0c2002\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u613f\u610f\u5b66\u61c2\uff0c\u6210\u4e86\u771f\u6b63\u6709\u4ef7\u503c\u7684\u54c1\u8d28\u003c/h1\u003e\n\u003ch2\u003e\u201c\u628a\u7ec6\u8282\u505a\u597d\u201d \u7684 Bar\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5927\u5b66\u91cc\u6ca1\u8bad\u7ec3\u8fc7\uff0c\u771f\u4e0a\u4e86\u6218\u573a\u5c31\u90fd\u5f97\u6b7b\u003c/li\u003e\n\u003cli\u003e\u5f88\u591a\u5927\u5b66\u8001\u5e08\u771f\u6b63\u7684\u597d\u4e1c\u897f\u6253\u5f00\u90fd\u6ca1\u6253\u5f00\u8fc7\uff0c\u5c31\u53ea\u4f1a\u7167\u672c\u5ba3\u79d1\u3001\u65ad\u7ae0\u53d6\u4e49\u003cul\u003e\n\u003cli\u003e\u6211\u771f\u7684\u65e0\u6cd5\u63a5\u53d7\u770b\u516c\u4f17\u53f7\u5b66\u4e60\u4f9d\u7136\u5fc3\u5b89\u7406\u5f97\u7684\u8001\u767b\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u597d\u6d88\u606f\uff1a\u771f\u6b63\u5b66\u61c2\u548c\u6210\u7ee9\u662f\u6b63\u76f8\u5173\u7684\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u613f\u610f\u5b66\u61c2\u003c/strong\u003e\uff0c\u5c31\u6210\u4e86\u771f\u6b63\u6709\u4ef7\u503c\u7684\u54c1\u8d28\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u9057\u61be\u7684\u662f\uff0c\u81ea\u5df1\u7684\u5b66\u4e60\u65f6\u95f4\u975e\u5e38\u6709\u9650\u003c/h2\u003e\n\u003cp\u003e\u003cimg alt=\"\" src=\"data:image/webp;base64,UklGRnoMAABXRUJQVlA4IG4MAADwPwCdASrPAMYAPu1ysFMppqSipDUbQTAdiWlu4W8hG/Nd8jf3ztr/1XiP4/vgHtb66eYPrZ1KflH3R/ceXv+i8GeAR7H/0O9P7H5hHsT9v79zUR8I/8/3APzK8rrwTPtX/V9gD+Sf4f1Y/7L9rvPF+Z/7X2DP5pvRxXqzdst1DygxJGVyisJVnG95mIzqPN/TJRGGWWSB4exxVnG8SXYI4i314eDtP6BL6D6domkP/lKrNw19A88VFcauTF6YCVEaYgp7/7WKVT7IWaWByiKCt0VMV33p6e4d6oBC/Zm1uOiND/l76tZbOMrr3Q7lA60BxAO66TcVjIt8KCnq1Rrib/yy3ewRqJViy+3vdKPUNKELGB8C2e0qHelWS9/kpFMB9qK7zdnozJAayJ//1jPukeea6q412DXuY17Z05GgB2rQQgMzIsLX/9AuIbuS4wmTnY4WlXrS+oEaUNm+MTGQe73XXUtS/8asN0aPjI4E7pi4HURoHkJCOHtxL76naUs8y3ptRwO/9xd78KERj3I0ghxo9HLuRA3Ctvt8ASmpoGwASuAugkyutpWPRo2H6VfWuTTawJjS1Z5ZQE3btK2baSMLRc7J3zcSOBNEVbVHUamIJgWLdtD/zyedmOBqmCpcpta1YOxMuKKvg59880X7wYpYFdq3v/tX7pCSzGmQTP3/wKKZDBuAAP79KbaEVpHZIdwD8ZUi3udxjF0yy4Dg4dEv/3nX5SDO5ao/dQN5uYxr2/HsMT7/5xmCakstZHM6w2sxjXV2d3xUxaf1/9p++8C0AvM92PAKQZ4/iZ29FOQXhJTezf0X6q+6w+D6yJs+1+eriXRSzfr1bJoSxnI7DX8Wui+JAWy0ODOPN1Oglx9Gp2cXH3oQTh6l c/ul\u003e\n\u003ch2\u003e\u4e8c\u3001\u628a\u63a2\u7d22\u6574\u7406\u6210\u522b\u4eba\u80fd\u63a5\u624b\u7684\u53d8\u5316\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u53d1\u5e03\u524d\u6574\u7406\u003c/strong\u003e\uff1a\u6309\u4e00\u4e2a\u610f\u56fe\u62c6\u5206\u63d0\u4ea4\uff0c\u628a\u4fee\u590d\u548c\u76f8\u5e94\u6d4b\u8bd5\u653e\u5728\u4e00\u8d77\uff1b\u987a\u624b\u683c\u5f0f\u5316\u53e6\u5f00\u63d0\u4ea4\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u8ba9\u5386\u53f2\u53ef\u68c0\u9a8c\u003c/strong\u003e\uff1a\u6574\u7406\u540e\u7684\u63d0\u4ea4\u80fd\u6784\u5efa\u3001\u80fd\u6d4b\u8bd5\uff0creview\u3001revert\u3001bisect \u624d\u6709\u53ef\u9760\u7684\u5355\u4f4d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eBest Practices\uff1a\u8ba9\u534f\u4f5c\u53ef\u9884\u671f\u003c/h1\u003e\n\u003ch2\u003e\u4e09\u3001\u7a33\u5b9a\u5171\u540c\u4f9d\u8d56\u7684\u4e1c\u897f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u4e0d\u64c5\u81ea\u6539\u5199\u522b\u4eba\u4f9d\u8d56\u7684\u5386\u53f2\u003c/strong\u003e\uff1a\u6539\u5199\u4f1a\u628a\u6574\u7406\u6210\u672c\u8f6c\u5ac1\u7ed9\u534f\u4f5c\u8005\uff1b\u4fee\u9519\u901a\u5e38\u8ffd\u52a0\u63d0\u4ea4\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u7ea6\u5b9a\u5206\u652f\u4e0e\u53d1\u5e03\u6d41\u7a0b\u003c/strong\u003e\uff1a\u8c01\u5408\u5e76\u3001\u5982\u4f55\u56de\u79fb\u8865\u4e01\u3001\u4f55\u65f6\u6253 tag\uff1b\u5171\u540c\u89c4\u5219\u8ba9\u4ea4\u63a5\u53ef\u9884\u671f\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u56db\u3001\u8ba9\u7ea6\u5b9a\u6709\u6267\u884c\u673a\u5236\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003eHooks + CI\u003c/strong\u003e\uff1a\u672c\u5730\u5c3d\u65e9\u53cd\u9988\uff0c\u670d\u52a1\u7aef\u5b88\u4f4f\u5408\u5165\u6761\u4ef6\uff1b\u540c\u6b65\u4e0a\u6e38\u540e\u91cd\u65b0\u6d4b\u8bd5\u7ec4\u5408\u7ed3\u679c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u8fde\u63a5 issue\u3001commit \u548c\u5ba1\u67e5\u003c/strong\u003e\uff1a\u4ece\u201c\u4e3a\u4ec0\u4e48\u6539\u201d\u80fd\u627e\u5230\u201c\u6539\u4e86\u4ec0\u4e48\u201d\uff0c\u518d\u627e\u5230\u201c\u5982\u4f55\u9a8c\u6536\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u6211\u7684\u5206\u7c7b\uff1a\u964d\u4f4e\u4e22\u5931\u3001\u7406\u89e3\u548c\u534f\u8c03\u6210\u672c\u3002\u539f\u6587\u4e5f\u5f3a\u8c03\uff0c\u5177\u4f53 workflow \u53d6\u51b3\u4e8e\u9879\u76ee\u3002\u003ca href=\"https://sethrobertson.github.io/GitBestPractices/\"\u003eGit Best Practices\u003c/a\u003e\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eSWE-Bench\uff1a\u63a5\u624b\u5df2\u6709\u9879\u76ee\u7684\u4e00\u6b21\u4fee\u6539\u003c/h1\u003e\n\u003ch2\u003e\u8f93\u5165\u662f\u9879\u76ee\u73b0\u573a\uff0c\u8f93\u51fa\u662f\u8865\u4e01\u003c/h2\u003e\n\u003cp\u003e\u7136\u540e\u4f60\u4f1a\u53d1\u73b0\uff0c\u8fd9\u4e9b\u4efb\u52a1\u548c\u8f6f\u4ef6\u5de5\u7a0b\u65e5\u5e38\u4efb\u52a1\u662f\u5173\u8054\u975e\u5e38\u5927\u7684\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ecf\u5178 SWE-bench \u4ece\u771f\u5b9e GitHub issue \u548c\u5bf9\u5e94 PR \u6784\u5efa\u4efb\u52a1\uff1a\u7ed9\u5b9a\u4ed3\u5e93\u3001\u8d77\u59cb\u63d0\u4ea4 \u003ccode\u003ebase_commit\u003c/code\u003e \u548c\u95ee\u9898\u63cf\u8ff0\uff0c\u4ea7\u51fa patch\u3002\u003ca href=\"https://arxiv.org/abs/2310.06770\"\u003e\u4efb\u52a1\u5b9a\u4e49\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u65e5\u5e38\u5de5\u4f5c\u987a\u5e8f\uff1a\u7406\u89e3\u73b0\u8c61 \u2192 \u590d\u73b0 \u2192 \u627e\u8c03\u7528\u8def\u5f84\u548c\u5df2\u6709\u7ea6\u5b9a \u2192 \u4fee\u6539 \u2192 \u9a8c\u8bc1 \u2192 \u68c0\u67e5 diff\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4fee\u597d\u8fd9\u4e2a\u95ee\u9898\uff0c\u540c\u65f6\u5b88\u4f4f\u5df2\u6709\u884c\u4e3a\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ccode\u003eFAIL_TO_PASS\u003c/code\u003e\uff1a\u9488\u5bf9\u95ee\u9898\u7684\u6d4b\u8bd5\uff0c\u7531\u5931\u8d25\u53d8\u4e3a\u901a\u8fc7\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ccode\u003ePASS_TO_PASS\u003c/code\u003e\uff1a\u539f\u6765\u901a\u8fc7\u7684\u6d4b\u8bd5\uff0c\u4fee\u6539\u540e\u4ecd\u7136\u901a\u8fc7\u3002\u003ca href=\"https://www.swebench.com/SWE-bench/api/harness/\"\u003e\u8bc4\u6d4b\u89c4\u5219\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5c0f\u800c\u5b8c\u6574\u7684\u6539\u52a8\u4fbf\u4e8e\u5b9a\u4f4d\u5931\u8d25\uff1b\u56fa\u5b9a\u8d77\u70b9\u8ba9\u522b\u4eba\u80fd\u91cd\u653e\u4fee\u6539\u3002\u524d\u9762\u7684\u4e60\u60ef\uff0c\u5728\u8fd9\u91cc\u90fd\u6709\u7528\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4e00\u884c\u4fee\u590d\uff0c\u80cc\u540e\u662f\u4e00\u6574\u5957\u5de5\u7a0b\u5de5\u4f5c\u003c/h1\u003e\n\u003ch2\u003e\u771f\u5b9e\u4efb\u52a1\uff1aAstropy \u7684\u5d4c\u5957\u6a21\u578b\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://huggingface.co/datasets/SWE-bench/SWE-bench\"\u003eSWE-bench \u4efb\u52a1\u003c/a\u003e \u003ccode\u003eastropy__astropy-12907\u003c/code\u003e\uff1a\u628a\u4e24\u4e2a\u72ec\u7acb\u7ebf\u6027\u6a21\u578b\u5148\u6253\u5305\u518d\u7ec4\u5408\uff0c\u4f9d\u8d56\u77e9\u9635\u5374\u628a\u5b83\u4eec\u7b97\u6210\u4e92\u76f8\u4f9d\u8d56\u3002\u003ca href=\"https://github.com/astropy/astropy/issues/12906\"\u003eIssue #12906\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6839\u56e0\uff1a\u62fc\u63a5\u77e9\u9635\u65f6\uff0c\u628a\u53f3\u4fa7\u5b50\u6a21\u578b\u7684\u4f9d\u8d56\u77e9\u9635\u586b\u6210\u4e86\u5168 1\uff1b\u4fee\u590d\u4e3a\u4fdd\u7559\u539f\u77e9\u9635\u3002\u003ca href=\"https://github.com/astropy/astropy/pull/12907/files\"\u003e\u4ee3\u7801\u6539\u52a8\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u201c\u6539\u5bf9\u201d\u4e4b\u540e\uff0c\u600e\u6837\u8ba9\u9879\u76ee\u63a5\u53d7\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u771f\u5b9e PR \u8fd8\u8865\u4e86\u4e0d\u540c\u5d4c\u5957\u65b9\u5f0f\u7684\u6d4b\u8bd5\u3001changelog\uff1b\u7ecf\u8fc7 review \u5408\u5e76\uff0c\u518d\u56de\u79fb\u5230 \u003ccode\u003ev5.0.x\u003c/code\u003e\u3002\u003ca href=\"https://github.com/astropy/astropy/pull/12907\"\u003ePR #12907\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4ee3\u7801\u89e3\u91ca\u600e\u4e48\u4fee\uff0c\u6d4b\u8bd5\u7559\u4e0b\u8bc1\u636e\uff0cchangelog \u544a\u77e5\u7528\u6237\uff0c\u56de\u79fb\u628a\u4fee\u590d\u9001\u5230\u4ecd\u5728\u7ef4\u62a4\u7684\u7248\u672c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eSWE-bench \u4e3b\u8981\u9a8c\u6536\u8865\u4e01\u7684\u6d4b\u8bd5\u7ed3\u679c\uff1b\u73b0\u5b9e\u9879\u76ee\u8fd8\u8981\u5b8c\u6210\u6c9f\u901a\u3001\u5ba1\u67e5\u548c\u4ea4\u4ed8\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eGit \u4e4b\u5916\uff1agh \u4e0e glab\u003c/h1\u003e\n\u003ch2\u003e\u4ece\u95ee\u9898\u5230\u5408\u5165\uff0c\u628a\u6d41\u7a0b\u63a5\u8d77\u6765\u003c/h2\u003e\n\u003cp\u003e\u751a\u81f3\u4e3a\u4e86\u7ba1\u7406 non-git \u7684\u90e8\u5206\uff0c\u8fd8\u4e13\u95e8\u6709 gh, glab \u8fd9\u4e9b\u5de5\u5177\u3002\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Issue \u7ecf\u672c\u5730\u4fee\u6539\u548c\u6d4b\u8bd5\u3001Git \u63d0\u4ea4\u548c\u63a8\u9001\uff0c\u8fdb\u5165 PR \u6216 MR\uff1bCI \u4e0e\u5ba1\u67e5\u8981\u6c42\u4fee\u6539\u65f6\u8fd4\u56de\u5de5\u4f5c\u533a\uff0c\u \u500d\u003c/h1\u003e\n\u003ch2\u003e\u4e00\u4e2a\u601d\u60f3\u5b9e\u9a8c\uff1a\u4ee3\u7801\u4ea7\u80fd\u66b4\u6da8\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAgent \u53ef\u4ee5 1000X \u66f4\u5feb\u5730\u751f\u4ea7\u4ee3\u7801\u003c/li\u003e\n\u003cli\u003eGit\u201c\u4e3a\u4eba\u8bbe\u8ba1\u201d\u7684\u4f7f\u7528\u65b9\u5f0f\uff0c\u53ef\u80fd\u8ddf\u4e0d\u4e0a\u8fd9\u4e2a\u901f\u5ea6\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u751f\u6210\u4e00\u5206\u949f\uff0c\u4eba\u5de5\u9a8c\u6536\u4e00\u5c0f\u65f6\uff1a\u79ef\u538b\u7684\u662f\u7b49\u5f85\u5224\u65ad\u7684\u53d8\u66f4\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5373\u4f7f\u4fee\u6539\u4e0d\u540c\u6587\u4ef6\uff0c\u4e5f\u53ef\u80fd\u540c\u65f6\u6539\u53d8\u540c\u4e00\u4e2a\u63a5\u53e3\u7ea6\u5b9a\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4ece\u96f6\u8bbe\u8ba1\u4e00\u4e2a Agent VCS\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5feb\u7167\u3001\u53d8\u66f4\uff0c\u4ee5\u53ca\u4e00\u4e2a change algebra\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7cfb\u7edf\u8981\u56de\u7b54\uff1a\u54ea\u4e9b\u53d8\u66f4\u80fd\u7ec4\u5408\u3001\u54ea\u4e9b\u5fc5\u987b\u6392\u961f\u3001\u54ea\u4e9b\u9700\u8981\u91cd\u65b0\u9a8c\u8bc1\uff1f\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u50cf\u6570\u636e\u5e93\u5904\u7406\u4e8b\u52a1\u4e00\u6837\uff0c\u8ba9 Agent \u63d0\u4ea4\u201c\u57fa\u4e8e\u67d0\u4e2a\u7248\u672c\u7684\u4fee\u6539\u201d\uff0c\u7531\u7cfb\u7edf\u63a7\u5236\u5b83\u4f55\u65f6\u751f\u6548\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5feb\u7167\u3001\u53d8\u66f4\u4e0e\u5e76\u53d1\u63a7\u5236\u003c/h1\u003e\n\u003ch2\u003e\u5728\u5feb\u7167\u4e0a\u5e76\u884c\u5de5\u4f5c\uff0c\u5728\u53d1\u5e03\u65f6\u51b3\u5b9a\u987a\u5e8f\u003c/h2\u003e\n\u003cdiv\u003e\n\u003cimg alt=\"\u4e24\u4e2a Agent \u8bfb\u53d6\u540c\u4e00\ // 组装单页：开头的 <h1> 提为 .titlebar（放在 .inner 之外），
// 使标题条不参与整页缩放、左右始终顶格；其余内容进 .inner 等比缩放。
function makeSlide(html, i) {
  const section = document.createElement('section');
  // 首页带 no-anim：刷新时直接显示、不播入场动画；首次翻页即移除，此后正常过渡
  section.className = 'slide' + (i === 0 ? ' active no-anim' : '');
  const m = html.match(/^\s*<h1[^>]*>[\s\S]*?<\/h1\s*>/i);
  const title = m ? '<div class="titlebar">' + m[0].trim() + '</div>' : '';
  const body = m ? html.slice(m[0].length) : html;
  section.innerHTML = title + '<div class="inner">' + body + '</div>';
  return section;
}

// 真实幻灯片数据：渲染时由 Jinja2 注入；直接打开模板/无输入时解析失败 → 用 DEMO
let slides = [];
try {
  const data = JSON.parse(document.getElementById('slides-data').textContent);
  if (Array.isArray(data) && data.length) {
    slides = data.map((html, i) => makeSlide(html, i));
    slides.forEach(s => document.body.insertBefore(s, document.getElementById('pager')));
  }
} catch (e) { /* 忽略：走 DEMO */ }

if (slides.length === 0) {
  DEMO_SLIDES.forEach((html, i) => {
    document.body.insertBefore(makeSlide(html, i), document.getElementById('pager'));
  });
  slides = Array.from(document.querySelectorAll('.slide'));
}

let i = 0;
const cur = document.getElementById('cur');
const total = document.getElementById('total');

total.textContent = slides.length;

// 初始高亮/排版当前页
if (window.hljs) slides[0].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
fitSlides();
if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);

function show(n) {
  const target = Math.max(0, Math.min(n, slides.length - 1));
  if (target === i) return;                       // 越界翻页：不动
  const dir = target > i ? 1 : -1;                // 前进从右推入，后退从左推入
  const old = slides[i];
  slides.forEach(s => s.classList.remove('leaving', 'no-anim'));
  old.style.setProperty('--dir', dir);
  old.classList.remove('active');
  old.classList.add('leaving');                   // 旧页保持在下层，动画结束再隐藏
  old.addEventListener('animationend', () => old.classList.remove('leaving'), { once: true });
  i = target;
  slides[i].style.setProperty('--dir', dir);
  slides[i].classList.add('active');
  cur.textContent = i + 1;
  total.textContent = slides.length;
  window.scrollTo(0, 0);
  if (window.hljs) slides[i].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  fitSlides();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);
}

// 标题保留独立字号；正文按扣除标题、padding 后的真实空间等比缩小。
function fitSlides() {
  slides.forEach(s => {
    if (!s.classList.contains('active')) return; // 隐藏页没有可测量的尺寸
    const inner = s.querySelector('.inner');
    const title = s.querySelector('.titlebar');
    const css = getComputedStyle(s);
    const width = s.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
    const bottom = s.clientHeight - parseFloat(css.paddingBottom);
    // 极窄/极矮窗口或长标题：标题最多占用屏幕 30%，给正文留出空间。
    if (title) {
      title.style.fontSize = '';
      const base = parseFloat(css.fontSize);
      let lo = 0, hi = base;
      for (let n = 0; n < 16; n++) {
        const size = (lo + hi) / 2;
        title.style.fontSize = `${size}px`;
        if (title.offsetHeight <= s.clientHeight * .3 && title.scrollWidth <= title.clientWidth) lo = size;
        else hi = size;
      }
      title.style.fontSize = `${lo}px`;
    }
    inner.style.transform = 'none';
    const height = Math.max(1, bottom - inner.offsetTop);
    const images = inner.querySelectorAll('img');
    inner.style.setProperty('--image-height', `${height / Math.max(1, images.length)}px`);
    const scale = Math.min(1,
      Math.max(1, width - 1) / Math.max(1, inner.scrollWidth),
      Math.max(1, height - 1) / Math.max(1, inner.scrollHeight, inner.offsetHeight));
    inner.style.transform = `scale(${scale})`;
  });
}
// 合并异步排版事件；transform 不改变布局尺寸，不会触发观察器循环。
let fitFrame;
function scheduleFit() {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitSlides);
}
slides.forEach(s => {
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleFit);
    observer.observe(s.querySelector('.inner'));
    const title = s.querySelector('.titlebar');
    if (title) observer.observe(title);
  }
  s.addEventListener('load', scheduleFit, true);
  s.addEventListener('error', scheduleFit, true);
});
window.addEventListener('resize', scheduleFit);
window.addEventListener('load', scheduleFit);
if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone', scheduleFit);
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ': case 'ArrowRight': case 'ArrowDown': case 'j': case 'l': case 'Enter': case 'PageDown':
      e.preventDefault(); show(i + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'h': case 'k': case 'Backspace': case 'PageUp':
      e.preventDefault(); show(i - 1); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(slides.length - 1); break;
    case 'f':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
    case 'q':
      window.close();
      break;
  }
});
</script>
