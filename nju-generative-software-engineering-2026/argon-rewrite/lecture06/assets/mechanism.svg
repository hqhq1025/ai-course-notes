<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><style>text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;}</style><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker></defs><rect width="1000" height="440" fill="white"/><text x="500" y="48" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b">重放历史时，固定规则并隔离副作用</text><rect x="40" y="145" width="220" height="85" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/><text x="150.0" y="180.5" font-size="20" fill="#1e40af" text-anchor="middle">事件历史</text><text x="150.0" y="208.5" font-size="16" fill="#1e40af" text-anchor="middle">已接受的事实</text><rect x="385" y="145" width="230" height="85" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.7"/><text x="500.0" y="180.5" font-size="20" fill="#6b21a8" text-anchor="middle">投影计算</text><text x="500.0" y="208.5" font-size="16" fill="#6b21a8" text-anchor="middle">按指定规则重放</text><rect x="740" y="145" width="220" height="85" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.7"/><text x="850.0" y="180.5" font-size="20" fill="#166534" text-anchor="middle">派生视图</text><text x="850.0" y="208.5" font-size="16" fill="#166534" text-anchor="middle">课表 / 审核结果</text><path d="M265,187 L374,187" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M620,187 L729,187" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="500" y="90" font-size="19" fill="#1e293b" text-anchor="middle">规则版本 + 当时的外部输入</text><path d="M500,108 L500,134" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/><rect x="385" y="275" width="230" height="60" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.7"/><text x="500.0" y="312.0" font-size="20" fill="#9d174d" text-anchor="middle">短信 / 扣费</text><path d="M500,235 L500,254" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-pink)"/><text x="660" y="261" font-size="17" fill="#9d174d" text-anchor="middle">重放时隔离，不重复触发</text><path d="M486,255 L514,269 M514,255 L486,269" stroke="#ec4899" stroke-width="3"/><text x="500" y="365" font-size="17" fill="#475569" text-anchor="middle">复现历史决定与按新规则评估，是两种不同的计算</text><text x="500" y="409" font-size="15" fill="#64748b" text-anchor="middle">据第 6 讲绘制</text></svg>
