<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><style>text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;}</style><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker></defs><rect width="1000" height="440" fill="white"/><text x="500" y="48" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b">让检查真正约束合并与发布</text><rect x="20" y="133" width="160" height="92" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.7"/><text x="100.0" y="172.0" font-size="20" fill="#6b21a8" text-anchor="middle">实现 Agent</text><text x="100.0" y="200.0" font-size="16" fill="#6b21a8" text-anchor="middle">提交改动</text><rect x="220" y="133" width="160" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.7"/><text x="300.0" y="172.0" font-size="20" fill="#b45309" text-anchor="middle">Lint / 测试</text><text x="300.0" y="200.0" font-size="16" fill="#b45309" text-anchor="middle">检查具体行为</text><rect x="420" y="133" width="160" height="92" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.7"/><text x="500.0" y="172.0" font-size="20" fill="#9d174d" text-anchor="middle">独立合并门禁</text><text x="500.0" y="200.0" font-size="16" fill="#9d174d" text-anchor="middle">校核组合版本</text><rect x="620" y="133" width="160" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/><text x="700.0" y="172.0" font-size="20" fill="#1e40af" text-anchor="middle">主干检查与构建</text><text x="700.0" y="200.0" font-size="16" fill="#1e40af" text-anchor="middle">固定提交版本</text><rect x="820" y="133" width="160" height="92" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.7"/><text x="900.0" y="172.0" font-size="20" fill="#166534" text-anchor="middle">部署产物</text><text x="900.0" y="200.0" font-size="16" fill="#166534" text-anchor="middle">绑定该次构建</text><path d="M185,179 L209,179" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M385,179 L409,179" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M585,179 L609,179" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M785,179 L809,179" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M500,230 C500,312 100,312 100,236" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-pink)"/><text x="300" y="327" font-size="16" fill="#9d174d" text-anchor="middle">失败证据 → 修复并重新检查</text><rect x="620" y="275" width="360" height="55" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.7"/><text x="800.0" y="309.5" font-size="20" fill="#9d174d" text-anchor="middle">预算耗尽：停止自动重试并交接</text><path d="M463,265 C525,265 550,303 609,303" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-pink)"/><text x="500" y="365" font-size="17" fill="#475569" text-anchor="middle">实现者不能自行降低标准；部署应拒绝过时产物覆盖新版本</text><text x="500" y="409" font-size="15" fill="#64748b" text-anchor="middle">据第 8 讲绘制</text></svg>
