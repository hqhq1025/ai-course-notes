<style>
  :root {
    --bg: #ffffff; --fg: #111111;
    --muted: #555555; --border: #999999;
    --blue: #1e3a8a; --cyan: #0e7490; --green: #15803d;
    --purple: #6d28d9; --red: #b91c1c; --orange: #c2410c; --yellow: #a16207;
    --code-bg: #fafbfc; --quote-bg: #f7f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;                   /* 满屏，无外框 */
    display: none;
    padding: 3vh 4vw;
    overflow: hidden;
    font-size: clamp(20px, 3.25vh, 35px);
    line-height: 1.7;
  }
  .slide .inner {
    position: relative; z-index: 1;   /* 盖在顶部光斑 ::before 之上 */
    display: flow-root;         /* 包含首尾 margin 和浮动，保证测量完整 */
    width: 100%;
    overflow-wrap: anywhere;
    transform-origin: top left;
  }
  /* 翻页过渡：新页沿翻页方向推入、旧页同速推出（--dir 由 JS 按方向设置）。
     两页首尾相接一起移动，任何时刻都铺满屏幕，不会露出白底闪烁。 */
  .slide.active { display: block; z-index: 2; animation: pagein .28s cubic-bezier(.22, .61, .36, 1); }
  .slide.leaving { display: block; z-index: 1; animation: pageout .28s cubic-bezier(.22, .61, .36, 1); }
  @keyframes pagein  { from { transform: translateX(calc(100% * var(--dir, 1))); } }
  /* 旧页少退出 4px：被新页压在下面，盖住两页接缝处的亚像素圆整白线 */
  @keyframes pageout { to   { transform: translateX(calc(var(--dir, 1) * (4px - 100%))); } }
  .slide.no-anim { animation: none; }  /* 初始首页直接显示（须置于上方两条规则之后） */
  /* 标题条：JS 把每页开头的 <h1> 提到 .inner 之外 → 不参与整页等比缩放，
     负 margin 抵消 slide 的 padding，左右/上方始终顶格；无圆角。
     深色毛玻璃：模糊的是 ::before 生成的顶部彩色光斑。 */
  .slide .titlebar {
    position: relative; z-index: 2;
    margin: -3vh -4vw .8em;      /* slide padding 为 3vh 4vw */
    padding: .3em 4vw;           /* 与正文（h2/p/li）左线对齐 */
    background: rgba(59, 7, 100, .72);    /* purple-950 玻璃 */
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    border-bottom: 1px solid rgba(255, 255, 255, .25);
  }
  .slide .titlebar h1 {
    font-size: 1.55em; color: #fff;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .35);
  }
  .slide .titlebar h1 :is(b, strong) { color: #fca5a5; }  /* 深色条上红色加粗提亮 */
  .slide .inner h1 { font-size: 1.55em; margin: 0 0 .6em; border-bottom: 2px solid #8fa3c8; padding-bottom: .3em; }  /* 非页首 h1 兜底 */
  /* 顶部静态彩色光斑：给毛玻璃提供可被模糊的背景（无动画），正文区仍为白底 */
  .slide::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 5em;
    z-index: 0;
    background:
      radial-gradient(30em 10em at 12% -30%, rgba(59, 130, 246, .5), transparent 60%),
      radial-gradient(26em 9em at 58% -50%, rgba(139, 92, 246, .42), transparent 60%),
      radial-gradient(30em 10em at 94% -25%, rgba(6, 182, 212, .4), transparent 60%);
    pointer-events: none;
  }
  .slide h2 { font-size: 1.25em; color: var(--fg); margin: 1em 0 .5em; }
  .slide h3 { font-size: 1.2em; color: var(--muted); margin: 1em 0 .4em; }
  .slide p { margin: .5em 0; }
  .slide :is(b, strong), .slide :is(h1, h2, h3) :is(b, strong) { color: var(--red); }
  .slide ul, .slide ol { padding-left: 1.6em; margin: .5em 0; }
  .slide li { margin: .25em 0; }
  .slide blockquote {
    border-left: 3px solid var(--border); padding: .3em 1.2em; margin: .8em 0;
    color: var(--muted); background: var(--quote-bg);
  }
  .slide blockquote::before {
    content: "\201C";
    float: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.8em;
    line-height: .9;
    margin: .05em .25em 0 0;
    color: #bdbdbd;
    user-select: none;
  }
  .slide code {
    font-size: .9em;
    font-family: "LXGW WenKai Mono", "霞鹜文楷等宽", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .slide pre {
    background: var(--code-bg); border: 1px solid #e5e7eb; border-radius: 8px;
    padding: .4em .6em; margin: .8em 0; overflow: visible;
  }
  .slide pre code { background: none; padding: 0; color: var(--fg); }
  .slide pre code.hljs { overflow: visible; }
  .slide a { color: var(--muted); }
  .slide a.badlink {
    color: var(--red); text-decoration: line-through;
    cursor: not-allowed;
  }
  .slide img.badlink {
    border: 2px dashed var(--red); border-radius: 6px;
    min-width: 8em; min-height: 4em;
    background: repeating-linear-gradient(45deg, #fff, #fff 8px, #fde8e8 8px, #fde8e8 16px);
  }
  .slide .badge {
    display: inline-block;
    font-size: .6em; font-weight: 700;
    color: #fff; background: var(--red);
    border-radius: 3px; padding: .1em .4em;
    vertical-align: .2em;
    text-decoration: none;
  }
  .slide hr { border: none; border-top: 2px solid var(--border); margin: 1.2em 0; }
  .slide img {
    display: block;
    max-width: 90%;
    margin: .8em auto;
    border-radius: 8px;
  }
  /* 图片先限制到正文可用高度，再与其余正文一起参与缩放。支持多图。 */
  .slide .inner img {
    max-height: var(--image-height, 60vh);
    object-fit: contain;
  }
  #pager {
    position: fixed; right: 2.5vw; bottom: 2.5vh;
    font-size: 14px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  /* AI 补充内容（行内 span）：inline-block 让 padding 上下左右都实际占位生效 */
  .slide span.aigc {
    display: inline-block;
    border: 1px dashed #ddccf0;      /* 极淡紫，几乎隐形的虚线 */
    border-radius: 4px;
    padding-left: 0.45em;
    background: #fff;
    color: rgba(76, 29, 149, .75);   /* purple-900，25% 透明 */
  }
  .slide .aigc::before {
    content: "";
    display: inline-block;
    width: .95em; height: .95em;
    margin-right: .2em;
    vertical-align: -.1em;
    background-color: #6b21a8;
    clip-path: polygon(50% 4%, 62% 36%, 96% 50%, 62% 64%, 50% 96%, 36% 64%, 4% 50%, 36% 36%);
  }
  .slide .aigc a { color: rgba(76, 29, 149, .75); }
</style>

\u003e\u5de5\u5177/skills \u7684\u8c03\u7528\u548c\u8f93\u51fa\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e0d\u8fc7\uff0c\u4e0d\u662f\u6240\u6709 context \u90fd\u662f\u6307\u4ee4\uff1a\u4ee3\u7801\u3001\u5386\u53f2\u6d88\u606f\u3001\u5de5\u5177\u8fd4\u56de\u4e5f\u53ef\u80fd\u53ea\u662f\u4e8b\u5b9e\u3001\u72b6\u6001\u6216\u6837\u4f8b\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e$$\n\\Pr[\\text{token}\\mid\\text{context}]\n$$\u003c/p\u003e", "\u003ch1\u003e\u4ece\u63d0\u793a\u8bcd\u5de5\u7a0b\u5230\u4e0a\u4e0b\u6587\u5de5\u7a0b\u003c/h1\u003e\n\u003ch2\u003e\u5de5\u7a0b\u5316\u6a21\u578b\u5728\u6bcf\u4e00\u6b65\u771f\u6b63\u770b\u89c1\u4ec0\u4e48\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u201c\u63d0\u793a\u8bcd\u5de5\u7a0b\u201d \u5173\u5fc3\u4e00\u53e5\u8bdd\u600e\u4e48\u5199\uff1b\u201c\u4e0a\u4e0b\u6587\u5de5\u7a0b\u201d \u5173\u5fc3\u6bcf\u6b21\u51b3\u7b56\u524d\uff0c\u54ea\u4e9b token \u4ee5\u4ec0\u4e48\u6765\u6e90\u3001\u987a\u5e8f\u548c\u4f5c\u7528\u57df\u51fa\u73b0\u3002\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u76ee\u6807\u662f\u8ba9 working set \u8db3\u591f\u5c0f\u3001\u8db3\u591f\u65b0\u3001\u5e26\u6765\u6e90\u3001\u53ef\u9a8c\u8bc1\uff1b\u4e0a\u4e0b\u6587\u7a97\u53e3\u88c5\u5f97\u4e0b\uff0c\u4e0d\u7b49\u4e8e\u6ce8\u610f\u529b\u7528\u5f97\u597d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u5230 Claude Opus 4.5 \u8fd9\u4e00\u4ee3\uff0c\u6a21\u578b\u9760\u5f3a\u5316\u5b66\u4e60\u83b7\u5f97\u4e86\u6781\u5f3a\u7684\u6307\u4ee4\u9075\u5faa\u80fd\u529b\uff0c\u76f4\u63a5\u8f93\u51fa\u547d\u4ee4\u548c\u5de5\u5177\u8c03\u7528\uff0c\u6301\u7eed\u5411\u76ee\u6807\u63a8\u8fdb\u3002\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6a21\u578b\u53ea\u770b\u5230 token \u5e8f\u5217\uff1b\u003ccode\u003esystem/user/tool\u003c/code\u003e \u7684\u8fb9\u754c\u3001\u4f18\u5148\u7ea7\u548c\u6743\u9650\uff0c\u90fd\u662f Harness \u653e\u8fdb\u4e0a\u4e0b\u6587\u5e76\u5728\u5916\u90e8\u6267\ 01c\u8c01\u5728\u7ed9\u5b83\u4e0b\u6307\u4ee4\u201d\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u5206\u6790\u4e00\u4e0b\u4f60\u4e0a\u6587\u4e2d\u7684\u6240\u6709\u63d0\u793a\u8bcd (\u5305\u62ec\u7cfb\u7edf)\uff0c\u5e76\u6309\u7167\u9700\u8981\u9075\u5faa\u7684\u6307\u4ee4\u7c7b\u578b\u5206\u7c7b\u603b\u7ed3\u3002\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u76ee\u6807\u4e0e\u4ea4\u4ed8\u7269\uff1a\u8981\u5b8c\u6210\u4ec0\u4e48\uff0c\u4f55\u65f6\u7b97\u5b8c\u6210\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6743\u9650\u4e0e\u5b89\u5168\uff1a\u80fd\u8bfb\u5199\u4ec0\u4e48\uff0c\u4f55\u65f6\u5fc5\u987b\u786e\u8ba4\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5de5\u4f5c\u6d41\u4e0e\u5de5\u5177\u534f\u8bae\uff1a\u5148\u505a\u4ec0\u4e48\uff0c\u5de5\u5177\u600e\u6837\u8c03\u7528\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6301\u4e45\u89c4\u5219\u4e0e\u98ce\u683c\uff1a\u003ccode\u003eAGENTS.md\u003c/code\u003e\u3001skills\u3001\u8bed\u8a00\u548c\u683c\u5f0f\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u73af\u5883\u4e8b\u5b9e\u4e0e\u8bc1\u636e\uff1a\u6587\u4ef6\u3001\u5386\u53f2\u6d88\u606f\u3001\u5de5\u5177\u8f93\u51fa\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u51b2\u7a81\u65f6\u518d\u6807\u51fa\u6765\u6e90\u3001\u4f5c\u7528\u57df\u548c\u4f18\u5148\u7ea7\u3002\u6a21\u578b\u7ed9\u51fa\u7684\u662f\u201c\u5f53\u524d\u9075\u5faa\u8ba1\u5212\u201d\uff0c\u4e0d\u662f\u53ef\u4fe1\u7684\u5185\u90e8\u72b6\u6001 dump\uff1b\u7528\u5b9e\u9645\u884c\u4e3a\u4ea4\u53c9\u9a8c\u8bc1\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u201c\u5b89\u5168\u547d\u4ee4\u201d \u662f\u8c01\u5224\u7684\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u6a21\u578b\u63d0\u8bae\uff0cHarness \u51b3\u7b56\uff0c\u64cd\u4f5c\u7cfb\u7edf\u6536\u53e3\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCodex \u6709\u4e00\u4e9b\u7ec6\u8282\uff0c\u4f8b\u5982\u4ed6\u8ba4\u4e3a\u201c\u5b89\u5168\u201d\u7684\u547d\u4ee4\uff0c\u4e0d\u89e6\u53d1\u7528\u6237\u63d0\u793a\u3002\u8fd9\u662f\u600e\u4e48\u5b9e\u73b0\u7684\uff1f\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6a21\u578b\u53ea\u751f\u6210\u201c\u60f3\u8fd0\u884c\u4ec0\u4e48\u201d\uff1bsandbox \u51b3\u5b9a\u6280\u672f\u4e0a\u80fd\u78b0\u4ec0\u4e48\uff0capproval policy \u51b3\u5b9a\u4f55\u65f6\u6682\u505c\u8be2\u95ee\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u89c4\u5219\u6309\u5b8c\u6574\u53c2\u6570\u5217\u8868\u5339\u914d \u003ccode\u003eallow / prompt / forbidden\u003c/code\u003e\uff1b\u7b80\u5355 shell \u94fe\u4f1a\u88ab\u8bed\u6cd5\u89e3\u6790\u540e\u9010\u6761\u68c0\u67e5\uff0c\u6700\u4e25\u683c\u7684\u7ed3\u679c\u83b7\u80dc\u3002\u003ca href=\"https://learn.chatgpt.com/docs/agent-configuration/rules\"\u003eCodex Rules\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u56e0\u6b64\u201c\u4e0d\u5f39\u7a97\u201d\u53ea\u8868\u793a\u52a8\u4f5c\u843d\u5728\u5f53\u524d\u8fb9\u754c\u5185\uff0c\u5e76\u4e0d\u7b49\u4e8e\u6a21\u578b\u83b7\u5f97\u4e86\u65e0\u9650\u6743\u9650\u3002\u003ca href=\"https://learn.chatgpt.com/docs/agent-approvals-security\"\u003eAgent approvals \u0026amp; security\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u771f\u5b9e\u6559\u8bad\uff1a\u65e9\u671f Codex \u628a \u003ccode\u003erg\u003c/code\u003e \u5f53\u4f5c\u53ea\u8bfb\u5b89\u5168\u547d\u4ee4\uff0c\u5374\u6f0f\u6389 \u003ccode\u003e--pre\u003c/code\u003e\u3001\u003ccode\u003e-z\u003c/code\u003e \u7b49\u53ef\u89e6\u53d1\u5916\u90e8\u7a0b\u5e8f\u7684\u53c2\u6570\u3002\u003ca href=\"https://nvd.nist.gov/vuln/detail/CVE-2025-54558\"\u003eCVE-2025-54558\u003c/a\u003e \u8bf4\u660e\u5b89\u5168\u5c5e\u6027\u5c5e\u4e8e\u5b8c\u6574 invocation\uff0c\u4e0d\u5c5e\u4e8e\u547d\u4ee4\u540d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4e0a\u4e0b\u6587\u5de5\u7a0b\uff1a\u8ba9\u6a21\u578b\u77e5\u9053\u201c\u5b8c\u6210\u201d\u662f\u4ec0\u4e48\u003c/h1\u003e\n\u003ch2\u003eContext \u91cc\u662f\u4e00\u4efd\u590d\u6742\u8981\u6c42\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6a21\u578b\u7684\u6f5c\u529b\u5b8c\u5168\u662f\u9760\u63d0\u793a\u8bcd\u6fc0\u53d1\u7684\u003c/li\u003e\n\u003cli\u003e\u4e0a\u4e0b\u6587\u5305\u542b\u4e86\u4e00\u4e2a\u003cstrong\u003e\u6781\u4e3a\u590d\u6742\u7684\u8981\u6c42\u003c/strong\u003e\u003cul\u003e\n\u003cli\u003e\u7ea6\u675f\uff0c\u53ef\u4ee5\u662f intent\uff0c\u4e5f\u53ef\u4ee5\u662f spec\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u6a21\u578b\u88ab\u8bad\u7ec3\u4e3a\uff1a\u6301\u7eed\u7684 $\\Pr[\\text{token}\\mid\\text{context}]$ \u80fd\u4e0d\u65ad\u63a8\u8fdb\uff0c\u76f4\u5230\u003cstrong\u003e\u6ee1\u8db3\u8981\u6c42\u003c/strong\u003e\uff0c\u4e5f\u5c31\u662f\u5b66\u4f1a\u4e86\u201c\u89c4\u5212\u201d\u7684\u80fd\u529b\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u9010 Token \u63a8\u8fdb\uff0c\u4e5f\u8981\u6709\u505c\u673a\u6761\u4ef6\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e$\\Pr[\\text{token}\\mid\\text{context}]$ \u672c\u8eab\u4e0d\u662f\u89c4\u5212\u5668\uff1b\u540e\u8bad\u7ec3\u628a\u591a\u6b65\u8bd5\u63a2\u3001\u5de5\u5177\u8c03\u7528\u548c\u6536\u5c3e\u5851\u9020\u6210\u4e86\u4e00\u79cd\u53ef\u91c7\u6837\u7684\u7b56\u7565\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8bbe\u751f\u6210\u8f68\u8ff9\u4e3a $\\tau$\u3002\u53ea\u6709\u4e0a\u4e0b\u6587\u91cc\u5b58\u5728\u53ef\u8bc6\u522b\u7684\u5b8c\u6210\u5224\u636e $V(\\tau)=1$\uff0c\u201c\u7ee7\u7eed\u5e72\u201d\u548c\u201c\u53ef\u4ee5\u4ea4\u5377\u201d\u624d\u4e0d\u53ea\u662f\u4e24\u79cd\u9ad8\u6982\u7387\u7eed\u5199\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u53ef\u9a8c\u8bc1\uff0c\u624d\u4e0d\u4f1a\u201c\u63d0\u524d\u4ea4\u5377\u201d\u003c/h1\u003e\n\u003ch2\u003e\u6a21\u578b\u5982\u4f55\u5224\u65ad\u5df2\u7ecf\u6ee1\u8db3\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u63a8\u8bba\uff1a\u8d8a\u660e\u786e\u3001\u8d8a\u003cstrong\u003e\u53ef\u9a8c\u8bc1\u003c/strong\u003e\u7684\u8981\u6c42\uff0c\u8d8a\u53ef\u80fd\u5f97\u5230\u4f60\u6ee1\u610f\u7684\u7ed3\u679c\u003c/li\u003e\n\u003cli\u003e\u4e0d\u660e\u786e\u7684\u8981\u6c42\uff0c\u6a21\u578b\u53ef\u80fd\u8ba4\u4e3a\u5df2\u7ecf\u201c\u6ee1\u8db3\u201d\u4e86\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e00\u4e2a\u76f4\u63a5\u7684\u68c0\u67e5\uff1a\u65c1\u89c2\u8005\u53ea\u770b\u4ea7\u7269\u548c\u5de5\u5177\u7ed3\u679c\uff0c\u80fd\u5426\u5224\u5b9a\u901a\u8fc7\u6216\u4e0d\u901a\u8fc7\uff1f\u5982\u679c\u4e0d\u80fd\uff0c\u6a21\u578b\u5c31\u6ca1\u6709\u7a33\u5b9a\u7684 done\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u628a\u613f\u671b\u6539\u5199\u6210\u9a8c\u6536\u6761\u4ef6\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e1714 \u5e74\u82f1\u56fd\u300a\u7ecf\u5ea6\u6cd5\u300b\u6ca1\u6709\u60ac\u8d4f\u201c\u6539\u5584\u822a\u6d77\u201d\uff0c\u800c\u662f\u6309\u7ecf\u5ea6\u8bef\u5dee\u5206\u6863\uff0c\u5e76\u89c4\u5b9a\u9a76\u5f80\u897f\u5370\u5ea6\u7fa4\u5c9b\u5b9e\u6d4b\u3002\u613f\u671b\u88ab\u5199\u6210\u9a8c\u6536\u6761\u4ef6\uff0c\u201c\u89e3\u51b3\u201d\u624d\u6709\u4e86\u5236\u5ea6\u4e0a\u7684\u542b\u4e49\u3002\u003ca href=\"https://www.royalobservatorygreenwich.org/articles.php?article=1311\"\u003eLongitude Acts \u539f\u6587\u8f6c\u5f55\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eIntent \u2192 Spec \u2192 Impl\uff1a\u6f02\u79fb\u9010\u7ea7\u653e\u5927\u003c/h1\u003e\n\u003ch2\u003e\u201c\u4e00\u53e5\u8bdd\u751f\u6210\u6781\u54c1\u98de\u8f66\u201d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5927\u5bb6\u5f88\u559c\u6b22\u7684\u003ca href=\"https://019f6b8d-821e-7c15-98ab-16f3bd7f7409.arena.site/\"\u003e\u4e00\u53e5\u8bdd\u751f\u6210\u6781\u54c1\u98de\u8f66\u003c/a\u003e\uff0c\u6d4b\u8bd5\u524d\u7aef\u80fd\u529b\u003cul\u003e\n\u003cli\u003eIntent \u2192 spec \u2192 impl gap \u4f1a\u9010\u6b65\u653e\u5927\u6f02\u79fb\u003c/li\u003e\n\u003cli\u003e\u4f60\u53ef\u80fd\u662f\u60f3\u8981\u4e00\u4e2a\u590d\u7528\u771f\u5b9e\u5730\u56fe\u548c\u7f8e\u672f\u8d44\u4ea7\u7684\u2026\u2026\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u6bcf\u4e00\u6b21\u7701\u7565\uff0c\u90fd\u5728\u6269\u5f20\u9009\u62e9\u7a7a\u95f4\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u955c\u5934\u3001\u64cd\u63a7\u3001\u5730\u56fe\u3001\u7f8e\u672f\u8d44\u4ea7\u3001\u80dc\u8d1f\u6761\u4ef6\uff1a\u82e5\u7b2c $i$ \u5c42\u5404\u7559\u4e0b $k_i$ \u4e2a\u201c\u4f3c\u4e4e\u90fd\u884c\u201d\u7684\u9ed8\u8ba4\u9009\u9879\uff0c\u6700\u7ec8\u5019\u9009\u7a7a\u95f4\u7ea6\u4e3a $\\prod_i k_i$\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6a21\u578b\u53ef\u4ee5\u5728\u6bcf\u4e00\u6b65\u90fd\u505a\u51fa\u81ea\u6d3d\u7684\u9009\u62e9\uff0c\u6700\u540e\u5374\u79bb\u4f60\u5fc3\u91cc\u7684\u90a3\u6b3e\u6e38\u620f\u5f88\u8fdc\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5199\u6e05\u6307\u4ee4\uff0c\u627f\u62c5\u201c\u4e0d\u660e\u786e\u201d\u7684\u540e\u679c\u003c/h1\u003e\n\u003ch2\u003eRule of Thumb\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5199\u6e05\u695a\u4f60\u7684\u6307\u4ee4\uff0c\u627f\u62c5\u4e00\u5207\u201c\u4e0d\u660e\u786e\u201d\u7684\u540e\u679c\u003cul\u003e\n\u003cli\u003e\u8fd9\u6837\u6a21\u578b\u6c38\u8fdc\u7ed9\u4f60\u7684\u662f\u60ca\u559c \ud83d\ude01\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6388\u6743\u6a21\u578b\u7528\u9ed8\u8ba4\u503c\u66ff\u4f60\u505a\u4ea7\u54c1\u51b3\u7b56\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e1854 \u5e74\u8f7b\u9a91\u5175\u51b2\u950b\u4e2d\uff0c\u5c71\u4e0a\u7684 Raglan \u770b\u5f97\u89c1\u76ee\u6807\uff0c\u8c37\u4e2d\u7684 Lucan \u770b\u4e0d\u89c1\uff1b\u547d\u4ee4\u91cc\u7684\u201c\u90a3\u4e9b\u70ae\u201d\u7531\u6267\u884c\u8005\u81ea\u884c\u8865\u5168\uff0c\u8f7b\u9a91\u5175\u6700\u7ec8\u51b2\u5411\u4e86\u9519\u8bef\u7684\u70ae\u9635\u3002\u003ca href=\"https://collection.nam.ac.uk/detail.php?acc=1962-11-4-3\"\u003e\u82f1\u56fd\u56fd\u5bb6\u9646\u519b\u535a\u7269\u9986\uff1a\u539f\u59cb\u547d\u4ee4\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u8981\u4e48\u5b8c\u6210\uff0c\u8981\u4e48\u663e\u5f0f\u5931\u8d25\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4e00\u4e2a\u8db3\u591f\u597d\u7684\u6a21\u578b\uff0c\u8981\u4e48\u5b8c\u6210\uff0c\u8981\u4e48\u5931\u8d25\uff0c\u4e0d\u5e94\u8be5\u5e7b\u89c9\u6216\u8fdd\u80cc\u6307\u4ee4\u003cul\u003e\n\u003cli\u003e\u5982\u679c\u4f60\u7684\u6307\u4ee4\u4e0d\u8fc7\u957f\uff0c\u73b0\u5728\u7684\u6a21\u578b\u57fa\u672c\u8db3\u591f\u597d\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u53ef\u4ee5\u628a\u5931\u8d25\u8bed\u4e49\u5199\u8fdb\u5951\u7ea6\uff1a\u53ea\u6709\u6d4b\u8bd5\u6216\u53ef\u68c0\u67e5\u8bc1\u636e\u901a\u8fc7\u624d\u7b97\u5b8c\u6210\uff1b\u65e0\u6cd5\u9a8c\u8bc1\u65f6\uff0c\u62a5\u544a\u672a\u5b8c\u6210\u3001\u963b\u585e\u70b9\u548c\u5df2\u7ecf\u5c1d\u8bd5\u7684\u8def\u5f84\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4ece\u201cAI \u5473\u201d\u5230\u4f60\u7684\u4e3b\u9875\u003c/h1\u003e\n\u003ch2\u003eBad\uff1a\u628a\u54c1\u5473\u7559\u7ed9\u9ed8\u8ba4\u503c\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u201c\u6211\u662f\u848b\u708e\u5ca9\uff0c\u6839\u636e\u6211\u7684\u516c\u5f00\u4fe1\u606f\uff0c\u5236\u4f5c\u4e00\u4e2a\u73b0\u4ee3\u98ce\u683c\u7684\u4e2a\u4eba\u4e3b\u9875\u9996\u9875...\u201d \u4f60\u5c06\u4f1a\u5f97\u5230 \u003ca href=\"https://jm233333.github.io/\"\u003eAI \u5473\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u201c\u73b0\u4ee3\u98ce\u683c\u201d\u770b\u4f3c\u5177\u4f53\uff0c\u5b9e\u9645\u4e0a\u51e0\u4e4e\u6ca1\u6709\u6392\u9664\u4efb\u4f55\u6a21\u677f\u3002\u4e24\u4e2a\u79f0\u804c\u7684\u5b9e\u73b0\u8005\u90fd\u80fd\u4e25\u683c\u7167\u505a\uff0c\u5374\u4ea4\u51fa\u5b8c\u5168\u4e0d\u540c\u7684\u9875\u9762\uff1a\u8fd9\u4ecd\u7136\u53ea\u662f intent\u3002\u003c/span\u003e\u003c/p\u003e\n\u003ch2\u003eBetter\uff1a\u538b\u7f29\u5408\u6cd5\u89e3\u7a7a\u95f4\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e...\uff0c\u7528\u003cstrong\u003e\u5177\u4f53\u003c/strong\u003e\u98ce\u683c\u3001\u003cstrong\u003e\u5177\u4f53\u003c/strong\u003e\u6837\u5f0f\u548c\u6392\u7248... \u5c31\u53ef\u4ee5\u5f97\u5230\u003ca href=\"http://jiangyy.github.io/\"\u003e\u6211\u7684\u4e2a\u4eba\u4e3b\u9875\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u989c\u8272\u3001\u5b57\u4f53\u3001\u6805\u683c\u3001\u7559\u767d\u3001\u7ec4\u4ef6\u548c\u53c2\u8003\u7269\u5171\u540c\u6784\u6210\u8bbe\u8ba1\u8bed\u8a00\u3002\u5173\u952e\u4e0d\u662f\u591a\u5199\u51e0\u4e2a\u5f62\u5bb9\u8bcd\uff0c\u800c\u662f\u8ba9\u9009\u62e9\u53ef\u7ec4\u5408\u3001\u7ed3\u679c\u53ef\u68c0\u67e5\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u65b0\u5206\u5de5\uff1a\u4eba\u5b9a\u4e49\u95ee\u9898\uff0cAI \u641c\u7d22\u5b9e\u73b0\u003c/h1\u003e\n\u003ch2\u003eIntent \u2192 Spec \u2192 Impl\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u660e\u786e\u4f60\u7684\u610f\u56fe\uff0c\u9700\u8981\u4f60\u5bf9\u003cstrong\u003e\u4ea7\u54c1\u9886\u57df\u003c/strong\u003e\u7684\u77e5\u8bc6\u003c/li\u003e\n\u003cli\u003e\u628a\u610f\u56fe\u53d8\u6210\u8bbe\u8ba1\uff0c\u9700\u8981\u4f60\u5bf9\u003cstrong\u003e\u8f6f\u4ef6\u5de5\u7a0b\u003c/strong\u003e\u7684\u77e5\u8bc6\u003c/li\u003e\n\u003cli\u003e\u5b9e\u73b0\u53cd\u800c\u591a\u6570\u53ef\u4ee5\u4ea4\u7ed9 AI\uff0c\u5df2\u7ecf\u8d85\u8fc7\u4e2d\u7ea7\u7a0b\u5e8f\u5458\u4e86\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u53ef\u4ee5\u628a\u8fb9\u754c\u753b\u5728\u201c\u641c\u7d22\u201d\u548c\u201c\u5224\u5b9a\u201d\u4e4b\u95f4\uff1a\u4eba\u5b9a\u4e49\u76ee\u6807 $G$ \u4e0e\u9a8c\u6536\u5668 $V$\uff0cAI \u641c\u7d22\u5b9e\u73b0 $x$\uff0c\u76f4\u5230 $V(x)=1$\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eImpl \u53d8\u4fbf\u5b9c\uff0c\u5224\u65ad\u6ca1\u6709\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eBrooks \u5728 1986 \u5e74\u533a\u5206\u4e86\u8f6f\u4ef6\u7684 essence \u4e0e accident\uff1a\u56f0\u96be\u5728\u4e8e\u6784\u9020\u3001\u89c4\u683c\u5316\u3001\u8bbe\u8ba1\u548c\u6d4b\u8bd5\u6982\u5ff5\u7ed3\u6784\uff0c\u800c\u4e0d\u53ea\u662f\u628a\u5b83\u8868\u793a\u6210\u4ee3\u7801\u3002\u003ca href=\"https://www.cs.unc.edu/techreports/86-020.pdf\"\u003eNo Silver Bullet \u539f\u59cb\u6280\u672f\u62a5\u544a\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5b9e\u73b0\u53ef\u4ee5\u5916\u5305\uff1b\u9a8c\u6536\u6807\u51c6\u548c\u5931\u8d25\u8d23\u4efb\u4e0d\u80fd\u4e00\u8d77\u5916\u5305\u3002\u5426\u5219 AI \u4f18\u5316\u7684\u662f\u5b83\u731c\u5230\u7684\u4ee3\u7406\u76ee\u6807\uff0c\u4e0d\u662f\u4f60\u7684\u4ea7\u54c1\u76ee\u6807\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4e00\u6b65\u5f88\u6d45\uff0c\u4e00\u4e32\u53ef\u4ee5\u5f88\u6df1\u003c/h1\u003e\n\u003ch2\u003ePr[token | context]\u003c/h2\u003e\n\u003cp\u003e$\\Pr[\\mathrm{token}\\mid\\mathrm{context}]$ \u662f\u6df1\u5ea6\u975e\u5e38\u6709\u9650\u7684\u8ba1\u7b97\u3002\u5373\u4f7f\u662f\u4eca\u5929\u7684 Mixture-of-Experts\uff0c\u6240\u8c13\u201c\u4e13\u5bb6\u201d\u4e5f\u53ea\u662f\u8868\u793a\u7a7a\u95f4\u4e0a\u7684\u5206\u6bb5\u51fd\u6570\uff0c\u5e76\u4e0d\u662f\u5750\u5728\u6a21\u578b\u91cc\u7684\u591a\u4e2a\u5c0f\u4eba\u3002\u5927\u90e8\u5206\u65f6\u5019\uff0c\u63a5\u4e0b\u6765\u82e5\u5e72\u4e2a\u201c\u7b80\u5355\u201d token \u90fd\u662f\u9ad8\u6982\u7387\u786e\u5b9a\u7684\uff1b\u4e00\u6b21\u524d\u5411\u8ba1\u7b97\u4e0d\u53ef\u80fd\u51ed\u7a7a\u5b8c\u6210\u590d\u6742\u4efb\u52a1\u3002\u003c/p\u003e\n\u003cp\u003e\u4f46\u6a21\u578b\u5b66\u4f1a\u4e86\u003cstrong\u003e\u5229\u7528\u4e0a\u4e0b\u6587\u601d\u8003\u003c/strong\u003e\uff1a\u9047\u5230\u4e0d\u786e\u5b9a\u4e4b\u5904\uff0c\u4e0d\u76f4\u63a5\u731c\u7b54\u6848\uff0c\u800c\u662f\u5148\u8bd5\u4e00\u8bd5\uff1b\u9519\u4e86\uff0c\u8fd8\u53ef\u4ee5\u7ee7\u7eed\u8f93\u51fa token \u7ea0\u6b63\u3002\u6bcf\u4e2a\u65b0 token \u53c8\u6210\u4e3a\u4e0b\u4e00\u6b65\u7684 context\uff0c\u8fd9\u5c31\u662f chain-of-thought\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u53ef\u4ee5\u628a\u5b83\u7c7b\u6bd4\u6210\u56fe\u7075\u673a\u7684\u7eb8\u5e26\uff1a\u5355\u6b65\u8f6c\u79fb\u5f88\u7b80\u5355\uff0c\u4e2d\u95f4\u7ed3\u679c\u5374\u80fd\u5199\u56de\u201c\u7eb8\u5e26\u201d\uff0c\u4f9b\u4e0b\u4e00\u6b65\u7ee7\u7eed\u8ba1\u7b97\u3002\u4e00\u6b21\u5f88\u6d45\uff0c\u4e32\u8d77\u6765\u5c31\u6709\u4e86\u6df1\u5ea6\u3002\u003c/span\u003e\u003c/p\u003e\n\u003ch2\u003e\u7528 Token \u6362\u8ba1\u7b97\u6df1\u5ea6\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4f60\u53ef\u4ee5\u540c\u65f6\u63d0\u003cstrong\u003e\u5f88\u591a\u8981\u6c42\u003c/strong\u003e\uff0cAI \u4f1a\u60f3\u51fa\u50cf\u4eba\u4e00\u6837\u9010\u6b65\u903c\u8fd1\u76ee\u6807\u7684\u003cstrong\u003e\u8fc7\u7a0b\u003c/strong\u003e\uff1atest-time scaling\u3002\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u627e\u89e3\u6bd4\u9a8c\u89e3\u96be\u201d\u9002\u5408\u4f5c\u4e3a P vs. NP \u7684\u76f4\u89c9\u7c7b\u6bd4\uff0c\u4e0d\u662f\u590d\u6742\u6027\u8bc1\u660e\u3002\u53ea\u6709\u5f53\u4e2d\u95f4\u8fdb\u5c55\u6216\u6700\u7ec8\u7b54\u6848\u53ef\u68c0\u67e5\u65f6\uff0c\u591a\u5199\u3001\u591a\u8bd5\u3001\u591a\u4fee\u8865\u624d\u4f1a\u7a33\u5b9a\u5730\u53d8\u6210\u80fd\u529b\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4e09\u6761\u7ea6\u675f\uff0c\u85cf\u8fdb\u516b\u53e5\u8bd7\u003c/h1\u003e\n\u003ch2\u003e\u62bc\u97f5 \u00b7 \u85cf\u5934 \u00b7 \u5d4c\u5b57\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u7528\u4e2d\u6587\u5199\u4e00\u4e2a\u62bc\u97f5\u7684\u85cf\u5934\u8bd7\uff0c\u5934\u662f\u201c\u8ba1\u7b97\u673a\u5b66\u9662\u771f\u725b\u903c\u201d\uff0c\u8981\u8bb2\u548c\u52a8\u7269\u76f8\u5173\u7684\u6545\u4e8b\uff0c\u201c\u4e8c\u96f6\u4e8c\u516d\u4e5d\u6708\u4e00\u65e5\u201d\u516b\u4e2a\u5b57\u5206\u522b\u6309\u987a\u5e8f\u51fa\u73b0\u5728\u516b\u53e5\u91cc\uff0c\u4f4d\u7f6e\u65e0\u6240\u8c13\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u8ba1\u6210\u4e8c\u5154\u8d8a\u5c71\u5188\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u7b97\u5230\u96f6\u65f6\u96ea\u6ee1\u5858\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u673a\u8b66\u72d0\u8854\u4e8c\u888b\u7cae\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u5b66\u968f\u516d\u96c1\u8fa8\u98ce\u5411\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u9662\u4e2d\u4e5d\u72ac\u5ffd\u58f0\u626c\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u771f\u5230\u6708\u660e\u9022\u6076\u72fc\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u725b\u5b88\u4e00\u591c\u8fce\u6668\u5149\u003c/span\u003e\u003cbr/\u003e\n\u003cspan class=\"aigc\"\u003e\u903c\u5f97\u65e5\u5347\u72fc\u9041\u8352\u003c/span\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ad6\u8bfb\u53e5\u9996\uff1a\u8ba1\u7b97\u673a\u5b66\u9662\u771f\u725b\u903c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u9010\u53e5\u53d6\u6307\u5b9a\u5b57\uff1a\u4e8c\u96f6\u4e8c\u516d\u4e5d\u6708\u4e00\u65e5\uff1b\u516b\u53e5\u540c\u62bc \u003ccode\u003eang\u003c/code\u003e \u97f5\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8fd9\u50cf\u4e09\u6761\u5e76\u884c\u4fe1\u9053\uff1a\u53e5\u9996\u653e\u85cf\u5934\uff0c\u53e5\u4e2d\u653e\u65e5\u671f\uff0c\u53e5\u5c3e\u7ba1\u62bc\u97f5\uff1b\u5148\u5360\u69fd\u4f4d\uff0c\u518d\u751f\u6210\u2014\u68c0\u67e5\u2014\u4fee\u8865\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5341\u516b\u4e2a\u5b57\uff0c\u4e00\u7247\u6c34\u003c/h1\u003e\n\u003ch2\u003e\u540c\u4e00\u504f\u65c1\uff0c\u8fd8\u5f97\u6709\u6545\u4e8b\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u5199\u5341\u516b\u5b57\u7684\u4e00\u53e5\u8bdd\uff0c\u5168\u90e8\u6709\u76f8\u540c\u7684\u504f\u65c1\u6216\u90e8\u9996\uff0c\u8981\u6709\u5b9e\u9645\u610f\u4e49\u548c\u6545\u4e8b\u6027\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u6d2a\u6d9d\u6df9\u6ca1\u6c5f\u6e2f\u6e14\u6d66\uff0c\u6cb9\u6c61\u6f02\u6d6e\uff0c\u6c88\u6d9b\u6cc5\u6e21\u6d4e\u6eba\u3002\u003c/span\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e0d\u8ba1\u6807\u70b9\u6070\u597d 18 \u5b57\uff0c\u6bcf\u4e2a\u5b57\u90fd\u5e26 \u003ccode\u003e\u6c35\u003c/code\u003e\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u707e\u5bb3\u3001\u5730\u70b9\u3001\u6c61\u67d3\u3001\u4eba\u540d\u3001\u52a8\u4f5c\u548c\u7ed3\u679c\u90fd\u4ece\u540c\u4e00\u8bed\u4e49\u573a\u91cc\u957f\u51fa\u6765\uff1b\u7ea6\u675f\u7f29\u5c0f\u4e86\u641c\u7d22\u7a7a\u95f4\uff0c\u4e5f\u628a\u5e38\u7528\u865a\u8bcd\u51e0\u4e4e\u5168\u6321\u5728\u95e8\u5916\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u504f\u65c1\u201d\u662f\u5b57\u5f62\u6784\u4ef6\uff0c\u201c\u90e8\u9996\u201d\u4e3b\u8981\u662f\u68c0\u5b57\u5206\u7c7b\u3002\u82e5\u8981\u673a\u68b0\u9a8c\u6536\uff0cspec \u5e94\u5199\u6210\u201c18 \u4e2a\u6c49\u5b57\u90fd\u542b\u540c\u4e00\u53ef\u89c1\u504f\u65c1\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u53ea\u8bb8\u4e00\u4e2a\u97f3\uff0c\u8fd8\u8981\u8bb2\u73b0\u4ee3\u6545\u4e8b\u003c/h1\u003e\n\u003ch2\u003e\u539f\u521b Yi \u97f3\u6587\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u5199\u4e00\u5927\u6bb5\u8bdd\uff08\u6587\u8a00\u6587\uff09\uff0c\u8981\u6c42\u5168\u90e8\u540c\u4e00\u4e2a\u97f3\uff0c\u4e5f\u8981\u6709\u5b9e\u9645\u7684\u6545\u4e8b\u6027\uff0c\u4e0d\u80fd\u7528\u300a\u65bd\u6c0f\u98df\u72ee\u53f2\u300b\u548c\u300a\u5b63\u59ec\u51fb\u9e21\u8bb0\u300b\u539f\u6587\uff0c\u539f\u521b\u4e00\u4e2a\u6709\u73b0\u4ee3\u80cc\u666f\u7684\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u4e59\u6613\u4e00\u8bd1\u4eea\u3002\u4eea\u8bd1\u5f02\u4e49\uff0c\u4e59\u7591\uff0c\u8be3\u9a7f\u8bae\u6613\u3002\u9a7f\u5f79\u63d6\u4e59\uff0c\u4ea6\u7591\u4eea\u5df2\u5f02\uff0c\u79fb\u4eea\u4ee5\u533b\u3002\u7fcc\uff0c\u4eea\u5df2\u5b9c\uff0c\u8bd1\u4e49\u4ea6\u5b9c\uff0c\u4e59\u6021\u3002\u4e59\u4ee5\u4eea\u8bd1\u5f02\u88d4\u610f\uff0c\u5f02\u88d4\u4ea6\u6021\uff1b\u4e59\u76ca\u4ee5\u8bd1\u827a\uff0c\u9038\u77e3\u3002\u003c/span\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6240\u6709\u6c49\u5b57\u7684\u62fc\u97f3\u97f3\u8282\u90fd\u662f \u003ccode\u003eyi\u003c/code\u003e\uff0c\u58f0\u8c03\u53ef\u4ee5\u4e0d\u540c\uff1a\u6709\u4eba\u4e70\u4e86\u7ffb\u8bd1\u5668\uff0c\u53d1\u73b0\u8bef\u8bd1\uff0c\u53bb\u5feb\u9012\u9a7f\u7ad9\u6362\u4fee\uff0c\u7fcc\u65e5\u53d6\u56de\u540e\u7ec8\u4e8e\u6b63\u5e38\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u540c\u97f3\u201d\u662f\u5426\u5305\u542b\u58f0\u8c03\uff0c\u4f1a\u8ba9\u96be\u5ea6\u9aa4\u53d8\uff1b\u9a8c\u6536\u53e3\u5f84\u672c\u8eab\u5c31\u662f spec\u3002\u6587\u5b57\u5c1a\u53ef\u501f\u5b57\u5f62\u6d88\u6b67\uff0c\u6717\u8bfb\u51fa\u6765\u51e0\u4e4e\u4e0d\u53ef\u61c2\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u901a\u8fc7\u6d4b\u8bd5\uff0c\u4e0d\u7b49\u4e8e\u5199\u5f97\u597d\u003c/h1\u003e\n\u003ch2\u003eVerifier \u770b\u5f97\u89c1\u7684\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u85cf\u5934\u3001\u5d4c\u5b57\u987a\u5e8f\u3001\u5b57\u6570\u3001\u504f\u65c1\u3001\u62fc\u97f3\uff0c\u90fd\u53ef\u4ee5\u5199\u6210\u68c0\u67e5\u5668\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6a21\u578b\u4e0d\u5fc5\u4e00\u53e3\u6c14\u201c\u7075\u611f\u547d\u4e2d\u201d\uff1a\u5b83\u53ef\u4ee5\u5148\u627e\u53ef\u884c\u89e3\uff0c\u518d\u9010\u6761\u9a8c\u8bc1\uff0c\u53d1\u73b0\u8fdd\u7ea6\u5c31\u8ffd\u52a0 token \u4fee\u8865\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ea6\u675f\u6587\u5b66\u65e9\u6709\u7c7b\u4f3c\u5b9e\u9a8c\uff1a\u4e54\u6cbb\u00b7\u4f69\u96f7\u514b 1969 \u5e74\u7684\u5c0f\u8bf4\u300a\u6d88\u5931\u300b\u5168\u4e66\u907f\u7528\u6cd5\u8bed\u5b57\u6bcd \u003ccode\u003ee\u003c/code\u003e\u3002\u5f62\u5f0f\u7ea6\u675f\u80fd\u903c\u51fa\u641c\u7d22\uff0c\u5374\u4e0d\u4f1a\u81ea\u52a8\u5e26\u6765\u597d\u4f5c\u54c1\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eVerifier \u770b\u4e0d\u89c1\u7684\u003c/h2\u003e\n\u003cp\u003e\u4ee5\u4e0a\u5df2\u7ecf\u8d85\u8d8a\u5927\u90e8\u5206\u4eba\u7c7b\u7684\u6781\u9650\u4e86\u3002\u6a21\u578b\u4f5c\u4e3a\u201c\u4eba\u7c7b\u201d\u7684\u63a8\u7406\u80fd\u529b\u771f\u7684\u5f88\u5f3a\uff0c\u867d\u7136\u54c1\u5473\u8fd8\u53ef\u4ee5\u63d0\u9ad8\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u901a\u8fc7\u68c0\u67e5\u5668\uff0c\u8bf4\u660e\u5b83\u4f1a\u641c\u7d22\u548c\u4fee\u8865\uff1b\u8bfb\u8d77\u6765\u4ecd\u6709\u70b9\u522b\u626d\uff0c\u8bf4\u660e\u6d4b\u8bd5\u6ca1\u6709\u8986\u76d6\u54c1\u5473\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u7528\u597d\u6a21\u578b\u9075\u5faa\u6307\u4ee4\u7684\u80fd\u529b\u003c/h1\u003e\n\u003ch2\u003e\u8fc7\u53bb\u7684\u4e0a\u4e0b\u6587\u4e00\u76f4\u90fd\u5728\u573a\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6bcf\u4e00\u4e2a token \u7684\u8f93\u51fa\u90fd\u4f1a\u201c\u6ce8\u610f\u201d\u5230\u8fc7\u53bb\u7684\u4e0a\u4e0b\u6587\u003c/li\u003e\n\u003cli\u003e\u5168\u5c40\u7684 \u003ccode\u003eAGENTS.md\u003c/code\u003e \u91cc\u8981\u6c42\u7528\u4e2d\u6587\uff0c\u8fd9\u4e2a\u201c\u7528\u4e2d\u6587\u201d\u4f1a\u4e00\u76f4\u4fdd\u6301\u4e00\u5b9a\u7684\u6ce8\u610f\u529b\u003c/li\u003e\n\u003cli\u003e\u5168\u5c40\u7684 git commit \u4e0d\u8981 \u201cCopiloted by Claude Code\u201d\u003c/li\u003e\n\u003cli\u003e\u6bcf\u4e00\u4e2a token \u90fd\u4f1a\u770b\u5230\u8fd9\u4e9b\uff1b\u9002\u5f53\u7684\u65f6\u5019\uff0c\u4e0b\u4e00\u4e2a chain-of-thought \u5c31\u4f1a\u7ea0\u6b63\u9519\u8bef\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6a21\u578b\u6bcf\u8f93\u51fa\u4e00\u4e2a token\uff0c\u5c31\u53c8\u591a\u4e86\u4e00\u6b21\u53d1\u73b0\u504f\u822a\u3001\u628a\u8f68\u8ff9\u62c9\u56de\u6765\u7684\u673a\u4f1a\u3002\u4f46\u201c\u770b\u5f97\u89c1\u201d\u4e0d\u662f\u786c\u7ea6\u675f\uff1b\u003ca href=\"https://aclanthology.org/2024.tacl-1.9/\"\u003eLost in the Middle\u003c/a\u003e \u4e5f\u63d0\u9192\u6211\u4eec\uff0c\u957f\u4e0a\u4e0b\u6587\u4e2d\u7684\u4fe1\u606f\u5e76\u4e0d\u4f1a\u88ab\u540c\u6837\u53ef\u9760\u5730\u5229\u7528\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4e0a\u4e0b\u6587\u4e5f\u662f\u4e89\u7528\u8d44\u6e90\u003c/h1\u003e\n\u003ch2\u003e\u89c4\u5219\u4f1a\u7ea0\u504f\uff0c\u4e5f\u4f1a\u62a2\u6ce8\u610f\u529b\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u526f\u4f5c\u7528\uff1a\u63d0\u793a\u8bcd\u4f1a\u62a2\u593a\u6ce8\u610f\u529b\u003c/li\u003e\n\u003cli\u003e\u4eba\uff1a\u8981\u767d\u8272\u80cc\u666f\uff0c\u4e0d\u8981\u534a\u900f\u660e\u6548\u679c\u003c/li\u003e\n\u003cli\u003eAI\uff1a\u003ccode\u003e... // \u767d\u8272\u80cc\u666f (\u4e0d\u8981\u534a\u900f\u660e\u6548\u679c)\u003c/code\u003e \ud83d\ude02\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5426\u5b9a\u6307\u4ee4\u6709\u4e2a\u5c34\u5c2c\u4e4b\u5904\uff1a\u4e3a\u4e86\u7981\u6b62\u201c\u534a\u900f\u660e\u201d\uff0c\u4f60\u5148\u628a\u201c\u534a\u900f\u660e\u201d\u5199\u8fdb\u4e86\u4e0a\u4e0b\u6587\u3002\u8fd9\u548c \u003ca href=\"https://doi.org/10.1037/0022-3514.53.1.5\"\u003e\u201c\u4e0d\u8981\u60f3\u767d\u718a\u201d\u003c/a\u003e \u6709\u76f8\u4f3c\u7684\u53cd\u76f4\u89c9\u5473\u9053\uff0c\u4f46\u5bf9\u6a21\u578b\u6765\u8bf4\uff0c\u76f4\u63a5\u539f\u56e0\u66f4\u6734\u7d20\uff1a\u88ab\u7981\u6b62\u7684\u8bcd\u4e5f\u6210\u4e86\u53ef\u7eed\u5199\u7684\u6a21\u5f0f\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5e38\u9a7b\uff0c\u8fd8\u662f\u6309\u9700\u52a0\u8f7d\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4e24\u96be\u95ee\u9898\uff1a\u8981\u4e0d\u8981\u7528\u4e00\u4e2a\u5e38\u9a7b \u003ccode\u003eAGENTS.md\u003c/code\u003e prompt \u628a\u8fd9\u79cd\u884c\u4e3a\u538b\u4e0b\u53bb\uff0c\u4f46\u540c\u65f6\u6c61\u67d3\u4e0a\u4e0b\u6587\uff1f\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5e38\u9a7b\u5c42\u53ea\u653e\u201c\u6bcf\u6b21\u90fd\u8981\u5b88\u3001\u6f0f\u4e00\u6b21\u4ee3\u4ef7\u5f88\u9ad8\u201d\u7684\u77ed\u89c4\u5219\uff1b\u4efb\u52a1\u7ec6\u8282\u6309\u9700\u52a0\u8f7d\u3002\u80fd\u5199\u6210\u68c0\u67e5\u9879\u7684\uff0c\u5c31\u7528 \u003ccode\u003ebackground: #fff; opacity: 1\u003c/code\u003e \u8fd9\u7c7b\u6b63\u89c4\u683c\u548c\u6d4b\u8bd5\u6536\u53e3\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eAI \u803f\u540c\u5b66\u4e0a\u7ebf\uff01\u003c/h1\u003e\n\u003ch2\u003e\u8fd9\u6b21\u7528\u7684\u662f\u6211\u81ea\u5df1\u7684 paper\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u5047\u88c5\u4f5c\u4e3a ICSE\u002727 \u7684\u5ba1\u7a3f\u4eba icse27-901.pdf\uff0c\u6211\u5e94\u8be5\u63a5\u6536\u5b83\u5417\uff1f\u5199\u4e00\u4e2a 1000 words \u5de6\u53f3\u7684 Review.txt\u3002\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u90a3\u6211\u4f1a\u600e\u4e48\u8bfb\u4e00\u7bc7 paper \u5462\uff1f\u6211\u7684\u65e5\u5e38\u9605\u8bfb\u6d41\u7a0b\uff0c\u4f8b\u5982 arXiv\uff0c\u662f\u600e\u6837\u7684\uff1f\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u201c\u4f60\u662f ICSE reviewer\u201d\u4e3b\u8981\u6539\u53d8\u7684\u662f\u5148\u9a8c\u3001\u8bed\u6c14\u548c\u8f93\u51fa\u5f62\u72b6\uff1b\u5b83\u4e0d\u4f1a\u51ed\u7a7a\u8865\u4e0a\u5ba1\u7a3f\u6807\u51c6\u3001\u8bc1\u636e\u94fe\u548c\u53cd\u8bc1\u7a0b\u5e8f\u3002\u6362\u4e0a reviewer \u7684\u5236\u670d\uff0c\u4e0d\u7b49\u4e8e\u5b66\u4f1a\u4e86 review\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u600e\u6837\u6784\u9020\u4e00\u4e2a\u597d\u7684 Reviewer\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u4e09\u6761\u72ec\u7acb\u7684\u5ba1\u7a3f\u8def\u7ebf\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u5224\u636e\u9a71\u52a8\u003c/strong\u003e\uff1a\u5148\u8fd8\u539f\u8bba\u6587\u58f0\u79f0\u7684\u8d21\u732e\uff0c\u518d\u6309\u5ba1\u7a3f\u6807\u51c6\u72ec\u7acb\u6253\u5206\uff1b\u6bcf\u4e2a\u5206\u6570\u90fd\u5fc5\u987b\u6307\u5411\u8bba\u6587\u4e2d\u7684\u8bc1\u636e\u6216\u660e\u786e\u7684\u7f3a\u5931\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u8bc1\u636e\u5ba1\u8ba1\u003c/strong\u003e\uff1a\u4e3a\u6bcf\u4e2a\u6838\u5fc3 claim \u5efa\u8d26\u672c\uff1a\u5b83\u9700\u8981\u4ec0\u4e48\u8bc1\u636e\u3001\u8bba\u6587\u7ed9\u4e86\u4ec0\u4e48\u3001\u54ea\u4e9b\u5047\u8bbe\u6ca1\u9a8c\u8bc1\u3001\u8fd8\u6709\u4ec0\u4e48\u66ff\u4ee3\u89e3\u91ca\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003cstrong\u003e\u53cd\u65b9\u590d\u73b0\u003c/strong\u003e\uff1a\u7ad9\u5728\u6700\u5f3a\u53cd\u65b9\u6216\u590d\u73b0\u8005\u7684\u4f4d\u7f6e\uff0c\u91cd\u7b97\u4e00\u4e2a\u6838\u5fc3\u7ed3\u679c\uff0c\u5bfb\u627e\u6700\u5c0f\u53cd\u4f8b\uff0c\u5e76\u95ee\u201c\u4ec0\u4e48\u89c2\u5bdf\u4f1a\u63a8\u7ffb\u7ed3\u8bba\uff1f\u201d\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u4e09\u6761\u8def\u7ebf\u5148\u5404\u81ea\u5f62\u6210\u5224\u65ad\uff0c\u6700\u540e\u624d\u6c47\u5408\u3002\u5426\u5219\u201c\u4e09\u4e2a reviewer\u201d\u5f88\u5bb9\u6613\u53ea\u662f\u540c\u4e00\u4e2a\u951a\u70b9\u7684\u4e09\u6b21\u6da6\u8272\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u4e0d\u8981\u88ab\u4f5c\u8005\u201c\u5e26\u7740\u8d70\u201d\u003c/h1\u003e\n\u003ch2\u003e\u65b9\u6cd5\u8bba\u51b3\u5b9a AI \u7684\u4e0a\u9650\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u77ed\u7a0b\u4efb\u52a1\uff0c\u57fa\u672c\u4e0a\u5e26\u5bf9\u65b9\u5411\u3001\u660e\u786e\u6307\u4ee4\u5c31\u53ef\u4ee5\u4e86\uff1b\u4f46\u4f60\u7684\u003cstrong\u003e\u65b9\u6cd5\u8bba\u003c/strong\u003e\uff08\u54c1\u5473\uff09\u51b3\u5b9a\u4e86 AI \u7684\u4e0a\u9650\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u6587\u7ae0\u7684\u4fe1\u606f\u5bc6\u5ea6\u975e\u5e38\u5927\u003c/strong\u003e\uff0c\u76f8\u5f53\u4e8e\u6781\u5ea6\u5438\u6536\u6ce8\u610f\u529b\u003c/li\u003e\n\u003cli\u003e\u4f60\u7684\u4e00\u4e9b critical thinking\u3001first-principle thinking\uff0c\u90fd\u53ef\u80fd\u67b6\u4e0d\u4f4f\u88ab\u8bba\u6587\u4f5c\u8005\u672c\u8eab\u7684\u903b\u8f91\u5e26\u7740\u8d70\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8bba\u6587\u4e0d\u53ea\u63d0\u4f9b\u4e8b\u5b9e\uff0c\u8fd8\u66ff reviewer \u9009\u62e9\u4e86\u8bcd\u6c47\u3001\u95ee\u9898\u987a\u5e8f\u3001baseline \u548c metric\u3002\u7b49\u4f60\u5f00\u59cb\u5224\u65ad\u4f5c\u8005\u7684\u7b54\u6848\u65f6\uff0c\u4f5c\u8005\u53ef\u80fd\u5df2\u7ecf\u66ff\u4f60\u7b5b\u6389\u4e86\u66f4\u5173\u952e\u7684\u95ee\u9898\uff1b\u8fd9\u6b63\u662f\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/17835457/\"\u003e\u951a\u5b9a\u6548\u5e94\u003c/a\u003e\u5371\u9669\u7684\u5730\u65b9\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6df1\u8bfb\u524d\u5148\u72ec\u7acb\u5199\u4e0b\u4e09\u4ef6\u4e8b\uff1a\u5b83\u58f0\u79f0\u89e3\u51b3\u4ec0\u4e48\uff0c\u6700\u5f3a\u66ff\u4ee3\u89e3\u91ca\u662f\u4ec0\u4e48\uff0c\u4ec0\u4e48\u7ed3\u679c\u4f1a\u63a8\u7ffb\u5b83\uff1b\u518d\u628a\u6b63\u6587\u62c6\u6210 \u003ccode\u003eclaim \u2192 evidence \u2192 assumption\u003c/code\u003e\u3002\u7a7a\u683c\u5f80\u5f80\u6bd4\u53e5\u5b50\u66f4\u503c\u5f97\u5ba1\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u628a\u54c1\u5473\u84b8\u998f\u6210 Skill\u003c/h1\u003e\n\u003ch2\u003e\u4ece\u5076\u7136\u6210\u529f\u5230\u53ef\u91cd\u590d\u7684\u65b9\u6cd5\u003c/h2\u003e\n\u003cp\u003e\u5f53\u4f60\u6709\u6210\u529f\u7684\u7ecf\u9a8c\uff0c\u5c31\u53ef\u4ee5\u84b8\u998f\u6210 \u003cstrong\u003eSkill\u003c/strong\u003e\uff1a\u770b\u8d77\u6765\u53ea\u662f\u4e2a prompt\uff0c\u5176\u5b9e\u662f\u7528\u53ef\u590d\u7528\u7684\u65b9\u5f0f\u7ea6\u675f\u6a21\u578b\u7684\u884c\u4e3a\u548c\u65b9\u5411\u3002\u73b0\u5728\u7684\u6a21\u578b\u8fd8\u6ca1\u5230\u201c\u7b2c\u4e00\u611f\u89c9\u5c31\u6253\u904d\u5929\u4e0b\u65e0\u654c\u624b\u201d\u7684\u72b6\u6001\uff0c\u5c24\u5176\u662f\u7b54\u6848\u4e0d\u552f\u4e00\u7684\u65f6\u5019\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u597d\u7684 Skill \u4fdd\u5b58\u7684\u4e0d\u662f\u4e0a\u6b21\u7b54\u6848\u7684\u7248\u5f0f\uff0c\u800c\u662f\u641c\u7d22\u7b56\u7565\u3001\u5224\u65ad\u6807\u51c6\u3001\u68c0\u67e5\u70b9\uff0c\u4ee5\u53ca\u201c\u770b\u5230\u4ec0\u4e48\u8bc1\u636e\u5c31\u8f6c\u5411\u201d\u7684\u6761\u4ef6\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eSkill \u672c\u8eab\u4e5f\u662f\u4e00\u9053\u9075\u5faa\u9898\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCaveat\uff1a\u957f Skill \u91cc\u6709\u5927\u91cf\u6307\u4ee4\uff0c\u4f1a\u63d0\u5347\u6307\u4ee4\u9075\u5faa\u7684\u96be\u5ea6\uff1b\u5728 AI \u770b\u6765\uff0c\u548c\u5199\u85cf\u5934\u8bd7\u53ef\u80fd\u5dee\u4e0d\u591a \ud83d\ude02\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u628a Skill \u5206\u5c42\uff1a\u5e38\u9a7b\u5c42\u53ea\u7559\u76ee\u6807\u3001\u786c\u7ea6\u675f\u548c\u505c\u6b62\u6761\u4ef6\uff1b\u89e3\u91ca\u3001\u8303\u4f8b\u3001\u8fb9\u754c\u6848\u4f8b\u6309\u9700\u52a0\u8f7d\uff1b\u673a\u68b0\u7ea6\u675f\u4ea4\u7ed9\u5de5\u5177\u9a8c\u8bc1\u3002\u5c11\u5199\u4e00\u53e5\u529d\u8beb\uff0c\u591a\u52a0\u4e00\u4e2a\u53ef\u68c0\u67e5\u7684\u5b8c\u6210\u6761\u4ef6\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eLong-Horizon \u80fd\u529b\u662f\u600e\u4e48\u201c\u7ec3\u201d\u51fa\u6765\u7684\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u6a21\u578b\u662f\u8bad\u7ec3\u51fa\u6765\u7684\u003c/h2\u003e\n\u003cp\u003e\u53ea\u8981\u6709\u53cd\u9988\u4fe1\u53f7\uff0c\u5c31\u53ef\u4ee5\u5f3a\u5316\u5b66\u4e60\uff1a\u7b54\u5bf9\u4e86\u7ed9\u5956\u52b1\uff0c\u7b54\u9519\u4e86\u63cd\u3002\u540e\u8bad\u7ec3\u903c\u8feb\u6a21\u578b\u89c4\u5212\u3001\u601d\u8003\uff0c\u5b66\u4f1a\u975e\u5e38\u79bb\u8c31\u7684\u957f\u7a0b\u4ee3\u7801\u80fd\u529b\uff0c\u80fd\u4e0d\u65ad\u8bd5\u9519\u3001\u89e3\u51b3\u95ee\u9898\uff0c\u76f4\u5230\u6ee1\u8db3\u8981\u6c42\uff1b\u8fde\u521a\u624d\u90a3\u4e9b\u6298\u78e8\u4eba\u7684\u201c\u8bed\u6587\u201d\u6307\u4ee4\u4e5f\u987a\u4fbf\u5b66\u4f1a\u4e86\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eLong-horizon \u4e0d\u662f\u4e00\u6b21\u6027\u60f3\u5f97\u7279\u522b\u6df1\uff0c\u800c\u662f\u95ed\u73af\u63a7\u5236\uff1a\u003ccode\u003e\u5c1d\u8bd5 \u2192 \u7f16\u8bd1/\u6d4b\u8bd5 \u2192 \u89c2\u5bdf \u2192 \u4fee\u590d\u003c/code\u003e\u3002\u771f\u6b63\u53d8\u957f\u7684\u662f\u201c\u51fa\u9519\u4ee5\u540e\u8fd8\u80fd\u56de\u6765\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4ee3\u7801\u4e16\u754c\u683c\u5916\u9002\u5408\u8fd9\u4ef6\u4e8b\uff1a\u6784\u5efa\u3001\u6d4b\u8bd5\u3001benchmark \u90fd\u80fd\u53cd\u590d\u7ed9\u51fa\u4fbf\u5b9c\u7684\u5224\u5206\u4fe1\u53f7\uff0c\u5f88\u50cf AlphaGo Zero \u62e5\u6709\u89c4\u5219\u786e\u5b9a\u3001\u7ed3\u679c\u53ef\u9a8c\u8bc1\u7684\u68cb\u76d8\u3002(\u003ca href=\"https://doi.org/10.1038/nature24270\"\u003eNature, 2017\u003c/a\u003e)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u53cd\u9988\u4e5f\u53ef\u80fd\u6559\u574f\u6a21\u578b\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5982\u679c\u6d4b\u8bd5\u53ea\u8986\u76d6\u8868\u9762\u884c\u4e3a\uff0c\u201c\u575a\u6301\u201d\u4e5f\u53ef\u80fd\u53d8\u6210 reward hacking\uff1a\u4e0d\u662f\u903c\u8fd1\u4f60\u7684\u771f\u5b9e\u76ee\u6807\uff0c\u800c\u662f\u628a\u516c\u5f00\u5206\u6570\u5237\u6ee1\u3002\u56e0\u6b64\u8fd8\u9700\u8981 held-out tests \u548c\u72ec\u7acb review\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5927\u578b\u7cfb\u7edf\uff0c\u53cd\u800c\u66f4\u5bb9\u6613\uff1f\u003c/h1\u003e\n\u003ch2\u003eGreenfield \u6096\u8bba\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u4ece\u96f6\u5f00\u59cb\u505a\u4ea7\u54c1\u770b\u8d77\u6765\u4e0d\u96be\uff0cAI \u5374\u4f1a\u4ece\u67d0\u4e2a\u65f6\u95f4\u70b9\u5f00\u59cb\u5404\u79cd\u7ffb\u8f66\u3002\u53cd\u800c\u5728\u5927\u578b\u590d\u6742\u8f6f\u4ef6\u7cfb\u7edf\u91cc\uff0cAI \u6e38\u5203\u6709\u4f59\uff0c\u4ee4\u4eba\u8fc5\u901f\u6ed1\u8dea\uff1f\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003eself-attention \u53ef\u4ee5\u201c\u770b\u5230\u201d\u597d\u7684 practice\uff0c\u5e76\u4e14\u7acb\u5373 in-context learn\uff0c\u5b66\u5230\u5e94\u8be5\u9075\u5faa\u7684\u5df2\u6709 best practice\u3002\u003c/li\u003e\n\u003cli\u003e\u5982\u679c\u4ea7\u54c1\u8d77\u6b65\u65f6\u6ca1\u6709\u5efa\u7acb\u826f\u597d\u7684\u5de5\u7a0b\u7eaa\u5f8b\uff0cAI \u4f1a\u5b66\u4f1a\u5728 slop \u4e0a\u65e0\u9650\u53e0\u52a0\u3002\u003c/li\u003e\n\u003cli\u003e\u542f\u53d1\uff1a\u201c\u63d0\u793a\u8bcd\u201d\u4e0d\u4ec5\u662f\u4f60\u8f93\u5165\u7684\uff0c\u751a\u81f3\u4ee3\u7801\u5e93\u672c\u8eab\u4e5f\u662f\u201c\u63d0\u793a\u8bcd\u201d\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4ee3\u7801\u5c11\uff0c\u4e0d\u4ee3\u8868\u4fe1\u606f\u5c11\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6210\u719f\u4ed3\u5e93\u7528\u547d\u540d\u3001\u5206\u5c42\u3001\u9519\u8bef\u5904\u7406\u548c\u6d4b\u8bd5\uff0c\u628a\u5de8\u5927\u7684\u8bbe\u8ba1\u7a7a\u95f4\u538b\u6210\u201c\u7167\u7740\u90bb\u5c45\u8865\u5168\u201d\uff1bgreenfield \u91cc\u6bcf\u4e2a\u9009\u62e9\u90fd\u60ac\u7a7a\uff0c\u4fe1\u606f\u71b5\u53cd\u800c\u66f4\u9ad8\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6a21\u578b\u53ea\u4f1a\u8ffd\u6c42\u5c40\u90e8\u4e00\u81f4\u6027\uff0c\u5e76\u4e0d\u77e5\u9053\u773c\u524d\u7684\u662f best practice \u8fd8\u662f\u5386\u53f2\u4e8b\u6545\u3002\u7b2c\u4e00\u6876 slop \u4e00\u65e6\u6210\u4e3a\u591a\u6570\u6d3e\uff0c\u540e\u9762\u7684 slop \u4f1a\u50cf\u590d\u5229\u4e00\u6837\u589e\u957f\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u201c\u653e\u4e00\u4e2a\u597d\u9879\u76ee\u7ed9 AI \u770b\u201d\u9760\u8c31\u5417\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u8c03\u7814\u7ed3\u8bba\uff1a\u731c\u6d4b\u6210\u7acb\u4e00\u534a\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6211\u7684\u731c\u6d4b\uff1a\u5728\u4ee3\u7801\u5e93\u91cc\u653e\u4e00\u4e2a\u76f8\u8fd1\u9886\u57df\u3001\u4f18\u96c5\u6210\u719f\u7684\u9ad8\u8d28\u91cf\u7cfb\u7edf\uff0c\u5148\u8ba9 AI \u8bfb\u4e00\u4e0b\uff0c\u518d\u5b9e\u73b0\u9700\u6c42\uff0c\u80fd\u5f97\u5230\u8d28\u91cf\u66f4\u9ad8\u7684\u8f6f\u4ef6\u3002\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u673a\u5236\u4e0a\u5408\u7406\uff0c\u4f46\u201c\u76f8\u8fd1\u3001\u7cbe\u9009\u3001\u6309\u9700\u53d6\u7528\u201d\u6bd4\u201c\u6574\u4e2a\u4ed3\u5e93\u585e\u8fdb\u53bb\u201d\u91cd\u8981\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://aclanthology.org/2023.emnlp-main.151/\"\u003eRepoCoder\u003c/a\u003e \u4e2d\uff0c\u8fed\u4ee3\u68c0\u7d22\u4ed3\u5e93\u76f8\u5173\u7247\u6bb5\u6bd4\u53ea\u770b\u5f53\u524d\u6587\u4ef6\u7684 baseline \u63d0\u5347\u8d85\u8fc7 10%\uff1b\u8fd9\u652f\u6301\u201c\u597d\u793a\u4f8b\u6709\u7528\u201d\uff0c\u5374\u6ca1\u6709\u8bc1\u660e\u5916\u6765\u5927\u4ed3\u5e93\u5fc5\u7136\u6709\u76ca\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://aclanthology.org/2025.findings-naacl.176/\"\u003eCodeRAG-Bench\u003c/a\u003e \u7684\u7ed3\u8bba\u66f4\u514b\u5236\uff1a\u9ad8\u8d28\u91cf context \u4f1a\u5e2e\u5fd9\uff0c\u4f46\u201c\u627e\u5bf9\u7247\u6bb5\u201d\u548c\u201c\u771f\u7684\u7528\u597d\u7247\u6bb5\u201d\u4ecd\u662f\u74f6\u9888\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6574\u5e93\u8f93\u5165\u8fd8\u53ef\u80fd\u5e26\u6765 negative transfer\uff1a\u6280\u672f\u6808\u3001\u7ea6\u675f\u3001\u4f9d\u8d56\u6216\u67b6\u6784\u54f2\u5b66\u4e0d\u5339\u914d\uff1b\u5b83\u4e5f\u4f1a\u6d88\u8017 context\uff0c\u8ba9\u771f\u6b63\u76f8\u5173\u7684\u7ea6\u675f\u88ab\u6df9\u6ca1\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4e00\u4e2a\u80fd\u505a\u7684\u5bf9\u7167\u5b9e\u9a8c\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u56fa\u5b9a\u4efb\u52a1\u3001\u6a21\u578b\u3001token budget \u548c\u968f\u673a\u79cd\u5b50\uff0c\u5bf9\u6bd4\uff1a\u65e0\u793a\u4f8b / \u5b8c\u6574\u53c2\u8003\u4ed3\u5e93 / 3\u20135 \u4e2a\u7cbe\u9009 golden paths\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u9664\u4e86\u901a\u8fc7\u7387\uff0c\u8fd8\u8981\u76f2\u6d4b\u67b6\u6784\u8fdd\u89c4\u3001\u4fee\u6539\u6269\u6563\u9762\u3001review \u65f6\u95f4\u3001\u540e\u7eed\u7f3a\u9677\u548c\u4ee3\u7801\u514b\u9686\u7387\u3002\u6211\u7684\u9884\u6d4b\uff1a\u7cbe\u9009\u7684\u7aef\u5230\u7aef\u7ad6\u5207\u7247\u6700\u7a33\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u6ca1\u6709\u201c\u8d85\u80fd\u529b AI\u201d\u003c/h1\u003e\n\u003ch2\u003e\u4f60\u4ecd\u7136\u9700\u8981\u201c\u6709\u6982\u5ff5\u201d\u003c/h2\u003e\n\u003cp\u003e\u5bf9\u4f60\u8981\u5b9e\u73b0\u7684\u4e1c\u897f\u003cstrong\u003e\u6709\u6982\u5ff5\u003c/strong\u003e\uff0c\u73b0\u5728\u4ecd\u7136\u975e\u5e38\u91cd\u8981\u3002Sadly\uff0c\u8fd9\u53ea\u80fd\u901a\u8fc7\u003cstrong\u003e\u5b66\u4e60\u003c/strong\u003e\u83b7\u5f97\u3002\u4f1a\u7528\u4e00\u5b66\u671f\u6765\u89e3\u91ca\u5982\u4f55\u7528\u8f6f\u4ef6\u5de5\u7a0b\u7684\u65b9\u6cd5\uff1a\u7ed9\u51fa\u6b63\u786e\u6307\u4ee4\u3001\u76d1\u63a7 AI \u8fd0\u884c\u3001\u9632\u6b62 AI \u5931\u63a7\u2026\u2026\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u5bf9 CS \u5b66\u751f\u6765\u8bf4\uff0c\u5b66\u79d1\u77e5\u8bc6\u4f53\u7cfb\u4ecd\u7136\u975e\u5e38\u91cd\u8981\uff1a\u5904\u7406\u5668\u3001\u64cd\u4f5c\u7cfb\u7edf\u3001\u7f16\u8bd1\u5668\u3001\u6570\u636e\u5e93\u91cc\u6709\u5f88\u591a\u003cstrong\u003e\u8bbe\u8ba1\u667a\u6167\u003c/strong\u003e\u3002\u003c/li\u003e\n\u003cli\u003e\u4f60\u9700\u8981\u628a\u6a21\u578b\u003cstrong\u003e\u5f15\u5bfc\u003c/strong\u003e\u5230\u4f60\u8ba4\u4e3a\u5408\u9002\u7684\u4f4d\u7f6e\u4e0a\u3002\u003c/li\u003e\n\u003cli\u003e\u4f46\u4f60\u4e0d\u7406\u89e3\u7684\u4e1c\u897f\u662f\u4e0d\u80fd\u9a7e\u9a6d\u7684\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5b66\u4e60\u7684\u76ee\u6807\u53d8\u4e86\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u9886\u57df\u77e5\u8bc6\u4e0d\u662f\u4e3a\u4e86\u548c AI \u6bd4\u6bcf\u5206\u949f\u5199\u591a\u5c11\u884c\uff0c\u800c\u662f\u7ed9\u51fa\u4e0d\u53d8\u91cf\u3001\u63a5\u53e3\u8fb9\u754c\u548c\u5931\u8d25\u6a21\u5f0f\uff1a\u4ec0\u4e48\u65f6\u5019\u201c\u80fd\u8dd1\u201d\u4ecd\u7136\u662f\u9519\u7684\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eBainbridge \u5728 1983 \u5e74\u5c31\u6307\u51fa\u201c\u81ea\u52a8\u5316\u7684\u53cd\u8bbd\u201d\uff1a\u5bb9\u6613\u7684\u90e8\u5206\u88ab\u81ea\u52a8\u5316\uff0c\u4eba\u7559\u4e0b\u7684\u6070\u597d\u662f\u5f02\u5e38\u3001\u63a5\u7ba1\u548c\u65e0\u6cd5\u9884\u6f14\u7684\u60c5\u51b5\uff0c\u56e0\u6b64\u53cd\u800c\u9700\u8981\u66f4\u6df1\u7684\u7cfb\u7edf\u6a21\u578b\u3002(\u003ca href=\"https://doi.org/10.1016/0005-1098(83)90046-8\"\u003eIronies of Automation\u003c/a\u003e)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eResearch Failure\uff1aToken \u82b1\u5b8c\u4e86\uff0c\u77e5\u8bc6\u6ca1\u6709\u589e\u52a0\u003c/h1\u003e\n\u003ch2\u003e\u7b26\u53f7\u6267\u884c\u5f15\u64ce\u4f18\u5316\u003c/h2\u003e\n\u003cp\u003e\u8bd5\u56fe\u4f18\u5316\u4e00\u4e2a\u7b26\u53f7\u6267\u884c\u5f15\u64ce\uff1a\u6709\u4e00\u4e2a\u539f\u59cb idea\uff0c\u95ee\u9898\u5e26\u4e00\u70b9 active\u3001open-ended research \u7684\u5473\u9053\uff0c\u4f46\u4e5f\u53ea\u662f\u5e0c\u671b\u5f80\u524d\u63a8\u8fdb\u4e00\u70b9\u70b9\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePhD student\uff1aGPT-5.6 Sol Ultra \u542f\u52a8\uff01benchmark \u4e22\u8fdb\u53bb\uff0c\u60f3\u6cd5\u4e22\u8fdb\u53bb\uff0c\u82b1\u4e86\u5f88\u591a token\uff0c\u6ca1\u6709\u7ed3\u679c\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u95ee\u9898\u53ef\u80fd\u51fa\u5728\u54ea\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7f3a\u7684\u4e0d\u662f token\uff0c\u800c\u662f\u4fbf\u5b9c\u3001\u5c40\u90e8\u3001\u53ef\u5f52\u56e0\u7684\u53cd\u9988\u3002\u4e00\u4e2a\u603b benchmark \u5206\u6570\u51e0\u4e4e\u4e0d\u7ed9\u4e0b\u4e00\u6b65\u65b9\u5411\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u6ca1\u53d8\u5feb\u201d\u53ef\u80fd\u6765\u81ea path explosion\u3001solver\u3001\u7f13\u5b58\u3001\u5185\u5b58\u3001\u641c\u7d22\u7b56\u7565\u3001\u5b9e\u73b0 bug \u6216\u73af\u5883\u566a\u58f0\uff1bAgent \u4e0d\u77e5\u9053\u8be5\u5f3a\u5316\u54ea\u4e00\u6b65\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u66f4\u8981\u547d\u7684\u662f\uff1aAgent \u88ab\u8bad\u7ec3\u6210\u201c\u628a\u4efb\u52a1\u505a\u5b8c\u201d\uff0c\u7814\u7a76\u5374\u5141\u8bb8\u6700\u597d\u7684\u7ed3\u8bba\u662f\u201c\u539f\u59cb idea \u4e0d\u6210\u7acb\u201d\u3002\u6ca1\u6709\u53ef\u8bc1\u4f2a\u5047\u8bbe\uff0c\u5b83\u53ef\u80fd\u628a\u9519\u8bef\u60f3\u6cd5\u5b9e\u73b0\u5f97\u8d8a\u6765\u8d8a\u5b8c\u6574\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ecf\u5178\u7684 \u003ca href=\"https://www.usenix.org/conference/osdi-08/presentation/klee-unassisted-and-automatic-generation-high-coverage-tests-complex\"\u003eKLEE\u003c/a\u003e \u628a\u95ee\u9898\u62c6\u6210\u641c\u7d22\u7b56\u7565\u3001\u7ea6\u675f\u7f13\u5b58\u3001independent constraint sets \u7b49\u673a\u5236\uff0c\u518d\u5206\u522b\u6d4b\u91cf\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u66f4\u5408\u7406\u7684\u8d77\u70b9\uff1a\u5148 profile \u4e3b\u5bfc\u74f6\u9888\uff0c\u628a idea \u6539\u5199\u6210\u4e00\u53e5\u53ef\u8bc1\u4f2a\u9884\u6d4b\uff0c\u9020\u51e0\u5341\u79d2\u5c31\u6709\u53cd\u9988\u7684 microbenchmark\uff0c\u518d\u505a baseline \u548c ablation\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5c11\u5e72\u9884\uff0c\u53cd\u800c\u505a\u5f97\u66f4\u591a\u003c/h1\u003e\n\u003ch2\u003eLatency \u548c Throughput \u662f\u4e24\u56de\u4e8b\u003c/h2\u003e\n\u003cp\u003e\u4e00\u822c\u6765\u8bf4\uff0c\u6211\u5bf9\u8981\u89e3\u51b3\u7684\u95ee\u9898\u4e86\u89e3\u66f4\u591a\uff0c\u6240\u4ee5\u6211\u5e72\u9884\uff0c\u4f1a\u5b8c\u6210\u5f97\u66f4\u5feb\u3002\u4f46\u662f\u6211\u8d8a\u6765\u8d8a\u5c11\u5e72\u9884\u4e86\uff1aAI \u8d70\u5f2f\u8def\u4e5f\u003cstrong\u003e\u80fd\u5b8c\u6210\u003c/strong\u003e\uff0c\u90a3\u6211\u8fd8\u4e0d\u5982\u5207\u6362\u5230\u53e6\u4e00\u4e2a\u4efb\u52a1\u3002\u53ea\u8981\u7ed3\u679c\u80fd\u6ee1\u610f\uff0c\u6211\u66f4\u503e\u5411\u4e8e\u4e0d\u7ba1\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4eba\u7c7b\u5e72\u9884\u4f18\u5316\u5355\u4e2a\u4efb\u52a1\u7684 latency\uff1b\u653e\u624b\u8ba9 Agent \u8dd1\uff0c\u4f18\u5316\u7684\u662f\u4e00\u6574\u5929\u7684 throughput\u3002\u673a\u5668\u591a\u8d70\u4e00\u70b9\u5f2f\u8def\uff0c\u6362\u56de\u6700\u7a00\u7f3a\u7684\u4eba\u7c7b\u6ce8\u610f\u529b\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u653e\u624b\u6210\u7acb\u6709\u4e24\u4e2a\u524d\u63d0\uff1a\u4efb\u52a1\u53ef\u4ee5\u5e76\u884c\uff0c\u5931\u8d25\u53ef\u4ee5\u4fbf\u5b9c\u5730\u6062\u590d\u3002\u5426\u5219\u201c\u5c11\u5e72\u9884\u201d\u53ea\u662f\u628a\u6545\u969c\u63a8\u8fdf\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eReview \u4ec0\u4e48\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6bd4\u5982\u63a5\u53e3\u6211 review \u8fc7\u4e86\uff0c\u5b9e\u73b0\u662f AI slop\uff0c\u6700\u540e\u51fa\u95ee\u9898\u4e86\u4fee\u5c31\u884c \ud83d\ude02\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6309\u201c\u4e0d\u53ef\u9006\u6027 \u00d7 \u7206\u70b8\u534a\u5f84\u201d\u5206\u914d\u6ce8\u610f\u529b\uff1a\u63a5\u53e3\u3001\u4e0d\u53d8\u91cf\u3001\u6570\u636e\u683c\u5f0f\u3001\u6743\u9650\u548c\u6d4b\u8bd5\u65e9\u770b\uff1b\u53ef\u66ff\u6362\u7684\u53f6\u5b50\u5b9e\u73b0\u53ef\u4ee5\u665a\u770b\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e30\u7530\u7684\u201c\u81ea\u50cd\u5316\u201d\u4e5f\u662f\u8fd9\u4e2a\u903b\u8f91\uff1a\u4e00\u4e2a\u4eba\u7167\u770b\u591a\u53f0\u673a\u5668\uff0c\u9760\u5f02\u5e38\u81ea\u52a8\u505c\u673a\u548c andon \u62a5\u8b66\uff0c\u800c\u4e0d\u662f\u76ef\u4f4f\u6bcf\u4e00\u6b65\u3002Agent \u7684\u5bf9\u5e94\u7269\u662f CI\u3001\u9884\u7b97\u3001\u6743\u9650\u8fb9\u754c\u548c stop condition\u3002(\u003ca href=\"https://global.toyota/en/company/vision-and-philosophy/production-system/\"\u003eToyota Production System\u003c/a\u003e)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eContext \u8d8a\u957f\uff0c\u4e0d\u7b49\u4e8e\u8bb0\u5f97\u8d8a\u7262\u003c/h1\u003e\n\u003ch2\u003eCaveat\u003c/h2\u003e\n\u003cp\u003e\u968f\u7740\u4e0a\u4e0b\u6587\u589e\u957f\uff0c\u6307\u4ee4\u9075\u5faa\u4f1a\u4e0b\u964d\uff1b\u4f46\u6700\u540e\u7684 prompt\u3001\u521a\u52a0\u8f7d\u7684 skill \u901a\u5e38\u4ecd\u80fd\u9075\u5faa\uff0c\u56e0\u6b64\u5e72\u6d3b\u8fd8\u662f\u5f88\u597d\u7528\u7684\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eContext window \u662f\u5bb9\u91cf\uff0c\u4e0d\u662f\u6709\u6548\u6ce8\u610f\u529b\u3002\u65e5\u5fd7\u3001\u8865\u4e01\u548c\u5de5\u5177\u8f93\u51fa\u4e0d\u65ad\u8fdb\u5165\u5de5\u4f5c\u96c6\u540e\uff0c\u201c\u8fd8\u5728\u7a97\u53e3\u91cc\u201d\u4e0d\u7b49\u4e8e\u201c\u6b64\u523b\u7528\u5f97\u4e0a\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://aclanthology.org/2024.tacl-1.9/\"\u003eLost in the Middle\u003c/a\u003e \u53d1\u73b0\uff0c\u76f8\u5173\u4fe1\u606f\u653e\u5728\u957f\u4e0a\u4e0b\u6587\u4e2d\u90e8\u65f6\uff0c\u6a21\u578b\u5f80\u5f80\u4e0d\u5982\u653e\u5728\u5f00\u5934\u6216\u7ed3\u5c3e\u65f6\u7528\u5f97\u7a33\u5b9a\uff1b\u8fd9\u4e5f\u89e3\u91ca\u4e86\u672b\u5c3e prompt \u548c\u65b0\u52a0\u8f7d skill \u7684\u4f18\u52bf\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u628a\u8981\u6c42\u4ece\u201c\u8bb0\u5fc6\u201d\u5347\u7ea7\u6210\u201c\u673a\u5236\u201d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5173\u952e\u8981\u6c42\u5728\u51b3\u7b56\u70b9\u91cd\u65b0\u843d\u5730\uff1a\u77ed checklist\u3001\u9636\u6bb5\u6027\u91cd\u8bfb spec/skill\u3001\u5408\u5e76\u524d\u590d\u8ff0\u4e0d\u53d8\u91cf\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u80fd\u7f16\u7801\u6210\u7c7b\u578b\u3001lint\u3001property tests\u3001CI gate \u548c\u6743\u9650\u6c99\u7bb1\u7684\uff0c\u5c31\u522b\u53ea\u5199\u5728 prompt \u91cc\u3002prompt \u4f1a\u88ab\u538b\u7f29\uff0c\u5931\u8d25\u7684\u6d4b\u8bd5\u4e0d\u4f1a\u5047\u88c5\u81ea\u5df1\u901a\u8fc7\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e0a\u4e0b\u6587\u538b\u7f29\u5e94\u4fdd\u5b58\u201c\u76ee\u6807\u3001\u7ea6\u675f\u3001\u672a\u51b3\u95ee\u9898\u3001\u8bc1\u636e\u201d\uff0c\u800c\u4e0d\u662f\u6309\u65f6\u95f4\u7ebf\u590d\u8ff0\u53d1\u751f\u8fc7\u4ec0\u4e48\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5728\u4e0d\u786e\u5b9a\u6027\u4e2d\u63a2\u7d22\u003c/h1\u003e\n\u003ch2\u003e\u8fd9\u6b21\u4e0d\u662f\u201c\u89e3\u9898\u201d\u003c/h2\u003e\n\u003cp\u003e\u6211\u5c31\u662f\u5e0c\u671b\u6a21\u578b\u003cstrong\u003e\u5728\u4e0d\u786e\u5b9a\u6027\u4e2d\u63a2\u7d22\u003c/strong\u003e\u3002\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u5982\u679c\u6240\u6709\u8981\u6c42\u548c\u8def\u7ebf\u90fd\u60f3\u6e05\u695a\u4e86\uff0c\u8fd9\u5c31\u662f\u4e00\u4e2a\u76f8\u5bf9\u65e0\u8da3\u7684\u95ee\u9898\uff1aChain-of-thought \u5c31\u80fd\u89e3\u51b3\u003c/li\u003e\n\u003cli\u003e\u4eca\u5929\u201c\u5e2e\u6211\u8003\u8651\u4e00\u4e0b\u51e0\u79cd\u65b9\u6848\u201d\u6709\u6548\uff0c\u4f46\u53ef\u80fd\u4e0d\u662f\u6700\u4f73\u7684\u003c/li\u003e\n\u003cli\u003e\u6a21\u578b\u88ab\u8bad\u7ec3\u6210\u4e86\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u624d\u6709\u5956\u52b1\uff0c\u6240\u4ee5\u5b83\u4f1a\u7ed9\u4f60\u003cstrong\u003e\u6709\u9650\u003c/strong\u003e\u7684\u65b9\u6848\uff1bcomplexity gap \u91cc\uff0c\u90a3\u4e2a\u201c\u66f4\u597d\u201d\u7684\u53ef\u80fd\u88ab\u85cf\u8d77\u6765\u4e86\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u8c01\u89c4\u5b9a\u201c\u5df2\u7ecf\u60f3\u5b8c\u4e86\u201d\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u7ed9\u6211\u51e0\u79cd\u201d\u53ea\u89c4\u5b9a\u4e86\u505c\u6b62\u6761\u4ef6 $k$\uff0c\u6ca1\u6709\u89c4\u5b9a\u8986\u76d6\u7387\u3002\u8fd9\u6b63\u662f Herbert Simon \u6240\u8bf4\u7684\u003ca href=\"https://www.nobelprize.org/prizes/economic-sciences/1978/simon/lecture/\"\u003e\u6ee1\u610f\u5316\u003c/a\u003e\uff1a\u641c\u5230\u201c\u591f\u597d\u201d\u5c31\u505c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eCoT \u7528\u7b97\u529b\u6362\u003cstrong\u003e\u6df1\u5ea6\u003c/strong\u003e\uff1a\u6cbf\u4e00\u6761\u8def\u591a\u8d70\u51e0\u6b65\uff1b\u5e76\u884c\u679a\u4e3e\u7528\u7b97\u529b\u6362\u003cstrong\u003e\u5bbd\u5ea6\u003c/strong\u003e\uff1a\u8ba9\u66f4\u591a\u8f68\u8ff9\u8fdb\u5165\u4f4e\u6982\u7387\u7684\u5c3e\u90e8\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u63a2\u7d22\u7684\u74f6\u9888\u5e38\u5e38\u4e0d\u662f\u201c\u60f3\u4e0d\u51fa\u201d\uff0c\u800c\u662f\u6a21\u578b\u592a\u65e9\u8ba4\u5b9a\u201c\u5df2\u7ecf\u591f\u4e86\u201d\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u7b97\u529b\u6362\u667a\u529b\u003c/h1\u003e\n\u003cp\u003e\u65b9\u6cd5\uff1atest-time scaling \u7684\u53e6\u4e00\u4e2a\u7ef4\u5ea6\u3002\u003c/p\u003e\n\u003ch2\u003e\u4e0d\u8981\u53ea\u95ee\u201c\u7ed9\u6211\u51e0\u4e2a\u540d\u5b57\u201d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eExample\uff1a\u7ed9\u6211\u5c0f\u5b69\u53d6\u4e00\u4e2a\u848b\u59d3\uff0c\u597d\u542c\u3001\u53c8\u6709\u5bc4\u6258\u7684\u540d\u5b57\u003c/li\u003e\n\u003cli\u003e\u76f4\u63a5\u8ba9\u5b83\u7ed9\u4e00\u4e9b\uff0cAI \u6709\u81ea\u5df1\u7684 bias\uff1b\u4f60\u53ef\u80fd\u4e0d\u592a\u60f3\u7528\u2014\u2014\u522b\u4eba\u4e5f\u4f1a\u7528\uff0c\u6210\u4e3a AI \u65f6\u4ee3\u7684 z\u01d0h\u00e1n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u628a\u7075\u611f\u6539\u9020\u6210\u641c\u7d22\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5b9a\u4e49\u63a2\u7d22\u7a7a\u95f4\u3001\u8981\u6c42\u679a\u4e3e\u3001sub-agent \u68c0\u67e5\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u751f\u6210\uff1a\u5178\u6545 \u00d7 \u97f3\u97f5 \u00d7 \u65b9\u8a00 \u00d7 \u65f6\u4ee3\u611f\uff1b\u5148\u72ec\u7acb\u91c7\u6837\uff0c\u518d\u6c47\u603b\uff0c\u522b\u8ba9 sub-agent \u4e00\u5f00\u59cb\u5c31\u4e92\u76f8\u6284\u7b54\u6848\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5ba1\u540d\uff1a\u67e5\u51fa\u5904\u3001\u542c\u8c10\u97f3\u3001\u770b\u91cd\u540d\uff0c\u518d\u8ba9\u201c\u53cd\u5bf9\u8005\u201d\u4e13\u6311\u6bdb\u75c5\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u679a\u4e3e\u8d1f\u8d23\u63d0\u9ad8\u8986\u76d6\u7387\uff0c\u5ba1\u67e5\u8d1f\u8d23\u63d0\u9ad8\u5206\u8fa8\u7387\uff1a$\\text{\u9009\u62e9\u8d28\u91cf} \\approx \\text{\u8986\u76d6\u7387} \\times \\text{\u8bc4\u4f30\u5206\u8fa8\u7387}$\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u6211\u4eec\u4e00\u76f4\u5728\u201c\u591a\u91c7\u6837\u201d\u003c/h1\u003e\n\u003ch2\u003e\u4e16\u754c\u5f88\u5927\uff0c\u4eba\u5f88\u5c0f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4eba\u7684\u54c1\u5473\u6765\u6e90\u4e8e diversity\uff1a\u4e0d\u540c\u7684\u6559\u80b2\u80cc\u666f\u3001\u751f\u6d3b\u5708\u3001\u7ecf\u5386\u2026\u2026Richard Sutton\u0027s \u003ca href=\"http://incompleteideas.net/papers/The_Big_World_Hypothesis.pdf\"\u003eBig World Hypothesis\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u4eba\u5929\u751f\u5bf9\u6240\u6709\u95ee\u9898\u90fd\u6709 bias\uff1b\u4f46 $1 + 1 \u0026gt; 2$\uff1a\u65e0\u8bba\u662f\u548c\u820d\u53cb\u83dc\u9e21\u4e92\u5544\uff0c\u8fd8\u662f\u53bb\u5f00 conference\uff0c\u90fd\u662f\u5728\u7406\u89e3\u5bf9\u65b9\u7684 bias\uff0c\u4fc3\u8fdb\u7fa4\u4f53\u667a\u80fd\uff0c\u7136\u540e\u6bcf\u4e2a\u4eba\u7ee7\u7eed\u5e26\u7740 bias \u521b\u65b0\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg alt=\"\" src=\"data:image/webp;base64,UklGRh73AABXRUJQVlA4IBL3AADwIgSdASr/BNACPu1wr1GppqSiqFc54TAdiWNu/F+4aFbdnkCfpiOz79Bjz3U9x5kPI/pr/M038dbpTOv96/2PNv/6PXXuKvOn5xnnO+of/sOrI6H/1qMg086f6/+7eqXy4/meGP5f9x/0/OHyV9tOp39A/Wucn+673/njqEe8vPe/N7T7bv+T+33sF+4v4jzOfvvNj93/4nsBd+x4XnsXsFf1P/Yern/vf/7zx/pf/W/dL4FP2z//f+0KCbec285t5zbzm3nNvObec285t4PnNbrBtL2ClLn70B8vwJREhQKiYyIX9gw463dFu6Ld0W7ot3Rbui3dFu6Ld0W7ot3Rbui3dFu6Ld0W7ot3RbuixXZ0bJbEQY6+caJf8cQb9oarUqQIhb8Ycjk6eQUFpOOCGGikolJRKSiUlEpKJSUSkolJRKSiUlEpKJSUSkolJRKSiUlEpKJSTK7g//z4ceZmmKJfE6CGfKMRkwgH5P8hPFHreP6wFu2xK867Cui3dFu6Ld0W7ot3Rbui3dFu6Ld // 组装单页：开头的 <h1> 提为 .titlebar（放在 .inner 之外），
// 使标题条不参与整页缩放、左右始终顶格；其余内容进 .inner 等比缩放。
function makeSlide(html, i) {
  const section = document.createElement('section');
  // 首页带 no-anim：刷新时直接显示、不播入场动画；首次翻页即移除，此后正常过渡
  section.className = 'slide' + (i === 0 ? ' active no-anim' : '');
  const m = html.match(/^\s*<h1[^>]*>[\s\S]*?<\/h1\s*>/i);
  const title = m ? '<div class="titlebar">' + m[0].trim() + '</div>' : '';
  const body = m ? html.slice(m[0].length) : html;
  section.innerHTML = title + '<div class="inner">' + body + '</div>';
  return section;
}

// 真实幻灯片数据：渲染时由 Jinja2 注入；直接打开模板/无输入时解析失败 → 用 DEMO
let slides = [];
try {
  const data = JSON.parse(document.getElementById('slides-data').textContent);
  if (Array.isArray(data) && data.length) {
    slides = data.map((html, i) => makeSlide(html, i));
    slides.forEach(s => document.body.insertBefore(s, document.getElementById('pager')));
  }
} catch (e) { /* 忽略：走 DEMO */ }

if (slides.length === 0) {
  DEMO_SLIDES.forEach((html, i) => {
    document.body.insertBefore(makeSlide(html, i), document.getElementById('pager'));
  });
  slides = Array.from(document.querySelectorAll('.slide'));
}

let i = 0;
const cur = document.getElementById('cur');
const total = document.getElementById('total');

total.textContent = slides.length;

// 初始高亮/排版当前页
if (window.hljs) slides[0].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
fitSlides();
if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);

function show(n) {
  const target = Math.max(0, Math.min(n, slides.length - 1));
  if (target === i) return;                       // 越界翻页：不动
  const dir = target > i ? 1 : -1;                // 前进从右推入，后退从左推入
  const old = slides[i];
  slides.forEach(s => s.classList.remove('leaving', 'no-anim'));
  old.style.setProperty('--dir', dir);
  old.classList.remove('active');
  old.classList.add('leaving');                   // 旧页保持在下层，动画结束再隐藏
  old.addEventListener('animationend', () => old.classList.remove('leaving'), { once: true });
  i = target;
  slides[i].style.setProperty('--dir', dir);
  slides[i].classList.add('active');
  cur.textContent = i + 1;
  total.textContent = slides.length;
  window.scrollTo(0, 0);
  if (window.hljs) slides[i].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  fitSlides();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);
}

// 标题保留独立字号；正文按扣除标题、padding 后的真实空间等比缩小。
function fitSlides() {
  slides.forEach(s => {
    if (!s.classList.contains('active')) return; // 隐藏页没有可测量的尺寸
    const inner = s.querySelector('.inner');
    const title = s.querySelector('.titlebar');
    const css = getComputedStyle(s);
    const width = s.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
    const bottom = s.clientHeight - parseFloat(css.paddingBottom);
    // 极窄/极矮窗口或长标题：标题最多占用屏幕 30%，给正文留出空间。
    if (title) {
      title.style.fontSize = '';
      const base = parseFloat(css.fontSize);
      let lo = 0, hi = base;
      for (let n = 0; n < 16; n++) {
        const size = (lo + hi) / 2;
        title.style.fontSize = `${size}px`;
        if (title.offsetHeight <= s.clientHeight * .3 && title.scrollWidth <= title.clientWidth) lo = size;
        else hi = size;
      }
      title.style.fontSize = `${lo}px`;
    }
    inner.style.transform = 'none';
    const height = Math.max(1, bottom - inner.offsetTop);
    const images = inner.querySelectorAll('img');
    inner.style.setProperty('--image-height', `${height / Math.max(1, images.length)}px`);
    const scale = Math.min(1,
      Math.max(1, width - 1) / Math.max(1, inner.scrollWidth),
      Math.max(1, height - 1) / Math.max(1, inner.scrollHeight, inner.offsetHeight));
    inner.style.transform = `scale(${scale})`;
  });
}
// 合并异步排版事件；transform 不改变布局尺寸，不会触发观察器循环。
let fitFrame;
function scheduleFit() {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitSlides);
}
slides.forEach(s => {
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleFit);
    observer.observe(s.querySelector('.inner'));
    const title = s.querySelector('.titlebar');
    if (title) observer.observe(title);
  }
  s.addEventListener('load', scheduleFit, true);
  s.addEventListener('error', scheduleFit, true);
});
window.addEventListener('resize', scheduleFit);
window.addEventListener('load', scheduleFit);
if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone', scheduleFit);
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ': case 'ArrowRight': case 'ArrowDown': case 'j': case 'l': case 'Enter': case 'PageDown':
      e.preventDefault(); show(i + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'h': case 'k': case 'Backspace': case 'PageUp':
      e.preventDefault(); show(i - 1); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(slides.length - 1); break;
    case 'f':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
    case 'q':
      window.close();
      break;
  }
});
</script>
</body>
</html>
