<style>
  :root {
    --bg: #ffffff; --fg: #111111;
    --muted: #555555; --border: #999999;
    --blue: #1e3a8a; --cyan: #0e7490; --green: #15803d;
    --purple: #6d28d9; --red: #b91c1c; --orange: #c2410c; --yellow: #a16207;
    --code-bg: #fafbfc; --quote-bg: #f7f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;                   /* 满屏，无外框 */
    display: none;
    padding: 3vh 4vw;
    overflow: hidden;
    font-size: clamp(20px, 3.25vh, 35px);
    line-height: 1.7;
  }
  .slide .inner {
    position: relative; z-index: 1;   /* 盖在顶部光斑 ::before 之上 */
    display: flow-root;         /* 包含首尾 margin 和浮动，保证测量完整 */
    width: 100%;
    overflow-wrap: anywhere;
    transform-origin: top left;
  }
  /* 翻页过渡：新页沿翻页方向推入、旧页同速推出（--dir 由 JS 按方向设置）。
     两页首尾相接一起移动，任何时刻都铺满屏幕，不会露出白底闪烁。 */
  .slide.active { display: block; z-index: 2; animation: pagein .28s cubic-bezier(.22, .61, .36, 1); }
  .slide.leaving { display: block; z-index: 1; animation: pageout .28s cubic-bezier(.22, .61, .36, 1); }
  @keyframes pagein  { from { transform: translateX(calc(100% * var(--dir, 1))); } }
  /* 旧页少退出 4px：被新页压在下面，盖住两页接缝处的亚像素圆整白线 */
  @keyframes pageout { to   { transform: translateX(calc(var(--dir, 1) * (4px - 100%))); } }
  .slide.no-anim { animation: none; }  /* 初始首页直接显示（须置于上方两条规则之后） */
  /* 标题条：JS 把每页开头的 <h1> 提到 .inner 之外 → 不参与整页等比缩放，
     负 margin 抵消 slide 的 padding，左右/上方始终顶格；无圆角。
     深色毛玻璃：模糊的是 ::before 生成的顶部彩色光斑。 */
  .slide .titlebar {
    position: relative; z-index: 2;
    margin: -3vh -4vw .8em;      /* slide padding 为 3vh 4vw */
    padding: .3em 4vw;           /* 与正文（h2/p/li）左线对齐 */
    background: rgba(59, 7, 100, .72);    /* purple-950 玻璃 */
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    border-bottom: 1px solid rgba(255, 255, 255, .25);
  }
  .slide .titlebar h1 {
    font-size: 1.55em; color: #fff;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .35);
  }
  .slide .titlebar h1 :is(b, strong) { color: #fca5a5; }  /* 深色条上红色加粗提亮 */
  .slide .inner h1 { font-size: 1.55em; margin: 0 0 .6em; border-bottom: 2px solid #8fa3c8; padding-bottom: .3em; }  /* 非页首 h1 兜底 */
  /* 顶部静态彩色光斑：给毛玻璃提供可被模糊的背景（无动画），正文区仍为白底 */
  .slide::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 5em;
    z-index: 0;
    background:
      radial-gradient(30em 10em at 12% -30%, rgba(59, 130, 246, .5), transparent 60%),
      radial-gradient(26em 9em at 58% -50%, rgba(139, 92, 246, .42), transparent 60%),
      radial-gradient(30em 10em at 94% -25%, rgba(6, 182, 212, .4), transparent 60%);
    pointer-events: none;
  }
  .slide h2 { font-size: 1.25em; color: var(--fg); margin: 1em 0 .5em; }
  .slide h3 { font-size: 1.2em; color: var(--muted); margin: 1em 0 .4em; }
  .slide p { margin: .5em 0; }
  .slide :is(b, strong), .slide :is(h1, h2, h3) :is(b, strong) { color: var(--red); }
  .slide ul, .slide ol { padding-left: 1.6em; margin: .5em 0; }
  .slide li { margin: .25em 0; }
  .slide blockquote {
    border-left: 3px solid var(--border); padding: .3em 1.2em; margin: .8em 0;
    color: var(--muted); background: var(--quote-bg);
  }
  .slide blockquote::before {
    content: "\201C";
    float: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.8em;
    line-height: .9;
    margin: .05em .25em 0 0;
    color: #bdbdbd;
    user-select: none;
  }
  .slide code {
    font-size: .9em;
    font-family: "LXGW WenKai Mono", "霞鹜文楷等宽", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .slide pre {
    background: var(--code-bg); border: 1px solid #e5e7eb; border-radius: 8px;
    padding: .4em .6em; margin: .8em 0; overflow: visible;
  }
  .slide pre code { background: none; padding: 0; color: var(--fg); }
  .slide pre code.hljs { overflow: visible; }
  .slide a { color: var(--muted); }
  .slide a.badlink {
    color: var(--red); text-decoration: line-through;
    cursor: not-allowed;
  }
  .slide img.badlink {
    border: 2px dashed var(--red); border-radius: 6px;
    min-width: 8em; min-height: 4em;
    background: repeating-linear-gradient(45deg, #fff, #fff 8px, #fde8e8 8px, #fde8e8 16px);
  }
  .slide .badge {
    display: inline-block;
    font-size: .6em; font-weight: 700;
    color: #fff; background: var(--red);
    border-radius: 3px; padding: .1em .4em;
    vertical-align: .2em;
    text-decoration: none;
  }
  .slide hr { border: none; border-top: 2px solid var(--border); margin: 1.2em 0; }
  .slide img {
    display: block;
    max-width: 90%;
    margin: .8em auto;
    border-radius: 8px;
  }
  /* 图片先限制到正文可用高度，再与其余正文一起参与缩放。支持多图。 */
  .slide .inner img {
    max-height: var(--image-height, 60vh);
    object-fit: contain;
  }
  #pager {
    position: fixed; right: 2.5vw; bottom: 2.5vh;
    font-size: 14px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  /* AI 补充内容（行内 span）：inline-block 让 padding 上下左右都实际占位生效 */
  .slide span.aigc {
    display: inline-block;
    border: 1px dashed #ddccf0;      /* 极淡紫，几乎隐形的虚线 */
    border-radius: 4px;
    padding-left: 0.45em;
    background: #fff;
    color: rgba(76, 29, 149, .75);   /* purple-900，25% 透明 */
  }
  .slide .aigc::before {
    content: "";
    display: inline-block;
    width: .95em; height: .95em;
    margin-right: .2em;
    vertical-align: -.1em;
    background-color: #6b21a8;
    clip-path: polygon(50% 4%, 62% 36%, 96% 50%, 62% 64%, 50% 96%, 36% 64%, 4% 50%, 36% 36%);
  }
  .slide .aigc a { color: rgba(76, 29, 149, .75); }
</style>

003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4fdd\u5b58\u7684\u662f\u51b2\u7a81\u7684\u903b\u8f91\u8868\u793a\uff1b\u5e26\u7740\u51b2\u7a81\u7684 commit \u4ecd\u80fd\u7ee7\u7eed rebase\u3001merge\u3002\u003ca href=\"https://www.jj-vcs.dev/latest/conflicts/\"\u003e\u51b2\u7a81\u7ba1\u7406\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8bbe\u8ba1\u542f\u53d1\uff1a\u628a\u201c\u5c1a\u672a\u89e3\u51b3\u201d\u8868\u8fbe\u6210\u4e00\u79cd\u53ef\u4fdd\u5b58\u3001\u53ef\u7ee7\u7eed\u64cd\u4f5c\u7684\u72b6\u6001\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u8fd9\u5c31\u662f\u4e3a\u4ec0\u4e48 AI Native \u80fd\u6dd8\u6c70\u8001\u767b\u003c/h1\u003e\n\u003ch2\u003e\u5df2\u7ecf\u5f62\u6210\u7684\u808c\u8089\u8bb0\u5fc6\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6211\u5df2\u7ecf\u5f62\u6210 Git \u7684\u808c\u8089\u8bb0\u5fc6\u4e86\u3002\u003c/li\u003e\n\u003cli\u003e\u5373\u4fbf\u80fd\u7406\u89e3\uff0c\u4e5f\u6ca1\u6709\u8db3\u591f\u7684\u65f6\u95f4\u8bad\u7ec3\u53e6\u4e00\u4e2a\u808c\u8089\u8bb0\u5fc6\u3002\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u719f\u6089\u7684\u89e3\u6cd5\u4f1a\u9501\u4f4f\u6ce8\u610f\u529b\uff1a\u68cb\u624b\u8bf4\u5728\u5bfb\u627e\u66f4\u4f18\u89e3\uff0c\u76ee\u5149\u5374\u4ecd\u56f4\u7ed5\u65e7\u5957\u8def\u3002\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/18565505/\"\u003eEinstellung effect\uff0c2008 \u5e74\u773c\u52a8\u5b9e\u9a8c\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u540c\u5b66\u4eec\u7684\u5b66\u4e60\u65b9\u5411\u662f\u53cd\u8fc7\u6765\u7684\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u5148\u7406\u89e3\u6b63\u786e\u7684\u8bbe\u8ba1\uff0c\u518d\u56de\u671b\u5386\u53f2\u003c/strong\u003e\u3002\u003cul\u003e\n\u003cli\u003e\u7406\u89e3\u6211\u4eec\u662f\u5982\u4f55\u4e00\u8def\u8d70\u6765 (\u66f4\u9ad8\u6548)\u3002\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eAgent \u65f6\u4ee3\uff0c\u518d\u6b21\u91cd\u65b0\u8bbe\u8ba1\u7248\u672c\u7ba1\u7406\u7cfb\u7edf\u003c/h1\u003e\n\u003ch2\u003e\u4eba\u7c7b\u662f \u201cSingle-Threaded\u201d \u751f\u7269\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6211\u4eec\u53ea\u6709\u003cstrong\u003e\u4e00\u4efd\u003c/strong\u003e I/O \u8bbe\u5907\uff1a\u4e00\u53cc\u624b\u3001\u4e00\u5f20\u5634\u3001\u4e00\u5bf9\u773c\u775b\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eGit \u57fa\u672c\u591f\u4e00\u4e2a\u4eba\u7528\u4e86\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003estash\uff1a\u003cspan class=\"aigc\"\u003e\u628a\u624b\u5934\u7684\u5de5\u4f5c\u653e\u4e00\u8fb9\uff0c\u5148\u5904\u7406\u53e6\u4e00\u4ef6\u4e8b\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003ebranch\uff1a\u003cspan class=\"aigc\"\u003e\u4fdd\u7559\u4e0d\u540c\u65b9\u5411\u7684\u5c1d\u8bd5\uff0c\u5207\u6362\u7740\u63a8\u8fdb\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eJujutsu \u5c31\u66f4\u597d\u7528\u4e86\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4f46\u5982\u679c\u662f Agent Team (Swarm) \u5462\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u5355\u4e2a Agent \u5feb\uff0cAgent \u8fd8\u53ef\u4ee5\u5e76\u884c \ud83d\ude02\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5355\u4e2a Agent \u5de5\u4f5c\u7684\u901f\u5ea6\u5c31\u663e\u8457\u6bd4\u4eba\u66f4\u5feb\uff1a\u5206\u949f\u7ea7\u4ea7\u751f\u4e00\u4e2a\u539f\u5b50\u63d0\u4ea4\u003c/li\u003e\n\u003cli\u003eAgent \u8fd8\u53ef\u4ee5\u5e76\u884c\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eGit \u201c\u4e3a\u4eba\u8bbe\u8ba1\u201d \u7684\u6a21\u578b\u8ddf\u4e0d\u4e0a\u8fd9\u4e2a\u901f\u5ea6\u4e86\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e00\u4e2a\u5de5\u4f5c\u76ee\u5f55\u91cc\uff0cA \u6b63\u5728\u4fee\u6539\uff0cB \u5c31\u53ef\u80fd\u8bfb\u5230\u4e00\u534a\u7684\u7ed3\u679c\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u73b0\u5728\u9700\u8981\u4e00\u8d77\u52a0\u901f\u7684\uff0c\u8fd8\u6709\u534f\u8c03\u3001\u9a8c\u8bc1\u4e0e\u6574\u5408\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u628a\u6bcf\u4e2a Agent \u5f53\u6210\u72ec\u7acb\u5f00\u53d1\u8005\u003c/h1\u003e\n\u003ch2\u003e\u6bcf\u4e2a Agent \u6709\u81ea\u5df1\u7684\u5f00\u53d1\u8ba1\u7b97\u673a\uff0c\u7528 Remote \u540c\u6b65\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u8fd9\u4e2a\u6d41\u7a0b\u80fd\u4e0d\u80fd\u653e\u5230\u672c\u5730\uff1f\u003c/li\u003e\n\u003cli\u003eYes! \u6211\u4eec\u6709\u4e86 \u003ca href=\"https://git-scm.com/docs/git-worktree\"\u003egit worktree\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4e00\u4e2a\u4ed3\u5e93\uff0c\u591a\u4e2a\u5de5\u4f5c\u76ee\u5f55\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6bcf\u4e2a worktree \u6709\u81ea\u5df1\u7684\u5de5\u4f5c\u6587\u4ef6\u3001HEAD \u548c index (\u6682\u5b58\u533a)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5171\u4eab\u5bf9\u8c61\u5e93\u548c\u5206\u652f\u5f15\u7528\uff1a\u63d0\u4ea4\u5728\u672c\u5730\u76f4\u63a5\u53ef\u89c1\uff0c\u65e0\u9700\u4e92\u76f8 push/pull\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ed9 Agent A \u521b\u5efa\u5206\u652f\u548c\u5de5\u4f5c\u76ee\u5f55\uff1a\u003ccode\u003egit worktree add -b agent-a ../gense-agent-a\u003c/code\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ed9 Agent B \u521b\u5efa\u5206\u652f\u548c\u5de5\u4f5c\u76ee\u5f55\uff1a\u003ccode\u003egit worktree add -b agent-b ../gense-agent-b\u003c/code\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5404\u81ea\u5728\u81ea\u5df1\u7684\u76ee\u5f55\u5e72\u6d3b\uff1b\u4fee\u6539\u4ecd\u9700 merge/rebase \u624d\u4f1a\u6c47\u5408\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u56de\u5230\u4e3a\u4ec0\u4e48\u9700\u8981\u7248\u672c\u63a7\u5236\u003c/h1\u003e\n\u003ch2\u003e\u4eba\u7684\u9650\u5236\uff0c\u5851\u9020\u4e86\u5de5\u5177\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4eba\u7684\u751f\u4ea7\u6548\u7387\u6709\u9650\u003c/li\u003e\n\u003cli\u003e\u4eba\u4e4b\u95f4\u6709 communication gap\uff1a\u5b9e\u9645\u4e0a\u6c9f\u901a\u6548\u7387\u6781\u4f4e\u003c/li\u003e\n\u003cli\u003e\u4eba\u5c31\u7b97\u6c9f\u901a\u4e86\uff0c\u4e5f\u53ef\u80fd\u5404\u79cd\u51fa\u9519\u003cul\u003e\n\u003cli\u003e\u5feb\u7167\u3001\u5c0f\u6b65\u524d\u8fdb\uff1abisect\u3001blame\u2026\u2026\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5982\u679c\u6ca1\u6709 Agent \u80fd\u88ab\u5f00\u9664\u3001\u80fd\u5750\u7262\uff1f\u003c/h2\u003e\n\u003cp\u003e\u6211\u4eec\u003cstrong\u003e\u518d\u4e5f\u4e0d\u8981 blame\u003c/strong\u003e\uff0c\u53ea\u8981\u628a\u95ee\u9898\u9ed8\u9ed8\u4fee\u4e86\u5c31\u597d\uff1f\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5386\u53f2\u7684\u4ef7\u503c\u53ef\u4ee5\u4ece\u201c\u8c01\u5199\u9519\u4e86\u201d\u8f6c\u5411\u201c\u54ea\u6b21\u53d8\u5316\u7834\u574f\u4e86\u4ec0\u4e48\uff0c\u600e\u6837\u6062\u590d\u201d\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8de8\u9886\u57df\u5148\u4f8b\uff1a\u003ca href=\"https://asrs.arc.nasa.gov/publications/callback/cb_555.html\"\u003eNASA \u822a\u7a7a\u5b89\u5168\u62a5\u544a\u7cfb\u7edf\u003c/a\u003e\u901a\u8fc7\u81ea\u613f\u3001\u4fdd\u5bc6\u3001\u975e\u60e9\u7f5a\u6027\u7684\u62a5\u544a\u6536\u96c6\u5b89\u5168\u9690\u60a3\uff0c\u5e2e\u52a9\u9632\u6b62\u91cd\u6f14\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4e3b Agent \u89c4\u5212\uff0c\u5b50 Agent \u4e0a\u9501\u5f00\u5e72\u003c/h1\u003e\n\u003ch2\u003eAgent \u53ea\u5e72\u4e00\u4ef6\u4e8b\uff1a\u63a8\u8fdb\u4e00\u4ef6\u4e8b\uff0c\u628a\u5c41\u80a1\u90fd\u64e6\u5e72\u51c0\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4e3b Agent \u8d1f\u8d23\u89c4\u5212\u003c/li\u003e\n\u003cli\u003e\u5b50 Agent \u8d1f\u8d23\u4e0a\u9501\u5f00\u5e72\u003cul\u003e\n\u003cli\u003eAgents \u5b8c\u5168\u53ef\u4ee5\u76f4\u63a5\u4e0a\u4e92\u65a5\u9501\uff0c\u628a\u6d3b\u5e72\u4e86\uff0c\u89e3\u9501\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u628a\u534f\u8c03\u653e\u5230\u4ec0\u4e48\u65f6\u5019\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGit/Jujutsu \u50cf\u662f\u201c\u4e8b\u540e\u201d\u7684 Multi-Version Concurrency Control\uff1a\u51b2\u7a81\u68c0\u6d4b\uff0c\u7c7b\u4f3c\u6570\u636e\u5e93\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e92\u65a5\u9501\uff1a\u4fee\u6539\u524d\u5148\u7ea6\u5b9a\u8c01\u80fd\u8bbf\u95ee\u8fd9\u4efd\u5171\u4eab\u72b6\u6001\uff0c\u628a\u51b2\u7a81\u53d8\u6210\u7b49\u5f85\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5b66\u300a\u64cd\u4f5c\u7cfb\u7edf\u300b\u3001\u300a\u6570\u636e\u5e93\u300b\u6709\u7528\u4e86\u5427\u003c/h1\u003e\n\u003ch2\u003e\u201c\u628a\u6d3b\u5e72\u5b8c\u201d\uff0c\u8fb9\u754c\u5728\u54ea\u91cc\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u9501\u4fdd\u62a4\u7684\u662f\u4e00\u4ef6\u4e8b\u4f9d\u8d56\u7684\u5171\u4eab\u72b6\u6001\uff1b\u53ea\u9501\u6b63\u5728\u5199\u7684\u6587\u4ef6\uff0c\u53ef\u80fd\u6f0f\u6389\u522b\u4eba\u6b63\u5728\u6539\u7684\u63a5\u53e3\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ea6\u5b9a\uff1a\u4e0a\u9501 \u2192 \u8bfb\u53d6\u6700\u65b0\u72b6\u6001 \u2192 \u4fee\u6539 \u2192 \u9a8c\u8bc1\u5e76\u7559\u4e0b\u53ef\u6062\u590d\u7684\u5feb\u7167 \u2192 \u89e3\u9501\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u548c\u6570\u636e\u5e93\u7684 \u003ca href=\"https://www.postgresql.org/docs/17/explicit-locking.html#ADVISORY-LOCKS\"\u003eadvisory locks\u003c/a\u003e \u4e00\u6837\uff0c\u53c2\u4e0e\u8bbf\u95ee\u7684 Agent \u90fd\u8981\u9075\u5b88\u534f\u8bae\uff1b\u9501\u4e0d\u4f1a\u81ea\u52a8\u8ba9\u9519\u8bef\u7684\u4fee\u6539\u53d8\u6b63\u786e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u91cd\u65b0\u601d\u8003 Fundamental \u7684\u95ee\u9898\u003c/h2\u003e\n\u003cp\u003e\u8fd9\u5c31\u662f\u4e3a\u4ec0\u4e48\u6211\u559c\u6b22\u4e0a\u8bfe\u2014\u2014\u5b83\u4f1a\u5f3a\u8feb\u6211\u628a\u5f88\u591a fundamental \u7684\u95ee\u9898\u60f3\u5f97\u66f4\u6e05\u695a\u003c/p\u003e", "\u003ch1\u003e\u56e2\u961f\u534f\u4f5c\u003c/h1\u003e\n\u003ch2\u003e\u7248\u672c\u63a7\u5236\u53ea\u662f\u5de5\u5177\u003c/h2\u003e\n\u003cp\u003e\u771f\u6b63\u7684\u56f0\u96be\u8fd8\u662f\u5728\u003cstrong\u003e\u8fdb\u5ea6 (\u56e2\u961f) \u7ba1\u7406\u003c/strong\u003e\u3002\u003c/p\u003e\n\u003ch2\u003eAI \u662f\u4e00\u6761\u201c\u65a9\u6740\u7ebf\u201d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5982\u679c\u4e00\u53e5\u8bdd\u5c31\u80fd\u76f4\u51fa\u9ad8\u8d28\u91cf\u4ea7\u54c1\uff0c\u8f6f\u4ef6\u5de5\u7a0b\u5c31\u76f4\u63a5\u003cstrong\u003e\u6b7b\u4e86\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eMoore\u0027s Law (\u4e5f\u662f\u4e00\u79cd Scaling Law) \u8fd8\u6210\u7acb\uff0c\u6a21\u578b\u5c31\u6709\u673a\u4f1a\u66f4\u5f3a\u3001\u66f4\u5c0f\u3001\u66f4\u5feb\u003c/li\u003e\n\u003cli\u003e\u5982\u679c\u4e00\u4e2a\u5c97\u4f4d 100% \u7684\u5de5\u4f5c\u90fd\u80fd\u88ab AI \u66ff\u4ee3\uff0c\u8fd9\u4e2a\u4eba\u5728\u8fd9\u4e2a\u5c97\u4f4d\u4e0a\u7684\u4ef7\u503c\u5728\u54ea\u91cc\uff1f\u003cul\u003e\n\u003cli\u003e\u4ece\u67d0\u79cd\u610f\u4e49\u4e0a\uff0c\u88ab\u65a9\u6740\u7684\u6570\u5b66\u5de5\u4f5c\u8005\u66f4\u60e8 \ud83d\ude02\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u56e2\u961f\u7684\u590d\u6742\u6027\u003c/h1\u003e\n\u003ch2\u003e\u4eba\u6570\u589e\u52a0\uff0c\u6c9f\u901a\u5173\u7cfb\u5e73\u65b9\u7ea7\u4e0a\u5347\u003c/h2\u003e\n\u003cp\u003e\u5927\u5bb6\u90fd\u6709\u4f53\u9a8c\uff1a\u660e\u660e\u81ea\u5df1\u975e\u5e38\u660e\u767d\uff0c\u4f46\u5f88\u96be\u8bf4\u670d\u522b\u4eba\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e$n$ \u4e2a\u4eba\uff0c\u4e24\u4e24\u4e4b\u95f4\u5c31\u6709 $\\frac{n(n- \u63a2\u7d22\uff0c\u5e76\u6700\u7ec8\u5408\u5e76\u3002\u003c/p\u003e", "\u003ch1\u003e\u518d\u6b21\u56de\u5230 Pico Playground\u003c/h1\u003e\n\u003ch2\u003e\u5c0f\u5b66\u751f\u7684 Tower of Hanoi\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u8003\u4e86\u4e2a\u4e0d\u5bb9\u6613\u7684\u9898\u76ee\uff0c\u4e00\u7247\u54c0\u568e\u003c/li\u003e\n\u003cli\u003e\u5982\u679c\u4e3a\u4e86\u6323 \u00a5\u00a5\u00a5\uff0c\u6211\u4eec\u5f53\u7136\u5e94\u8be5\u63d0\u4f9b\u003cstrong\u003e\u589e\u503c\u670d\u52a1\u003c/strong\u003e\u003cul\u003e\n\u003cli\u003e\u5728\u670d\u52a1\u5668\u7aef\u4fdd\u5b58\u5c0f\u670b\u53cb\u7684\u505a\u9898\u8bb0\u5f55\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eGPT\uff1a\u6570\u636e\u5e93\u542f\u52a8\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u4e00\u4e2a API \u5e94\u7528\u3001\u4e00\u4e2a\u5173\u7cfb\u6570\u636e\u5e93\u3001\u4e00\u4e2a\u5bf9\u8c61\u5b58\u50a8\uff1b\u9700\u8981\u5f02\u6b65\u70b9\u8bc4\u65f6\u518d\u52a0\u540e\u53f0\u4efb\u52a1\u8fdb\u7a0b\u3002\u6570\u636e\u5e93\u5b58\u5173\u7cfb\u548c\u8bb0\u5f55\uff0c\u5927\u8bfe\u7a0b\u5305\u4e0e\u5b8c\u6574\u8f68\u8ff9\u653e\u5bf9\u8c61\u5b58\u50a8\u3002\u4efb\u52a1\u91cf\u5c0f\u65f6\uff0c\u6570\u636e\u5e93\u4efb\u52a1\u8868\u5c31\u591f\u7528\u3002\u003c/p\u003e\n\u003c/blockquote\u003e", "\u003ch1\u003e\u4f46 Git \u4e0d\u521a\u597d\u9002\u5408\u8fd9\u4e2a\u5417\uff1f\u003c/h1\u003e\n\u003ch2\u003eGPT \u4e5f\u6ca1\u60f3\u5230\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u6811\u72b6\u7684\u7248\u672c\u5386\u53f2\u003c/strong\u003e\uff1a\u003cspan class=\"aigc\"\u003e\u505a\u5230\u54ea\u4e00\u6b65\u3001\u4ece\u54ea\u91cc\u91cd\u8bd5\uff0c\u90fd\u53ef\u4ee5\u7559\u4e0b\u6765\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u514d\u8d39\u7684 Diff \u529f\u80fd\u003c/strong\u003e\uff1a\u003cspan class=\"aigc\"\u003e\u524d\u540e\u4e24\u6b21\u63d0\u4ea4\uff0c\u5230\u5e95\u6539\u4e86\u4ec0\u4e48\uff1f\u003c/span\u003e\u003 inimum Viable Product\uff1a\u7528\u4e00\u4e2a\u6700\u5c0f\u7684\u7248\u672c\u9a8c\u8bc1\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThe biggest risk in product development is building something nobody wants.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003eMVP \u4f1a\u7ed9\u4f60\u4e00\u4e2a\u003cstrong\u003e\u7acb\u5373\u80fd\u4f7f\u7528\u3001\u4e0d\u5b8c\u5907\u003c/strong\u003e\u7684\u7248\u672c\u003c/li\u003e\n\u003cli\u003e\u5e2e\u52a9\u4f60\u8003\u8651\u672a\u6765\u6f5c\u5728\u7684\u53d8\u5316\u3001\u8bc4\u4f30\u8f6f\u4ef6\u7684\u8bbe\u8ba1\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5148\u9a8c\u8bc1\u4ec0\u4e48\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5148\u9009\u4e00\u4e2a\u6700\u503c\u5f97\u9a8c\u8bc1\u7684\u5047\u8bbe\uff0c\u518d\u505a\u80fd\u9a8c\u8bc1\u5b83\u7684\u6700\u5c0f\u7248\u672c\u3002(\u003ca href=\"https://leanstartup.co/resources/articles/what-is-an-mvp/\"\u003eEric Ries\uff1aMVP\u003c/a\u003e)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u65e9\u671f\u7684 Prompt\uff0c\u5f71\u54cd\u6700\u5927\u003c/h1\u003e\n\u003ch2\u003e\u6bcf\u4e00\u6b21\u201c\u786e\u5b9a\u201d\uff0c\u90fd\u5728\u5f71\u54cd\u9879\u76ee\u7684\u8d70\u5411\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u65e9\u671f\u7684 prompt \u5bf9\u9879\u76ee\u7684\u8d70\u5411\u5f71\u54cd\u003cstrong\u003e\u6700\u5927\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u4efb\u4f55 \u201c\u786e\u5b9a\u201d \u7684\u8bbe\u8ba1 \u2192 \u6f5c\u5728\u7684 technical debt\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u7559\u4e0b\u5386\u53f2\uff0c\u8ba9\u53ef\u7528\u7248\u672c\u53cd\u8fc7\u6765\u5e2e\u52a9\u8bbe\u8ba1\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u81ea\u52a8\u63d0\u4ea4 \u0026amp; push \u2192 \u53ef\u7559\u75d5\u7684\u5386\u53f2\u003c/li\u003e\n\u003cli\u003e\u53ef\u7528\u7684\u7248\u672c\u8fd8\u53ef\u4ee5\u5e2e\u52a9\u4f60\u003cstrong\u003e\u91cd\u65b0\u6574\u7406\u67b6\u6784\u8bbe\u8ba1\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e"]</script>
<div id="pager"><span id="cur">1</span> / <span id="total">–</span></div>
<script>
// 无输入（或直接打开模板）时的演示内容，方便在浏览器里调试样式
// 两页：第 1 页内容少（不缩放），第 2 页内容多（测整页等比缩放）
const DEMO_SLIDES = [
  String.raw`<h1>演示幻灯片</h1>
   <h2>内容元素</h2>
   <p>这是 <code>slides.html</code> 模板的<strong>演示内容</strong>（无输入时的 fallback）。</p>
   <ul>
     <li>按 <b>Space/→/j/l</b> 翻页，<b>←/h/k</b> 后退，<b>Home/End</b> 首末页</li>
     <li><b>f</b> 全屏，<b>q</b> 关闭窗口</li>
   </ul>
   <h2>内容元素</h2>
   <blockquote>引用：AI 时代，四年学习的价值到底是什么？</blockquote>
   <p>正文 <a href="#">链接</a>；行内 <code>code</code> 与 <span class="aigc">AI 行内补充（<a href="#">链接</a>）</span>。</p>`,
  String.raw`<h1>长内容测试 · 自动缩放</h1>
   <h2>代码块与公式</h2>
   <pre><code class="language-python">def hello():
    print("Hello, slides!")
</code></pre>
   <p>行内公式 $x^2 + y^2 = z^2$ 与块级公式：</p>
   <p>$$\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}$$</p>
   <h2>要点列表</h2>
   <ul>
     <li>内容较多时整页等比缩小，不滚动、不裁剪</li>
     <li>窗口变小自动重新适配（resize 监听）</li>
     <li>图片 / MathJax 异步加载后也会重新适配</li>
     <li>这一页足够长，在任何分辨率下都能看出缩放效果</li>
     <li>缩放只缩不放，内容少时保持原始大小</li>
     <li>要点：Lorem ipsum dolor sit amet, consectetur adipiscing elit.</li>
     <li>要点：Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</li>
     <li>要点：Ut enim ad minim veniam, quis nostrud exercitation ullamco.</li>
     <li>要点：Duis aute irure dolor in reprehenderit in voluptate velit esse.</li>
     <li>要点：Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia.</li>
     <li>要点：Deserunt mollit anim id est laborum, sed quia consequuntur magni dolores.</li>
     <li>要点：Eos qui ratione voluptatem sequi nesciunt, neque porro quisquam est.</li>
     <li>要点：Qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit.</li>
     <li>要点：Sed quia non numquam eius modi tempora incidunt ut labore et dolore.</li>
     <li>要点：Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis.</li>
     <li>要点：Suscipit laboriosam nisi ut aliquid ex ea commodi consequatur quis autem.</li>
     <li>要点：Vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis.</li>
     <li>要点：Praesentium voluptatum deleniti atque corrupti quos dolores et quas.</li>
   </ul>`,
];

// 组装单页：开头的 <h1> 提为 .titlebar（放在 .inner 之外），
// 使标题条不参与整页缩放、左右始终顶格；其余内容进 .inner 等比缩放。
function makeSlide(html, i) {
  const section = document.createElement('section');
  // 首页带 no-anim：刷新时直接显示、不播入场动画；首次翻页即移除，此后正常过渡
  section.className = 'slide' + (i === 0 ? ' active no-anim' : '');
  const m = html.match(/^\s*<h1[^>]*>[\s\S]*?<\/h1\s*>/i);
  const title = m ? '<div class="titlebar">' + m[0].trim() + '</div>' : '';
  const body = m ? html.slice(m[0].length) : html;
  section.innerHTML = title + '<div class="inner">' + body + '</div>';
  return section;
}

// 真实幻灯片数据：渲染时由 Jinja2 注入；直接打开模板/无输入时解析失败 → 用 DEMO
let slides = [];
try {
  const data = JSON.parse(document.getElementById('slides-data').textContent);
  if (Array.isArray(data) && data.length) {
    slides = data.map((html, i) => makeSlide(html, i));
    slides.forEach(s => document.body.insertBefore(s, document.getElementById('pager')));
  }
} catch (e) { /* 忽略：走 DEMO */ }

if (slides.length === 0) {
  DEMO_SLIDES.forEach((html, i) => {
    document.body.insertBefore(makeSlide(html, i), document.getElementById('pager'));
  });
  slides = Array.from(document.querySelectorAll('.slide'));
}

let i = 0;
const cur = document.getElementById('cur');
const total = document.getElementById('total');

total.textContent = slides.length;

// 初始高亮/排版当前页
if (window.hljs) slides[0].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
fitSlides();
if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);

function show(n) {
  const target = Math.max(0, Math.min(n, slides.length - 1));
  if (target === i) return;                       // 越界翻页：不动
  const dir = target > i ? 1 : -1;                // 前进从右推入，后退从左推入
  const old = slides[i];
  slides.forEach(s => s.classList.remove('leaving', 'no-anim'));
  old.style.setProperty('--dir', dir);
  old.classList.remove('active');
  old.classList.add('leaving');                   // 旧页保持在下层，动画结束再隐藏
  old.addEventListener('animationend', () => old.classList.remove('leaving'), { once: true });
  i = target;
  slides[i].style.setProperty('--dir', dir);
  slides[i].classList.add('active');
  cur.textContent = i + 1;
  total.textContent = slides.length;
  window.scrollTo(0, 0);
  if (window.hljs) slides[i].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  fitSlides();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);
}

// 标题保留独立字号；正文按扣除标题、padding 后的真实空间等比缩小。
function fitSlides() {
  slides.forEach(s => {
    if (!s.classList.contains('active')) return; // 隐藏页没有可测量的尺寸
    const inner = s.querySelector('.inner');
    const title = s.querySelector('.titlebar');
    const css = getComputedStyle(s);
    const width = s.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
    const bottom = s.clientHeight - parseFloat(css.paddingBottom);
    // 极窄/极矮窗口或长标题：标题最多占用屏幕 30%，给正文留出空间。
    if (title) {
      title.style.fontSize = '';
      const base = parseFloat(css.fontSize);
      let lo = 0, hi = base;
      for (let n = 0; n < 16; n++) {
        const size = (lo + hi) / 2;
        title.style.fontSize = `${size}px`;
        if (title.offsetHeight <= s.clientHeight * .3 && title.scrollWidth <= title.clientWidth) lo = size;
        else hi = size;
      }
      title.style.fontSize = `${lo}px`;
    }
    inner.style.transform = 'none';
    const height = Math.max(1, bottom - inner.offsetTop);
    const images = inner.querySelectorAll('img');
    inner.style.setProperty('--image-height', `${height / Math.max(1, images.length)}px`);
    const scale = Math.min(1,
      Math.max(1, width - 1) / Math.max(1, inner.scrollWidth),
      Math.max(1, height - 1) / Math.max(1, inner.scrollHeight, inner.offsetHeight));
    inner.style.transform = `scale(${scale})`;
  });
}
// 合并异步排版事件；transform 不改变布局尺寸，不会触发观察器循环。
let fitFrame;
function scheduleFit() {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitSlides);
}
slides.forEach(s => {
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleFit);
    observer.observe(s.querySelector('.inner'));
    const title = s.querySelector('.titlebar');
    if (title) observer.observe(title);
  }
  s.addEventListener('load', scheduleFit, true);
  s.addEventListener('error', scheduleFit, true);
});
window.addEventListener('resize', scheduleFit);
window.addEventListener('load', scheduleFit);
if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone', scheduleFit);
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ': case 'ArrowRight': case 'ArrowDown': case 'j': case 'l': case 'Enter': case 'PageDown':
      e.preventDefault(); show(i + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'h': case 'k': case 'Backspace': case 'PageUp':
      e.preventDefault(); show(i - 1); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(slides.length - 1); break;
    case 'f':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
    case 'q':
      window.close();
      break;
  }
});
</script>
</body>
