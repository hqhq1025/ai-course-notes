<style>
  :root {
    --bg: #ffffff; --fg: #111111;
    --muted: #555555; --border: #999999;
    --blue: #1e3a8a; --cyan: #0e7490; --green: #15803d;
    --purple: #6d28d9; --red: #b91c1c; --orange: #c2410c; --yellow: #a16207;
    --code-bg: #fafbfc; --quote-bg: #f7f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;                   /* 满屏，无外框 */
    display: none;
    padding: 3vh 4vw;
    overflow: hidden;
    font-size: clamp(20px, 3.25vh, 35px);
    line-height: 1.7;
  }
  .slide .inner {
    position: relative; z-index: 1;   /* 盖在顶部光斑 ::before 之上 */
    display: flow-root;         /* 包含首尾 margin 和浮动，保证测量完整 */
    width: 100%;
    overflow-wrap: anywhere;
    transform-origin: top left;
  }
  /* 翻页过渡：新页沿翻页方向推入、旧页同速推出（--dir 由 JS 按方向设置）。
     两页首尾相接一起移动，任何时刻都铺满屏幕，不会露出白底闪烁。 */
  .slide.active { display: block; z-index: 2; animation: pagein .28s cubic-bezier(.22, .61, .36, 1); }
  .slide.leaving { display: block; z-index: 1; animation: pageout .28s cubic-bezier(.22, .61, .36, 1); }
  @keyframes pagein  { from { transform: translateX(calc(100% * var(--dir, 1))); } }
  /* 旧页少退出 4px：被新页压在下面，盖住两页接缝处的亚像素圆整白线 */
  @keyframes pageout { to   { transform: translateX(calc(var(--dir, 1) * (4px - 100%))); } }
  .slide.no-anim { animation: none; }  /* 初始首页直接显示（须置于上方两条规则之后） */
  /* 标题条：JS 把每页开头的 <h1> 提到 .inner 之外 → 不参与整页等比缩放，
     负 margin 抵消 slide 的 padding，左右/上方始终顶格；无圆角。
     深色毛玻璃：模糊的是 ::before 生成的顶部彩色光斑。 */
  .slide .titlebar {
    position: relative; z-index: 2;
    margin: -3vh -4vw .8em;      /* slide padding 为 3vh 4vw */
    padding: .3em 4vw;           /* 与正文（h2/p/li）左线对齐 */
    background: rgba(59, 7, 100, .72);    /* purple-950 玻璃 */
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    border-bottom: 1px solid rgba(255, 255, 255, .25);
  }
  .slide .titlebar h1 {
    font-size: 1.55em; color: #fff;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .35);
  }
  .slide .titlebar h1 :is(b, strong) { color: #fca5a5; }  /* 深色条上红色加粗提亮 */
  .slide .inner h1 { font-size: 1.55em; margin: 0 0 .6em; border-bottom: 2px solid #8fa3c8; padding-bottom: .3em; }  /* 非页首 h1 兜底 */
  /* 顶部静态彩色光斑：给毛玻璃提供可被模糊的背景（无动画），正文区仍为白底 */
  .slide::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 5em;
    z-index: 0;
    background:
      radial-gradient(30em 10em at 12% -30%, rgba(59, 130, 246, .5), transparent 60%),
      radial-gradient(26em 9em at 58% -50%, rgba(139, 92, 246, .42), transparent 60%),
      radial-gradient(30em 10em at 94% -25%, rgba(6, 182, 212, .4), transparent 60%);
    pointer-events: none;
  }
  .slide h2 { font-size: 1.25em; color: var(--fg); margin: 1em 0 .5em; }
  .slide h3 { font-size: 1.2em; color: var(--muted); margin: 1em 0 .4em; }
  .slide p { margin: .5em 0; }
  .slide :is(b, strong), .slide :is(h1, h2, h3) :is(b, strong) { color: var(--red); }
  .slide ul, .slide ol { padding-left: 1.6em; margin: .5em 0; }
  .slide li { margin: .25em 0; }
  .slide blockquote {
    border-left: 3px solid var(--border); padding: .3em 1.2em; margin: .8em 0;
    color: var(--muted); background: var(--quote-bg);
  }
  .slide blockquote::before {
    content: "\201C";
    float: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.8em;
    line-height: .9;
    margin: .05em .25em 0 0;
    color: #bdbdbd;
    user-select: none;
  }
  .slide code {
    font-size: .9em;
    font-family: "LXGW WenKai Mono", "霞鹜文楷等宽", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .slide pre {
    background: var(--code-bg); border: 1px solid #e5e7eb; border-radius: 8px;
    padding: .4em .6em; margin: .8em 0; overflow: visible;
  }
  .slide pre code { background: none; padding: 0; color: var(--fg); }
  .slide pre code.hljs { overflow: visible; }
  .slide a { color: var(--muted); }
  .slide a.badlink {
    color: var(--red); text-decoration: line-through;
    cursor: not-allowed;
  }
  .slide img.badlink {
    border: 2px dashed var(--red); border-radius: 6px;
    min-width: 8em; min-height: 4em;
    background: repeating-linear-gradient(45deg, #fff, #fff 8px, #fde8e8 8px, #fde8e8 16px);
  }
  .slide .badge {
    display: inline-block;
    font-size: .6em; font-weight: 700;
    color: #fff; background: var(--red);
    border-radius: 3px; padding: .1em .4em;
    vertical-align: .2em;
    text-decoration: none;
  }
  .slide hr { border: none; border-top: 2px solid var(--border); margin: 1.2em 0; }
  .slide img {
    display: block;
    max-width: 90%;
    margin: .8em auto;
    border-radius: 8px;
  }
  /* 图片先限制到正文可用高度，再与其余正文一起参与缩放。支持多图。 */
  .slide .inner img {
    max-height: var(--image-height, 60vh);
    object-fit: contain;
  }
  #pager {
    position: fixed; right: 2.5vw; bottom: 2.5vh;
    font-size: 14px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  /* AI 补充内容（行内 span）：inline-block 让 padding 上下左右都实际占位生效 */
  .slide span.aigc {
    display: inline-block;
    border: 1px dashed #ddccf0;      /* 极淡紫，几乎隐形的虚线 */
    border-radius: 4px;
    padding-left: 0.45em;
    background: #fff;
    color: rgba(76, 29, 149, .75);   /* purple-900，25% 透明 */
  }
  .slide .aigc::before {
    content: "";
    display: inline-block;
    width: .95em; height: .95em;
    margin-right: .2em;
    vertical-align: -.1em;
    background-color: #6b21a8;
    clip-path: polygon(50% 4%, 62% 36%, 96% 50%, 62% 64%, 50% 96%, 36% 64%, 4% 50%, 36% 36%);
  }
  .slide .aigc a { color: rgba(76, 29, 149, .75); }
</style>

4ef6\u4e8b\uff1a\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u7126\u8651 (1): AI \u5e2e\u6211\u4e0a\u5927\u5b66\uff0c\u6700\u540e\u4ec0\u4e48\u90fd\u6ca1\u5b66\u4f1a\u3002\u600e\u4e48\u529e\uff1f\u003c/li\u003e\n\u003cli\u003e\u7126\u8651 (2): \u542c\u8bdd\u5b66\u4e60\u4e86\u56db\u5e74\uff0c\u53d1\u73b0\u88ab\u5927\u5b66\u9a97\u4e86\uff1f\u003c/li\u003e\n\u003cli\u003e\u7126\u8651 (3): \u4e3a\u4e86\u5237\u51fa\u4e00\u4efd\u5b8c\u7f8e\u7684\u003ca href=\"lect/cv.pdf\"\u003e\u7b80\u5386\u003c/a\u003e\uff0c\u8f93\u4e86\u4eba\u751f\uff1f\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u6211\u662f\u5728\u589e\u957f\u80fd\u529b\uff0c\u8fd8\u662f\u5728\u589e\u957f\u201c\u770b\u8d77\u6765\u6709\u80fd\u529b\u201d\u7684\u8bc1\u636e\uff1f\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eWhat? AI \u65f6\u4ee3\u8fd8\u6709\u7528\u7684\u201c\u8f6f\u4ef6\u5de5\u7a0b\u667a\u6167\u201d\u003c/h1\u003e\n\u003ch2\u003e\u8f6f\u4ef6\u5de5\u7a0b\u7814\u7a76\u7684\u662f\u201c\u600e\u4e48\u8ba9\u5de5\u7a0b\u4e0d\u5931\u8d25\u201d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eAI \u53ef\u4ee5\u52a0\u901f\u5b9e\u73b0\uff0c\u5374\u4e0d\u4f1a\u81ea\u52a8\u66b4\u9732\u672a\u77e5\u3001\u5206\u914d\u8d23\u4efb\u6216\u9a8c\u8bc1\u7ed3\u679c\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5de5\u7a0b\u7684\u76ee\u6807\u4e0d\u662f\u8ba9 demo \u8dd1\u8d77\u6765\uff0c\u800c\u662f\u8ba9\u7cfb\u7edf\u5728\u7ea6\u675f\u3001\u53d8\u5316\u548c\u534f\u4f5c\u4e2d\u7ee7\u7eed\u6d3b\u7740\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5927\u5b66\u8fd8\u80fd\u6559\u4f60\u7684\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4fe1\u606f\u5dee\u3001\u80fd\u5750\u7262\u3001\u003cstrong\u003e\u80fd\u9a7e\u9a6d\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4fe1\u606f\u5dee\uff1a\u77e5\u9053\u54ea\u91cc\u4e0d\u77e5\u9053\uff1b\u80fd\u5750\u7262\uff1a\u4e3a\u53d6\u820d\u627f\u62c5\u540e\u679c\uff1b\u80fd\u9a7e\u9a6d\uff1a\u8ba9\u4eba\u3001Agent \u4e0e\u53cd\u9988\u6301\u7eed\u5bf9\u9f50\u76ee\u6807\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eMars Climate Orbiter \u7684\u5355\u4f4d\u63a5\u53e3\u4e8b\u6545\u63d0\u9192\u6211\u4eec\uff1a\u98ce\u9669\u5e38\u53d1\u751f\u5728\u56e2\u961f\u8fb9\u754c\uff1b\u771f\u6b63\u7684\u5de5\u7a0b\u80fd\u529b\uff0c\u662f\u5efa\u7acb\u80fd\u5728\u53d1\u5c04\u524d\u53eb\u505c\u9519\u8bef\u7684\u95ed\u73af\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eHow? \u6848\u4f8b\u4e3a\u4e3b\u7684\u677e\u6563\u7ec4\u7ec7\u003c/h1\u003e\n\u003ch2\u003e\u63a2\u7d22\u4e00\u6761\u201c\u6740\u6b7b\u5927\u5b66\u201d\u7684\u8def\u5f84\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u8bfe\u5802\u81ea\u7531\u8ba8\u8bba\u3001\u5b8c\u6574\u8bb0\u5f55\uff08\u76f4\u64ad\uff09\u003c/li\u003e\n\u003cli\u003e\u8bfe\u540e\u91cd\u65b0\u6574\u7406\u003c/li\u003e\n\u003cli\u003e\u4ee5\u5207\u7247\u5f62\u5f0f\u516c\u5f00\uff0c\u8fdb\u800c\u5b9e\u73b0\u6c38\u751f\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8ba9\u8ba8\u8bba\u53ef\u641c\u7d22\u3001\u53ef\u5f15\u7528\u3001\u53ef\u4fee\u8ba2\u3001\u53ef\u91cd\u7ec4\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u76f4\u64ad\u53ea\u80fd\u4fdd\u5b58\u73b0\u573a\uff1b\u201c\u6c38\u751f\u201d\u6765\u81ea\u628a\u4e00\u6b21\u6027\u8bfe\u5802\u53d8\u6210\u53ef\u6301\u7eed\u7ef4\u62a4\u7684\u77e5\u8bc6\u8d44\u4ea7\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u003ca href=\"https://www.feynmanlectures.caltech.edu/recordings.html\"\u003eFeynman Lectures\u003c/a\u003e \u4e5f\u662f\u4ece\u8bfe\u5802\u5f55\u97f3\u51fa\u53d1\uff0c\u7ecf\u7f16\u8f91\u3001\u6570\u5b57\u5316\u548c\u4ea4\u53c9\u94fe\u63a5\uff0c\u624d\u6210\u4e3a\u8de8\u8d8a\u6570\u5341\u5e74\u7684\u8bfe\u7a0b\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eEverything is code\u003c/h1\u003e\n\u003ch2\u003e\u8fd9\u5957 slides \u5982\u4f55\u5de5\u4f5c\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6587\u672c\u662f source of truth\uff1b\u4f60\u770b\u5230\u7684\u5176\u4ed6\u6a21\u6001\u90fd\u662f AIGC\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5b8c\u6574\u8bb2\u4e49\u63d0\u4f9b\u4e0a\u4e0b\u6587 \u2192 \u9009\u4e2d\u7684 snippet \u5212\u5b9a\u8fb9\u754c \u2192 Agent \u6269\u5199 \u2192 Markdown slides \u2192 \u6d4f\u89c8\u5668\u6e32\u67d3\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u751f\u6210\u5185\u5bb9\u7edf\u4e00\u6807\u8bb0\u4e3a \u003ccode\u003eaigc\u003c/code\u003e\uff1b\u903b\u8f91\u6539\u53d8\u65f6\u4fee\u6539\u6e90\u7801\uff0c\u56fe\u7247\u3001\u7f51\u9875\u548c\u89c6\u9891\u5207\u7247\u90fd\u53ef\u4ee5\u91cd\u65b0\u751f\u6210\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u8981\u201c\u6c38\u751f\u201d\u7684\u4e0d\u662f\u4e00\u4efd\u5f55\u50cf\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4fdd\u5b58\u53ef\u7f16\u8f91\u3001\u53ef diff\u3001\u53ef\u590d\u73b0\u7684\u6e90\u4ee3\u7801\u4e0e\u6784\u5efa\u8fc7\u7a0b\uff0c\u800c\u4e0d\u53ea\u662f\u6700\u7ec8\u50cf\u7d20\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u5982\u679c\u6210\u529f\uff0c\u5c31\u201c\u6c38\u751f\u201d\u6211\u7684\u64cd\u4f5c\u7cfb\u7edf\u8bfe\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eHow? \u91cd\u65b0\u627e\u56de\u540c\u5b66\u4eec\u5fc3\u4e2d\u7684\u70ed\u60c5\u003c/h1\u003e\n\u003ch2\u003e\u9f13\u52b1\u5927\u5bb6\u591a\u5b9e\u8df5\uff0c\u7981\u6b62\u53e4\u6cd5\u7f16\u7a0b\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5b9e\u8df5\u4e0d\u662f\u8bfe\u540e\u5de9\u56fa\uff0c\u800c\u662f\u5b66\u4e60\u53d1\u751f\u7684\u4e3b\u5faa\u73af\uff1a\u4e00\u9879\u6c47\u603b 225 \u9879\u672c\u79d1 STEM \u7814\u7a76\u7684\u003ca href=\"https://doi.org/10.1073/pnas.1319030111\"\u003e\u7814\u7a76\u003c/a\u003e\u663e\u793a\uff0c\u4e3b\u52a8\u5b66\u4e60\u 4e2a token\u201d\u662f\u8bad\u7ec3\u63a5\u53e3\uff0c\u4e0d\u662f\u80fd\u529b\u4e0a\u9650\uff1a\u8981\u540c\u65f6\u9884\u6d4b\u4ee3\u7801\u3001\u8bc1\u660e\u3001\u5bf9\u8bdd\u548c\u6545\u4e8b\uff0c\u6a21\u578b\u5c31\u88ab\u8feb\u538b\u7f29\u8bed\u8a00\u80cc\u540e\u7684\u4e16\u754c\u89c4\u5f8b\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u81ea\u56de\u5f52\u628a\u9759\u6001\u5206\u5e03\u5c55\u5f00\u6210\u8ba1\u7b97\u8fc7\u7a0b\uff1a\u6bcf\u4e2a\u8f93\u51fa\u90fd\u4f1a\u5199\u56de context\uff1b\u8db3\u591f\u957f\u7684 token \u5e8f\u5217\u53ef\u4ee5\u627f\u8f7d\u8349\u7a3f\u3001\u7b97\u6cd5\u548c\u63a8\u7406\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4f7f\u7528\u8005\u6700\u6709\u7528\u7684\u5fc3\u667a\u6a21\u578b\uff1a\u5b83\u4e0d\u662f\u7b54\u6848\u6570\u636e\u5e93\uff0c\u800c\u662f\u4e00\u4e2a\u7531 context \u6761\u4ef6\u5316\u7684\u6a21\u62df\u5668\u2014\u2014\u6211\u4eec\u771f\u6b63\u201c\u7f16\u7a0b\u201d\u7684\u662f context\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u6d41\u7545\uff0c\u53ea\u8bf4\u660e\u201c\u5728\u8fd9\u4e2a\u4e0a\u4e0b\u6587\u91cc\u50cf\u4e00\u4e2a\u7b54\u6848\u201d\uff1b\u5b83\u4e0d\u662f\u6b63\u786e\u6027\u7684\u8bc1\u636e\u3002\u003c/span\u003e\u003c/p\u003e\n\u003c/blockquote\u003e", "\u003ch1\u003eGPT-4 (2023)\uff1a\u7ed9\u4e94\u5c81\u5b69\u5b50\u89e3\u91ca SEM\u003c/h1\u003e\n\u003ch2\u003e\u4e0d\u53ea\u662f\u77e5\u9053\uff0c\u800c\u662f\u4e3a\u542c\u4f17\u91cd\u7f16\u7801\u003c/h2\u003e\n\u003cp\u003e\u4e3a\u6211\u7684\u4e94\u5c81\u5c0f\u670b\u53cb\u89e3\u91ca\u626b\u63cf\u7535\u5b50\u663e\u5fae\u955c (SEM)\uff1a\u6734\u7d20\u7684\u8bed\u8a00\u3001\u6253\u5408\u9002\u7684\u6bd4\u65b9\uff0c\u4fbf\u4e8e\u4ed6\u7406\u89e3\u672c\u8d28\u539f\u7406\u3002\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u628a\u6837\u54c1\u60f3\u6210\u9ed1\u5c4b\u91cc\u7684\u4e00\u5c0f\u5757\u6708\u7403\u5730\u9762\u3002SEM \u4e0d\u7528\u76f8\u673a\u4e00\u6b21\u62cd\u5b8c\u6574\u5f20\u7167\u7247\uff0c\u800c\u62ff\u4e00\u652f\u770b\u4e0d\u89c1\u3001\u7ec6\u5f97\u4e0d\u5f97\u4e86\u7684\u201c\u7535\u5b50\u94c5\u7b14\u201d\uff0c\u4e00\u884c\u4e00\u884c\u626b\u8fc7\u8868\u9762\u3002\u94c5\u7b14\u5c16\u78b0\u5230\u54ea\u91cc\uff0c\u90a3\u91cc\u5c31\u4f1a\u8e66\u51fa\u6216\u5f39\u56de\u4e00\u4e9b\u7535\u5b50\uff1b\u65c1\u8fb9\u7684\u201c\u5c0f\u6876\u201d\u628a\u5b83\u4eec\u63a5\u4f4f\uff0c\u63a5\u5f97\u591a\u5c31\u5728\u5c4f\u5e55\u4e0a\u753b\u4eae\u4e00\u70b9\uff0c\u63a5\u5f97\u5c11\u5c31\u753b\u6697\u4e00\u70b9\u3002\u65e0\u6570\u4eae\u6697\u5c0f\u70b9\u62fc\u8d77\u6765\uff0c\u6211\u4eec\u5c31\u770b\u89c1\u4e86\u8089\u773c\u770b\u4e0d\u5230\u7684\u8868\u9762\u7eb9\u7406\u3002\u003c/span\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u56e0\u679c\u9aa8\u67b6\u6ca1\u6709\u4e22\uff1a\u7535\u5b50\u675f\u9010\u70b9\u626b\u63cf $\\rightarrow$ \u63a2\u6d4b\u4e8c\u6b21/\u80cc\u6563\u5c04\u7535\u5b50 $\\rightarrow$ \u4fe1\u53f7\u5f3a\u5f31\u6620\u5c04\u6210\u50cf\u7d20\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eSEM \u4e0d\u662f\u201c\u62ff\u66f4\u5f3a\u7684\u76f8\u673a\u653e\u5927\u201d\uff0c\u800c\u662f\u626b\u63cf\u3001\u6d4b\u91cf\u3001\u91cd\u5efa\uff1b\u56fe\u50cf\u50cf\u4e09\u7ef4\u5730\u5f62\uff0c\u4e5f\u4e0d\u7b49\u4e8e\u76f4\u63a5\u6d4b\u5f97\u4e09\u7ef4\u9ad8\u5ea6\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4ea7\u54c1\u8dc3\u8fc1\u4e0d\u53ea\u662f\u201c\u77e5\u9053 SEM\u201d\uff0c\u800c\u662f\u80fd\u5efa\u7acb\u542c\u4f17\u6a21\u578b\uff1a\u68c0\u7d22\u7cfb\u7edf\u7ed9\u672f\u8bed\uff0cLLM \u53ef\u4ee5\u6210\u4e3a\u77e5\u8bc6\u4e0e\u4eba\u4e4b\u95f4\u7684\u8ba4\u77e5\u63a5\u53e3\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4ece ChatGPT \u5230 Agent\u003c/h1\u003e\n\u003ch2\u003e\u53cd\u9988\u56de\u8def\u8d8a\u6765\u8d8a\u957f\u003c/h2\u003e\n\u003cp\u003eTransformer \u8bba\u6587\u51fa\u73b0\u65f6\uff0cNLP \u9886\u57df\u5df2\u7ecf\u70ed\u8d77\u6765\u4e86\uff1b\u4f46\u76f4\u5230 ChatGPT\uff0c\u624d\u51fa\u73b0\u201c\u73b0\u8c61\u7ea7\u201d\u4ea7\u54c1\u3002\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003eTransformer \u8ba9\u8ba1\u7b97\u53ef\u6269\u5c55\uff1bChatGPT \u628a\u80fd\u529b\u653e\u8fdb\u4f4e\u6469\u64e6\u7684\u5bf9\u8bdd\u754c\u9762\uff1breasoning \u5728\u6d4b\u8bd5\u65f6\u6295\u5165\u66f4\u591a\u8ba1\u7b97\uff1bAgent \u518d\u628a\u73af\u5883\u53cd\u9988\u63a5\u56de\u6a21\u578b\u3002\u4ea7\u54c1\u8dc3\u8fc1\u6765\u81ea\u6574\u6761\u94fe\u4e00\u8d77\u8d8a\u8fc7\u9608\u503c\u3002\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGPT o-family \u0026amp; DeepSeek R1 (2024\u20132025)\u003c/li\u003e\n\u003cli\u003eChain-of-thought \u5b9e\u73b0 in-context reasoning\uff1btest-time scaling \u8fd8\u53ef\u4ee5\u589e\u52a0\u8f68\u8ff9\u3001\u5019\u9009\u3001\u641c\u7d22\u4e0e\u9a8c\u8bc1\uff0c\u663e\u8457\u63d0\u9ad8\u590d\u6742\u63a8\u7406\u80fd\u529b\u003c/li\u003e\n\u003cli\u003eGPT-5 \u914d\u5408 search\uff0c\u5e7b\u89c9\u5df2\u7ecf\u975e\u5e38\u4f4e\uff1b\u003cspan class=\"aigc\"\u003e\u4f46\u98ce\u9669\u4e5f\u8f6c\u79fb\u5230\u4e86\u68c0\u7d22\u3001\u6765\u6e90\u9009\u62e9\u548c\u8bc1\u636e\u7efc\u5408\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u8fdb\u5316\u7684 Claude family (2025)\u003c/li\u003e\n\u003cli\u003eReAct \u578b Agent \u4ece\u201c\u4e0d\u53ef\u7528\u201d\u5230\u201c\u80fd\u7528\u201d\uff0c\u5ffd\u7136\u8f6f\u4ef6\u5de5\u7a0b\u5c8c\u5c8c\u53ef\u5371\uff08\u8fd9\u95e8\u8bfe\u5185\u5bb9\uff09\u003c/li\u003e\n\u003cli\u003e\u4eca\u5929 Agent \u4ea7\u54c1\u5f00\u59cb\u7206\u53d1\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eReAct \u7684\u201c\u63a8\u7406\u2014\u884c\u52a8\u2014\u89c2\u5bdf\u201d\u5728 2022 \u5e74\u5df2\u6709\uff1b2025 \u7684\u7a81\u53d8\uff0c\u662f\u6a21\u578b\u53ef\u9760\u6027\u3001\u957f\u4e0a\u4e0b\u6587\u3001\u5de5\u5177\u63a5\u53e3\u548c\u9519\u8bef\u6062\u590d\u5171\u540c\u8d8a\u8fc7\u53ef\u7528\u9608\u503c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u82e5\u6bcf\u6b65\u6210\u529f\u7387\u662f $90\\%$\uff0c\u8fde\u7eed 20 \u6b65\u5168\u5bf9\u53ea\u6709 $0.9^{20}\\approx12\\%$\uff1a\u957f\u4efb\u52a1\u91cc\uff0c\u201c\u597d\u4e00\u70b9\u201d\u53ef\u80fd\u610f\u5473\u7740\u4ece\u4e0d\u53ef\u7528\u5230\u80fd\u7528\u3002\u003c/span\u003e\u003c/p\u003e\n\u003c/blockquote\u003e", "\u003ch1\u003e\u4e0d\u6b62 next token\u003c/h1\u003e\n\u003ch2\u003eContext \u53ef\u4ee5\u6210\u4e3a\u53ef\u5199\u7684\u72b6\u6001\u003c/h2\u003e\n\u003cp\u003e\u73b0\u5728\uff1a\u4e16\u754c\u4e0a\u4eba\u624d\u5bc6\u5ea6\u6700\u5927\u7684\u9886\u57df\uff0c\u98a0\u8986\u6027\u7684\u521b\u65b0\u4e5f\u8bb8\u5c31\u5728\u660e\u5929\uff1bTransformers \u7684\u4e0a\u9650\u8fd8\u6ca1\u5230\uff0c\u4e0a\u9650\u66f4\u9ad8\u7684\u4e1c\u897f\u4e5f\u80af\u5b9a\u5b58\u5728\u2026\u2026\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u4e3a\u4ec0\u4e48\u4e0d\u662f $\\Pr[\\text{context}_{t+1}\\mid\\text{context}_t]$ \u7684\u6a21\u578b\u5462\uff1f\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://chat.inceptionlabs.ai/\"\u003eDiffusion LM\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eSelf-modifying of context...\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4ece\u8868\u8fbe\u80fd\u529b\u770b\uff0c\u4e00\u4e32 next-token \u5df2\u7ecf\u80fd\u751f\u6210\u6574\u4e2a\u65b0 context\uff1a$P(x_{1:n}\\mid c)=\\prod_i P(x_i\\mid c,x_{\u003ci})$\uff1b\u771f\u6b63\u4e0d\u540c\u7684\u662f\u8ba1\u7b97\u65b9\u5f0f\u3002\u003c span=\"\"\u003e\u003c/i})$\uff1b\u771f\u6b63\u4e0d\u540c\u7684\u662f\u8ba1\u7b97\u65b9\u5f0f\u3002\u003c\u003e\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u81ea\u56de\u5f52\u50cf\u7528\u94a2\u7b14\u4ece\u5de6\u5199\u52  title=\"\u4e0d\u5b58\u5728: ../docs/sway-cheatsheet.html\"\u003e\u751f\u6210\u6587\u6863 \u003cspan class=\"badge\"\u003einvalid\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u7ec8\u7aef\u3001nvim \u7684\u73b0\u4ee3\u914d\u7f6e\u003c/li\u003e\n\u003cli\u003e\u6211\u6ca1\u6709\u770b\u8fc7\u4efb\u4f55\u4e00\u773c\u914d\u7f6e\u6587\u4ef6\uff0c\u5168\u90e8\u7531\u81ea\u7136\u8bed\u8a00\u5b8c\u6210\u914d\u7f6e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://zhuanlan.zhihu.com/p/619237809\"\u003e\u88c5\u673a\u4ed9\u4eba\u003c/a\u003e\u5f7b\u5e95\u6210\u4e3a\u5386\u53f2\u003c/li\u003e\n\u003cli\u003e\u5f7b\u5e95\u98a0\u8986\u4e86\u8ba1\u7b97\u673a\u4e2d\u201c\u5b66\u4e60\u66f2\u7ebf\u592a\u9661\uff0c\u4e0d\u60f3\u7528\u201d\u7684\u74f6\u9888\u003c/li\u003e\n\u003cli\u003e\u8c01\u638c\u63e1\u4e86 AI\uff0c\u8c01\u5c31\u638c\u63e1\u4e86\u66b4\u589e\u7684\u5b66\u4e60\u6548\u7387\uff0c\u003cstrong\u003e\u5148\u7528\u597d\u3001\u518d\u7406\u89e3\u539f\u7406\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5148\u7528\u597d \u2260 \u4e0d\u9a8c\u6536\uff1a\u5b66\u4e60\u66f2\u7ebf\u4ece\u201c\u8bb0\u4f4f\u6bcf\u4e00\u6b65\u201d\u53d8\u6210\u201c\u5224\u65ad\u7ed3\u679c\u662f\u5426\u6b63\u786e\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eExample 2\uff1a\u6536\u53d1\u90ae\u4ef6\u5199\u8349\u7a3f\u003c/h1\u003e\n\u003ch2\u003e\u4e00\u4e2a db-query skill\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u5305\u62ec\u4e86\u6211\u5386\u53f2\u4e0a\u7684\u6240\u6709\u56de\u590d\u003c/li\u003e\n\u003cli\u003e\u6839\u636e\u90ae\u4ef6\u5185\u5bb9\u81ea\u52a8\u5f52\u6863\uff1b\u9700\u8981\u56de\u590d\u7684\uff0c\u7528\u6211\u7684\u53e3\u543b\u62df\u597d\u8349\u7a3f\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6838\u5fc3\u8d44\u4ea7\u4e0d\u662f\u201c\u4f1a\u5199\u4e00\u5c01\u4fe1\u201d\uff0c\u800c\u662f\u80fd\u68c0\u7d22\u6211\u8fc7\u53bb\u5982\u4f55\u5224\u65ad\u3001\u5982\u4f55\u56de\u5e94\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eReminders \u662f\u53cc\u5411\u63a5\u53e3\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u901a\u77e5\u63a8\u9001\u5230 Apple Reminders.app\u003c/li\u003e\n\u003cli\u003e\u6211\u4e5f\u53ef\u4ee5\u901a\u8fc7 Reminders \u7ed9 Agent \u53d1\u6307\u4ee4\uff0c\u800c\u4e0d\u662f Telegram \u804a\u5929\u6846\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e8e\u662f\u5f62\u6210\u95ed\u73af\uff1a\u6536\u5230\u90ae\u4ef6 \u2192 \u68c0\u7d22\u5386\u53f2 \u2192 \u5f52\u6863\u6216\u8d77\u8349 \u2192 \u63d0\u9192\u4eba\u5de5\u786e\u8ba4\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eExample 3\uff1a\u8bfb\u4e66\u3001\u8bfb\u8bba\u6587\u003c/h1\u003e\n\u003ch2\u003e\u4ece\u53e4\u6cd5\u5b66\u4e60\u5230\u7535\u5b50\u7248 Agent\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6211\u53c8\u4e70\u4e86\u4ee5\u524d\u770b\u8fc7\u7684\u4e66\uff0c\u91cd\u6e29\u4e00\u4e0b\u53e4\u6cd5\u5b66\u4e60\u003c/li\u003e\n\u003cli\u003e\u968f\u540e\u7acb\u5373\u7535\u5b50\u7248 AI Agent \u542f\u52a8 \ud83d\ude02\u003c/li\u003e\n\u003cli\u003eExtension\uff1a\u8bfb b \u7ad9\uff0c\u751f\u6210\u7684\u003ca href=\"lect/OS2026-02.pdf\"\u003e\u8bb2\u4e49\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u751f\u6210\u8bb2\u4e49\u53ea\u662f\u8f6c\u6362\u6750\u6599\uff0c\u4e0d\u81ea\u52a8\u7b49\u4e8e\u201c\u6df1\u5ea6\u9605\u8bfb\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAI \u5982\u4f55\u8f85\u52a9\u6df1\u5ea6\u9605\u8bfb\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8ffd\u8e2a\u8bba\u8bc1\uff1a\u7ed3\u8bba\u662f\u4ec0\u4e48\uff1f\u8bc1\u636e\u5728\u54ea\u91cc\uff1f\u6bcf\u4e2a\u56de\u7b54\u90fd\u80fd\u8df3\u56de\u539f\u6587\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5bf9\u6297\u9605\u8bfb\uff1a\u8ba9 Agent \u63d0\u51fa\u53cd\u4f8b\u3001\u9057\u6f0f\u7684\u524d\u63d0\uff0c\u4ee5\u53ca\u4f5c\u8005\u6700\u5f3a\u7684\u53cd\u9a73\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e3b\u52a8\u56de\u5fc6\uff1a\u5408\u4e0a\u539f\u6587\u63a5\u53d7\u53e3\u8bd5\uff0c\u518d\u6839\u636e\u539f\u6587\u7ea0\u9519\uff1b\u6458\u8981\u4e0d\u80fd\u66ff\u4f60\u7406\u89e3\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u91cd\u65b0\u7ec4\u7ec7\uff1a\u628a\u65b0\u89c2\u70b9\u6539\u5199\u3001\u5f52\u7c7b\uff0c\u5e76\u8fde\u63a5\u5230\u81ea\u5df1\u7684\u65e7\u7b14\u8bb0\u4e0e\u771f\u5b9e\u95ee\u9898\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4ece\u767d\u677f Agent \u5230\u5b8c\u6574\u751f\u6001\u003c/h1\u003e\n\u003ch2\u003e\u767d\u677f Agent \u53ea\u662f\u8d77\u70b9\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6ce8\u610f\uff1a\u4ee5\u4e0a\u4efb\u52a1\uff0c\u003cstrong\u003e\u767d\u677f Agent\u003c/strong\u003e \u5c31\u80fd\u5b8c\u6210\u003c/li\u003e\n\u003cli\u003eAgent \u62e5\u6709\u5b8c\u6574\u7684\u751f\u6001\u7cfb\u7edf\uff01\u003c/li\u003e\n\u003cli\u003edomain-specific \u4efb\u52a1 \u2192 domain-specific \u63d2\u4ef6\u003c/li\u003e\n\u003cli\u003e\u8ba1\u7b97\u673a\u79d1\u5b66\u5b9a\u5f8b\uff1a\u4f60\u60f3\u505a\u7684\u4e8b\uff0c\u4e00\u5b9a\u4e5f\u6709\u522b\u4eba\u60f3\u505a\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eEngelbart \u65e9\u5728 1962 \u5e74\u5c31\u6307\u51fa\uff1a\u589e\u5f3a\u667a\u80fd\u6765\u81ea\u201c\u4eba + \u5de5\u5177 + \u8bed\u8a00 + \u65b9\u6cd5\u201d\u7684\u7cfb\u7edf\uff0c\u800c\u4e0d\u662f\u4e00\u4e2a\u5b64\u7acb\u7684\u806a\u660e\u90e8\u4ef6\uff08\u003ca href=\"https://www.dougengelbart.org/content/view/138/\"\u003eAugmenting Human Intellect\u003c/a\u003e\uff09\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e$\\text{Agent \u80fd\u529b} \\approx \\text{\u63a8\u7406} \\times \\text{\u53ef\u89c2\u6d4b\u6027} \\times \\text{\u53ef\u64cd\u4f5c\u6027} \\times \\text{\u53cd\u9988}$\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u6d4f\u89c8\u5668\u4e0d\u662f\u9ed1\u76d2\u003c/h1\u003e\n\u003ch2\u003eBrowser Use / Computer Use\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBrowser CDP (Chrome DevTools Protocol)\u003c/li\u003e\n\u003cli\u003eDOM Query\u3001Network\u3001\u6a21\u62df\u7528\u6237\u8f93\u5165\u2026\u2026\u003c/li\u003e\n\u003cli\u003e\u8fd9\u662f CS \u5b66\u751f\u6700\u5927\u7684\u4f18\u52bf\uff1a\u5bf9\u201c\u8ba1\u7b97\u673a\u4e16\u754c\u91cc\u6709\u4ec0\u4e48\u201d\u6709\u6982\u5ff5\u003c/li\u003e\n\u003cli\u003e~2020s\uff0c\u6211\u4eec\u505a\u8fc7\u4e00\u4e2a\u5f88\u75af\u72c2\u7684 project\uff1a\u5728 OpenJDK \u4e0a\u8fd0\u884c Android app\uff0c\u7528 CDP \u6e32\u67d3\u754c\u9762\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u666e\u901a\u4eba\u770b\u5230\u50cf\u7d20\u548c\u6309\u94ae\uff1bCS \u5b66\u751f\u770b\u5230 DOM\u3001\u534f\u8bae\u3001\u4e8b\u4ef6\u548c\u72b6\u6001\u673a\u2014\u2014\u7cfb\u7edf\u91cc\u5f80\u5f80\u85cf\u7740\u6bd4\u201c\u70b9\u9f20\u6807\u201d\u66f4\u7a33\u5b9a\u7684\u63a7\u5236\u9762\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eDomain-specific \u63d2\u4ef6\u7684\u672c\u8d28\uff1a\u628a\u5de8\u5927\u3001\u6a21\u7cca\u7684\u52a8\u4f5c\u7a7a\u95f4\uff0c\u538b\u7f29\u6210\u8bed\u4e49\u660e\u786e\u3001\u5bb9\u6613\u9a8c\u8bc1\u7684\u64cd\u4f5c\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5728 \u003ca href=\"https://ehall.nju.edu.cn/\"\u003eehall\u003c/a\u003e \u4e0a\u5927\u6740\u56db\u65b9\u003c/h1\u003e\n\u003ch2\u003e\u7528\u9b54\u6cd5\u6253\u8d25\u9b54\u6cd5\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u8ba9 Agent \u63a2\u7d22\u9875\u9762\u3001\u7406\u89e3\u6d41\u7a0b\u3001\u5b8c\u6210\u4e00\u6b21\u4efb\u52a1\u003c/li\u003e\n\u003cli\u003e\u7136\u540e\u76f4\u63a5\u8ba9 Agent \u003cstrong\u003e\u6c89\u6dc0\u6210\u811a\u672c\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u8fd9\u6761\u8def\u7ebf\u5df2\u6709\u540d\u5b57\uff1aProgramming by Demonstration\uff1b\u4f8b\u5982 \u003ca href=\"https://web.eecs.umich.edu/~xwangsd/pubs/pldi22.pdf\"\u003eWebRobot\u003c/a\u003e \u4ece\u7f51\u9875\u64cd\u4f5c\u793a\u8303\u4e2d\u5408\u6210 RPA \u7a0b\u5e8f\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4ece\u64cd\u4f5c\u5230\u8d44\u4ea7\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eAgent \u63a2\u8def\uff0c\u811a\u672c\u63a5\u7ba1\uff1a\u6602\u8d35\u7684\u63a8\u7406\u53ea\u4ed8\u4e00\u6b21\uff0c\u91cd\u590d\u6267\u884c\u8d8b\u8fd1\u4e8e\u96f6\u6210\u672c\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6210\u529f\u4e00\u6b21\u53ea\u662f demo\uff1b\u6210\u529f\u8f68\u8ff9\u80fd\u88ab\u68c0\u67e5\u3001\u4fee\u6539\u3001\u91cd\u653e\uff0c\u624d\u6210\u4e3a\u8f6f\u4ef6\u8d44\u4ea7\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u81ea\u7531\u7ec4\u5408\uff0c\u65e0\u9650\u590d\u7528\u003c/h1\u003e\n\u003ch2\u003e\u4fe1\u606f\u6e90 \u2192 \u4fe1\u606f\u5904\u7406 \u2192 \u64cd\u4f5c\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u521a\u624d\u6240\u6709\u7684\u80fd\u529b\u90fd\u53ef\u4ee5\u003cstrong\u003e\u4e92\u76f8\u589e\u5f3a\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u4fe1\u606f\u6e90\uff08\u7f51\u9875\u3001B \u7ad9\u3001arXiv\u3001Hacker News\u2026\u2026\uff09+ \u4fe1\u606f\u5904\u7406 + \u64cd\u4f5c\uff08\u6dd8\u5b9d\u4e0b\u5355\u3001Box \u4e0a\u4f20\u3001iCloud\u2026\u2026\uff09\u003c/li\u003e\n\u003cli\u003e\u4e8e\u662f\u53ef\u4ee5\u7406\u89e3\u4e3a\u4ec0\u4e48 OpenClaw \u548c Hermes \u662f\u73b0\u8c61\u7ea7\u4ea7\u54c1\u4e86\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7ec4\u5408\u7684\u5173\u952e\u4e0d\u662f\u63d2\u4ef6\u591f\u591a\uff0c\u800c\u662f\u63a5\u53e3\u8db3\u591f\u7a84\u3001\u7a33\u5b9a\uff1b\u8fd9\u6b63\u662f \u003ca href=\"https://s3-us-west-2.amazonaws.com/belllabs-microsite-unixhistory/streams.html\"\u003eUnix pipe\u003c/a\u003e \u7559\u4e0b\u7684\u8f6f\u4ef6\u5de5\u7a0b\u9057\u4ea7\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5de5\u4f5c\u6d41\u4e5f\u80fd\u81ea\u4e3e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6211\u4eec\u5b8c\u5168\u53ef\u4ee5\u5f55\u5c4f\u4e00\u5929\uff0c\u8ba9 AI \u81ea\u52a8\u6539\u8fdb\u6d41\u7a0b\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u89c2\u5bdf\u64cd\u4f5c \u2192 \u53d1\u73b0\u91cd\u590d\u6a21\u5f0f \u2192 \u751f\u6210\u81ea\u52a8\u5316 \u2192 \u56de\u653e\u9a8c\u8bc1 \u2192 \u4eba\u786e\u8ba4 \u2192 \u6536\u96c6\u65b0\u5f02\u5e38\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u672a\u6765\u5df2\u6765\uff0cHarness \u672a\u7a33\u003c/h1\u003e\n\u003ch2\u003e\u80fd\u505a\uff0c\u4e0d\u7b49\u4e8e\u80fd\u653e\u5fc3\u6258\u4ed8\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOpenClaw/Hermes \u9884\u89c1\u4e86\u8fd9\u6837\u7684\u672a\u6765\u003c/li\u003e\n\u003cli\u003e\u53ef\u60dc\u73b0\u5728\u7684\u6a21\u578b/Harness \u8fd8\u6ca1\u6709\u5b8c\u5168\u51c6\u5907\u597d\uff0c\u4f53\u9a8c\u5e76\u4e0d\u591f\u597d\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5355\u6b65\u6210\u529f\u7387\u5373\u4f7f\u662f $99\\%$\uff0c\u8fde\u7eed 100 \u6b65\u5168\u6210\u529f\u4e5f\u53ea\u6709 $0.99^{100} \\approx 36.6\\%$\uff1b\u957f\u6d41\u7a0b\u9700\u8981\u72b6\u6001\u3001\u6743\u9650\u3001\u91cd\u8bd5\u3001\u9a8c\u8bc1\u548c\u6545\u969c\u6062\u590d\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4e00\u4e2a\u523a\u8033\u7684\u95ee\u9898\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6211\u5f88\u96be\u7406\u89e3\u65e7\u4eba\u7c7b\u4e3a\u4ec0\u4e48\u8fd8\u80fd\u5fc3\u5b89\u7406\u5f97\u5730\u6bcf\u5929\u505a\u91cd\u590d\u7684\u4e8b\u60c5\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7a33\u5b9a\u3001\u53ef\u63cf\u8ff0\u3001\u53ef\u9a8c\u8bc1\u7684\u91cd\u590d\uff0c\u672c\u8d28\u4e0a\u5c31\u662f\u4e00\u4e2a\u5c1a\u672a\u88ab\u62bd\u8c61\u51fa\u6765\u7684\u7a0b\u5e8f\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u4f7f\u7528 Agents\uff1aCS Professional \u89c6\u89d2\u003c/h1\u003e\n\u003ch2\u003e\u522b\u628a Agent \u53ea\u7528\u6765\u4ea4\u4f5c\u4e1a\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6700\u540e\uff0c\u6211\u4eec\u662f Computer Science \u7684\u5b66\u751f\uff0c\u975e\u5e38\u6e05\u695a\u5730\u77e5\u9053\u003cstrong\u003e\u7f16\u7a0b\u003c/strong\u003e\u7684\u80fd\u529b\u754c\u9650\u5728\u54ea\u91cc\u003c/li\u003e\n\u003cli\u003e\u7528 Agent \u505a\u4f5c\u4e1a\u5b9e\u5728\u662f\u592a\u5927\u6750\u5c0f\u7528\u4e86\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e1979 \u5e74 VisiCalc \u8ba9\u4f1a\u8ba1\u4eba\u5458\u4e0d\u5fc5\u6392\u961f\u7b49\u7a0b\u5e8f\u5458\uff1a\u80fd\u63cf\u8ff0\u6d41\u7a0b\u7684\u4eba\uff0c\u7b2c\u4e00\u6b21\u53ef\u4ee5\u76f4\u63a5\u62e5\u6709\u5de5\u5177\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u628a\u9700\u6c42\u201c\u7f16\u8bd1\u201d\u6210\u5de5\u5177\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eAgent \u7684\u771f\u6b63\u6760\u6746\u662f\u003cstrong\u003e\u73b0\u573a\u5236\u9020\u5de5\u5177\u003c/strong\u003e\uff1a\u628a\u4e00\u6b21\u6027\u7684\u81ea\u7136\u8bed\u8a00\u9700\u6c42\uff0c\u53d8\u6210\u53ef\u91cd\u590d\u6267\u884c\u7684\u95ed\u73af\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u53ef\u7f16\u7a0b\u6027\u7684\u8fb9\u754c\u4e0d\u5728\u201c\u6709\u6ca1\u6709 API\u201d\uff0c\u800c\u5728\uff1a\u80fd\u5426\u627e\u5230\u003cstrong\u003e\u53ef\u63a7\u8f93\u5165\u3001\u53ef\u89c2\u6d4b\u8f93\u51fa\u3001\u53ef\u5224\u5b9a\u7684\u5b8c\u6210\u6761\u4ef6\u003c/strong\u003e\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u73b0\u573a\u9020\u5de5\u5177\uff1a\u8003\u8bd5\u7edf\u5206\u003c/h1\u003e\n\u003ch2\u003e\u56db\u9636\u6bb5\u6d41\u6c34\u7ebf\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePhase 1: \u6309\u4e0b\u56de\u8f66\uff0c\u62cd\u6444\u4e00\u5f20\u7167\u7247\uff0cOffline qwen3.8-27b \u8bc6\u522b\u59d3\u540d\u3001\u5b66\u53f7\u3001\u5c0f\u5206\u003c/li\u003e\n\u003cli\u003ePhase 2: \u6309\u7167\u53cd\u5e8f\uff0c\u6309\u4e0b\u56de\u8f66\u62a5\u51fa [\u59d3\u540d] [\u5b66\u53f7] [11+12+13+14+15=65]\uff0c\u6211\u68c0\u9a8c\u540e\u8a8a\u5199\u603b\u5206\u003c/li\u003e\n\u003cli\u003e\u5206\u6570\u81ea\u52a8\u6c47\u603b\u5230\u6559\u52a1\u7cfb\u7edf\u7684 Excel \u6a21\u677f\u003c/li\u003e\n\u003cli\u003e\u6700\u540e\uff0cAgent \u76f4\u63a5\u767b\u8bb0\u5206\u6570 (\u65e5\u5e38\u5e94\u7528\u914d\u5408\u8c46\u5305\u8f93\u5165\u6cd5\u66f4\u4f73)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u4e0d\u662f OCR\uff0c\u800c\u662f\u8bc1\u636e\u94fe\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7167\u7247\u662f\u539f\u59cb\u51ed\u8bc1\uff0c\u5c0f\u5206\u662f\u4e2d\u95f4\u8868\u793a\uff0c\u603b\u5206\u4e0e Excel \u662f\u6d3e\u751f\u7ed3\u679c\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u201c\u53cd\u5e8f + \u62a5\u7b97\u5f0f\u201d\u50cf\u822a\u7a7a\u7ba1\u5236\u7684 readback\uff1a\u7528\u4e0d\u540c\u8868\u793a\u5236\u9020\u5197\u4f59\uff0c\u4e13\u95e8\u622a\u83b7\u9519\u4f4d\u3001\u6f0f\u9879\u548c\u8bef\u8bc6\u522b\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4eba\u53ea\u9a7b\u5b88\u6700\u7a84\u7684\u9ad8\u98ce\u9669\u63a5\u53e3\uff1a\u8ba9\u673a\u5668\u627f\u62c5\u541e\u5410\u91cf\uff0c\u7528\u4e00\u6b21\u590d\u6838\u963b\u6b62\u9519\u8bef\u8fdb\u5165\u6559\u52a1\u7cfb\u7edf\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eQuiz\uff1a\u53ea\u8fdb\u4e0d\u51fa\u7684\u673a\u5668\u003c/h1\u003e\n\u003ch2\u003e\u600e\u4e48\u5077\u51fa\u6587\u4ef6\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eModel: \u6587\u4ef6\u53ea\u8fdb\u4e0d\u51fa\u3002\u4e0d\u80fd\u6267\u884c\u4e0d\u4fe1\u4efb\u7684\u7a0b\u5e8f\u3001\u4e0d\u80fd\u663e\u793a\u4e0d\u4fe1\u4efb\u7684\u7f51\u9875\uff1b\u53ef\u4ee5 \u4e2a\u4efb\u52a1\u5f88\u5bb9\u6613\u5931\u8d25\uff0c\u7528\u63a5\u8fd1\u771f\u5b9e\u7684\u8bbe\u5b9a\uff08\u811a\u672c\uff09\u9a8c\u8bc1\u516c\u5f0f\u80fd\u6b63\u786e\u8ba1\u7b97\u3002\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003e\u9690\u85cf\u7684\u89c4\u683c\u7a7a\u95f4\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u4e00\u53e5\u201c\u4efb\u610f\u5b57\u7b26\u4e32\u201d\u540c\u65f6\u7559\u4e0b\u7f16\u7801\u3001\u5206\u7247\u987a\u5e8f\u3001\u5bb9\u91cf\u8fb9\u754c\u3001\u7a7a\u4e32/\u8d85\u957f\u8f93\u5165\u3001F9 \u91cd\u7b97\u548c\u8ba1\u65f6\u8bed\u4e49\u7b49\u9009\u62e9\uff1a\u9700\u6c42\u5f88\u77ed\uff0c\u4e0d\u7b49\u4e8e\u89c4\u683c\u7a7a\u95f4\u5f88\u5c0f\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u771f\u6b63\u7684\u9a8c\u6536\u5f0f\u4e0d\u662f\u201c\u6587\u4ef6\u80fd\u6253\u5f00\u201d\uff0c\u800c\u662f $\\forall s:\\ \\mathrm{Base64}^{-1}(\\operatorname{concat}(\\operatorname{scan}(\\operatorname{frames}(s))))=\\operatorname{bytes}(s)$\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u8dd1\u51fa\u6765\uff0c\u4e0d\u7b49\u4e8e\u505a\u6210\u003c/h1\u003e\n\u003ch2\u003e\u7ed3\u679c\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGLM-5.3\uff1a\u7b2c\u4e00\u6b21\u601d\u8003\u5c31\u6709 25 \u5206\u949f\u7684 CoT\uff0c\u7136\u540e\u8d85\u8fc7 32K output token max\uff1b6 \u5c0f\u65f6\u7ec8\u4e8e\u5b8c\u6210\u003c/li\u003e\n\u003cli\u003eDeepSeek V4 Pro\uff1a\u5df2\u7ecf\u65e0\u6cd5\u9075\u5faa\u6307\u4ee4\uff0c\u6700\u7ec8\u7ed9\u4e86\u4e00\u4e2a\u786c\u7f16\u7801\u7684\u7248\u672c\u003c/li\u003e\n\u003cli\u003e\u9a82\u8fc7\u4ee5\u540e\uff1a\u201cThis is a fundamental design flaw. I need to rethink.\u201d\u003c/li\u003e\n\u003cli\u003e\u4f46\u662f\uff1a\u003cstrong\u003e\u90fd\u662f\u5b8c\u5168\u65e0\u6cd5\u7ef4\u62a4\u7684 AI slop\u003c/strong\u003e\uff0c2 MB \u5927\u5c0f\u7684 Excel\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u540c\u4e00\u79cd\u6b7b\u6cd5\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u548c ehall.nju.edu.cn \u5b8c\u5168\u4e00\u6837\uff1a\u4e0a\u6765\u5c31\u5bf9\u7740\u9700\u6c42\u5199\uff0c\u76f4\u63a5\u9677\u5165\u7ef4\u62a4\u6ce5\u6f6d\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u786c\u7f16\u7801\u628a $\\forall x$ \u7684\u7a0b\u5e8f\u95ee\u9898\uff0c\u5077\u5077\u6362\u6210\u4e86\u201c\u8ba9\u8fd9\u4e2a $x_0$ \u901a\u8fc7\u201d\uff1a\u5b83\u53ef\u4ee5\u6f14\u793a\u6210\u529f\uff0c\u5374\u6ca1\u6709\u5b9e\u73b0\u9700\u6c42\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eAI slop \u7684\u672c\u8d28\u4e0d\u662f\u6587\u4ef6\u5927\uff0c\u800c\u662f\u6539\u52a8\u6ca1\u6709\u5c40\u90e8\u6027\uff1a\u4e00\u4e2a\u9700\u6c42\u53d8\u5316\uff0c\u5c31\u8feb\u4f7f\u6574\u5f20\u8868\u91cd\u65b0\u751f\u6210\uff1b2 MB \u53ea\u662f\u75c7\u72b6\u3002\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u5c11\u91cf Prompt\uff0c\u6362\u4e00\u4e2a\u67b6\u6784\u003c/h1\u003e\n\u003ch2\u003e\u5bf9\u6bd4\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u4ec5\u901a\u8fc7\u5c11\u91cf prompt\uff0cGLM-5.3 \u5728 200K \u4e0a\u4e0b\u6587\u5185\u5b8c\u6210\u7b2c\u4e00\u4e2a\u6b63\u786e\u7248\u672c\u003c/li\u003e\n\u003cli\u003e\u5de5\u4f5c\u8868\u4e0d\u56e0\u4e3a\u6587\u672c\u957f\u5ea6\u81a8\u80c0\u003c/li\u003e\n\u003cli\u003e\u516c\u5f0f\u53ef\u590d\u7528\u3001\u4ee3\u7801\u53ef\u7ef4\u62a4\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u5173\u952e\u4e0d\u662f\u201c\u518d\u591a\u60f3\u4e00\u4f1a\u201d\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u771f\u6b63\u7684\u8f6c\u6298\uff0c\u662f\u4ece\u201c\u751f\u6210\u4e00\u4e2a\u80fd\u8dd1\u7684\u6587\u4ef6\u201d\u5207\u6362\u5230\u201c\u8bbe\u8ba1\u4e00\u4e2a\u53ef\u590d\u7528\u7684\u8ba1\u7b97\u7ed3\u6784\u201d\u3002\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u76f8\u5bf9\u6587\u672c\u957f\u5ea6\uff0c\u516c\u5f0f\u6a21\u677f\u548c\u5de5\u4f5c\u8868 3e\u600e\u4e48\u628a\u4e00\u4ef6\u5927\u4e8b\uff0c\u5728\u003cstrong\u003e\u4eba\u548c\u5de5\u5177\u7684\u5171\u540c\u534f\u4f5c\u003c/strong\u003e\u4e0b\u505a\u6210\uff1f\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u6709\u6280\u672f\uff0c\u4e5f\u6709\u4eba\u7c7b\u5b66\u3001\u793e\u4f1a\u5b66\u3001\u7ba1\u7406\u5b66\u7684\u90e8\u5206\uff08\u4eba\u56e0\uff09\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://conf.researchr.org/track/icse-2027/icse-2027-research-track\"\u003eICSE 2027 Call for Papers\u003c/a\u003e: AI4SE, Analytics, Architecture and Design, Dependability and Security, Evolution, Human and Social Aspects, Requirements and Modeling, SE4AI, Testing and Analysis\u003c/li\u003e\n\u003cli\u003e\u6559\u80b2\u4f53\u7cfb\u201c\u8003\u8bd5\u5c31\u662f\u7ec8\u70b9\u201d\u7684\u5f0a\u7aef\u003c/li\u003e\n\u003cli\u003e\u6240\u6709\u201c\u8003\u9898\u201d\u90fd\u662f\u5206\u949f\u7ea7\u80fd\u6c42\u89e3\u7684\uff1b\u5927\u4f5c\u4e1a\u53ef\u4ee5\u6478\u9c7c\u003c/li\u003e\n\u003cli\u003e\u6ca1\u6709 self-motivation\uff0c\u5c31\u4ece\u672a\u8bad\u7ec3\u8fc7\u5982\u4f55\u89e3\u51b3 long-horizon \u7684\u95ee\u9898\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u5de5\u7a0b\u80fd\u529b\uff0c\u662f\u5728\u7a00\u758f\u3001\u5ef6\u8fdf\u7684\u53cd\u9988\u4e0b\u4ecd\u80fd\u7ef4\u6301\u65b9\u5411\uff1b\u8f6f\u4ef6\u5de5\u7a0b\u56e0\u6b64\u540c\u65f6\u7ec4\u7ec7\u6280\u672f\u3001\u534f\u4f5c\u5173\u7cfb\u3001\u4eba\u7684\u52a8\u673a\u548c\u65f6\u95f4\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eLLM \u65f6\u4ee3\uff0c\u5931\u8d25\u7684\u5b9a\u4e49\u6ca1\u6709\u53d8\u003c/h1\u003e\n\u003ch2\u003e\u5931\u8d25 = \u8f6f\u4ef6\u4e0d\u6ee1\u8db3 intent \u548c constraints\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u201c\u771f\u5b9e intent\u201d\u548c\u201c\u771f\u5b9e spec\u201d\u90fd\u975e\u5e38\u56f0\u96be\uff0cgap \u7684\u81ea\u7531\u5ea6\u5f88\u9ad8\u003c/li\u003e\n\u003cli\u003eGRPO \u7684 long-horizon reward \u4fe1\u53f7\u5176\u5b9e\u5f88\u5f31\u003c/li\u003e\n\u003cli\u003e\u4e0d\u50cf\u4eba\u5728\u7ecf\u5386\u9879\u76ee\u5931\u8d25\u4ee5\u540e\u4f1a\u201c\u4e09\u89c2\u5c3d\u6bc1\u201d\u518d\u91cd\u751f\uff08\u65b9\u6cd5\u8bba\u91cd\u5851\uff09\u003c/li\u003e\n\u003cli\u003e\u6211\u76f8\u4fe1\u8fd9\u4e2a\u95ee\u9898\u4f1a\u5728\u4e0d\u4e45\u7684\u5c06\u6765\u88ab\u201c\u5927\u529b\u51fa\u5947\u8ff9\u201d\u89e3\u51b3\u003c/li\u003e\n\u003cli\u003e\u8fd9\u6837\u4eba\u7c7b\u5c31\u4e0d\u5269\u4e0b\u4ec0\u4e48\u4e86\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003espec \u4e0d\u662f\u771f\u76f8\uff0c\u53ea\u662f\u5bf9 intent \u7684\u4e00\u6b21\u6709\u635f\u89c2\u6d4b\uff1b\u6d4b\u8bd5\u548c reward \u770b\u89c1\u7684\u5e38\u5e38\u53ea\u662f\u672b\u7aef proxy\u2014\u2014\u201c\u80fd\u901a\u8fc7\u6d4b\u8bd5\u201d\u4e0d\u7b49\u4e8e\u201c\u6ee1\u8db3\u771f\u5b9e\u610f\u56fe\u201d\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u600e\u4e48\u8ba9\u5de5\u7a0b\u4e0d\u5931\u8d25\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u628a\u4e0d\u53ef\u63a7\u7684\u5927\u8d4c\u6ce8\uff0c\u6539\u9020\u6210\u53ef\u9a8c\u8bc1\u7684\u5c0f\u8d4c\u6ce8\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u62c6\u89e3\uff1a\u628a\u5927\u201c\u56fd\u6c11\u7ea7\u5e94\u7528\u201d\u7684\u5927 gap \u62c6\u6210\u5c0f gap\u003c/li\u003e\n\u003cli\u003e\u9a8c\u8bc1\uff1a\u6d4b\u8bd5\u3001CI\uff0c\u786e\u4fdd\u95e8\u63a7\u003c/li\u003e\n\u003cli\u003e\u8fed\u4ee3\uff1a\u5c0f\u6b65\u63d0\u4ea4\u3001\u5feb\u901f\u9a8c\u8bc1\uff0c\u8ba9\u566a\u97f3\u5c3d\u65e9\u66b4\u9732\u003c/li\u003e\n\u003cli\u003e\u2026\u2026\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u8fd9\u4e0d\u662f\u4e09\u6761\u6280\u5de7\uff0c\u800c\u662f\u4e00\u4e2a\u53cd\u9988\u63a7\u5236\u73af\uff1a\u62c6\u89e3\u7f29\u77ed\u56e0\u679c\u8ddd\u79bb\uff0c\u95e8\u63a7\u9650\u5236\u9519\u8bef\u4f20\u64ad\uff0c\u8fed\u4ee3\u63d0\u9ad8\u53cd\u9988\u9891\u7387\uff1b\u76ee\u6807\u4e0d\u662f\u96f6\u9519\u8bef\uff0c\u800c\u662f\u9519\u8bef\u51fa\u73b0\u5f97\u65e9\u3001\u70b8\u5f97\u4e0d\u8fdc\u3001\u56de\u9000\u5f97\u4fbf\u5b9c\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003eDiscussion\uff1a\u5982\u4f55\u5b89\u6392 qrgen \u7684\u5f00\u53d1\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u6309\u201c\u98ce\u9669\u9000\u4f11\u201d\u7684\u987a\u5e8f\uff0c\u800c\u4e0d\u662f\u6309\u6700\u7ec8\u9700\u6c42\u5806\u529f\u80fd\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5148\u51bb\u7ed3 invariants\uff1aExcel \u2264 2019\u3001Base64 \u53ef\u91cd\u7ec4\u3001\u6bcf\u5e27\u53ef\u771f\u5b9e\u89e3\u7801\u3001\u5de5\u4f5c\u8868\u4e0d\u968f\u8f93\u5165\u957f\u5ea6\u81a8\u80c0\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eStage 0\uff1a\u5148\u5199\u72ec\u7acb oracle\uff0c\u7528\u968f\u673a\u3001\u8fb9\u754c\u548c golden cases \u9a8c\u8bc1\u7ed3\u679c\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eStage 1\uff1a\u56fa\u5b9a\u77ed\u5b57\u7b26\u4e32 \u2192 \u5355\u5e27 QR \u2192 \u88ab\u771f\u5b9e\u89e3\u7801\u5668\u8fd8\u539f\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eStage 2\uff1a\u4efb\u610f\u8f93\u5165 \u2192 Base64/\u5206\u7247\u6b63\u786e\uff1b\u4ecd\u53ea\u9009\u62e9\u4e00\u5e27\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eStage 3\uff1a\u591a\u5e27\u987a\u5e8f\u3001\u5faa\u73af\u3001\u62fc\u63a5\u53ef\u81ea\u52a8\u9a8c\u8bc1\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003eStage 4\uff1a\u6700\u540e\u52a0\u5165 F9/\u5b9a\u65f6\u3001\u517c\u5bb9\u6027\u548c\u6027\u80fd\uff1b\u6bcf\u4e00\u9636\u6bb5\u90fd\u7559\u4e0b\u53ef\u6267\u884c\u56de\u5f52\u95e8\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003eDiscussion\uff1a\u5982\u4f55\u8bbe\u8ba1 ehall.nju.edu.cn\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u9996\u5148\u662f\u6743\u8d23\u3001\u961f\u5217\u4e0e\u4f8b\u5916\u5904\u7406\u7cfb\u7edf\uff0c\u7136\u540e\u624d\u662f\u7f51\u9875\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6309\u201c\u5b66\u751f\u8981\u529e\u6210\u7684\u4e8b\u201d\u7ec4\u7ec7 journey\uff0c\u800c\u4e0d\u662f\u7167\u642c\u5b66\u6821\u7ec4\u7ec7\u67b6\u6784\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6bcf\u4efd\u6743\u5a01\u6570\u636e\u3001\u6bcf\u4e2a\u72b6\u6001\u8f6c\u6362\uff0c\u90fd\u5fc5\u987b\u6709\u660e\u786e owner\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u7a33\u5b9a\u5185\u6838\uff1a\u8eab\u4efd/\u6388\u6743\u3001\u5de5\u4f5c\u6d41\u72b6\u6001\u673a\u3001\u5ba1\u8ba1\u4e0e\u4e8b\u4ef6\u65e5\u5fd7\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u6613\u53d8\u90e8\u5206\uff1a\u90e8\u95e8\u62e5\u6709\u7684\u7248\u672c\u5316\u89c4\u5219\u3001\u8868\u5355\u548c\u754c\u9762\uff1b\u5236\u5ea6\u53d8\u5316\u4e0d\u5e94\u590d\u5236\u6574\u6761\u6d41\u7a0b\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u628a\u91cd\u8bd5\u3001\u64a4\u56de\u3001\u7533\u8bc9\u3001\u4eba\u5de5\u63a5\u7ba1\u5f53\u4f5c\u4e3b\u6d41\u7a0b\u8bbe\u8ba1\uff0c\u800c\u4e0d\u662f\u5f02\u5e38\u8865\u4e01\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"aigc\"\u003e\u5148\u8ba9\u4e00\u4e2a\u4e8b\u52a1\u5f62\u6210\u53ef\u89c2\u6d4b\u3001\u53ef\u56de\u6eda\u7684\u7eb5\u5207\u7247\uff0c\u518d\u9010\u6b65\u653e\u91cf\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e", "\u003ch1\u003e\u6210\u672c\u6838\u7b97\u65b9\u5f0f\u53d8\u4e86\u003c/h1\u003e\n\u003ch2\u003e\u201c\u751f\u4ea7\u201d\u4e0d\u518d\u7a00\u7f3a\uff0c\u201c\u9a8c\u8bc1\u201d\u6210\u4e3a\u74f6\u9888\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u201c\u5e72\u80fd\u660e\u786e\u63cf\u8ff0\u4f53\u529b\u6d3b\u7684\u7801\u519c\u201d\u53d8\u5f97\u975e\u5e38\u4fbf\u5b9c\uff0c\u800c\u4e14\u53ef\u4ee5 1000X \u5e76\u884c\u003c/li\u003e\n\u003cli\u003e\u54ea\u6015\u53ea\u6709 1% \u7684\u5783\u573e\uff0c\u90fd\u4f1a\u4ee5 10 \u500d\u901f\u5ea6\u81a8\u80c0\uff08\u5b9e\u9645\u6bd4\u4f8b\u66f4\u5927\uff09\u003c/li\u003e\n\u003cli\u003e\u74f6\u9888\u4e0d\u518d\u662f\u201c\u751f\u4ea7\u201d\uff0c\u800c\u662f\u201c\u9a8c\u8bc1\u201d\u003c/li\u003e\n\u003cli\u003e\u6bcf\u4e2a\u4eba\u90fd\u6709\u673a\u4f1a\u53bb\u89e3\u51b3\u4e4b\u524d long-horizon \u7684\u95ee\u9898\uff08\u77ed\u671f\u7684\u65f6\u4ee3\u7ea2\u5229\uff09\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e$1000\\times$ \u4ea7\u91cf $\\times 1\\%$ \u5783\u573e\u7387 $=10\\times$ \u65e7\u65f6\u4ee3\u003cstrong\u003e\u5168\u90e8\u4ea7\u91cf\u003c/strong\u003e\u7684\u5783\u573e\uff1b99% \u6b63\u786e\uff0c\u5728\u89c4\u6a21\u9762\u524d\u4ecd\u7136\u662f\u707e\u96be\u3002\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"aigc\"\u003e\u751f\u6210\u53ef\u4ee5\u5e76\u884c\uff0c\u9010\u884c review \u5374\u4e0d\u80fd\uff1a\u65b0\u7684\u5de5\u7a0b\u4efb\u52a1\uff0c\u662f\u8ba9 spec\u3001oracle\u3001\u95e8\u63a7\u3001\u89c2\u6d4b\u548c\u62bd\u6837\u672c\u8eab\u4e5f\u80fd\u6269\u5c55\u3002\u003c/span\u003e\u003c/p\u003e", "\u003ch1\u003e\u5f53 AI \u8fde\u201c\u54c1\u5473\u201d\u4e5f\u5b66\u4f1a\u4ee5\u540e\uff1f\u003c/h1\u003e\n\u003ch2\u003e\u4eba\u7684\u7a00\u7f3a\u6027\u7ee7\u7eed\u5411\u4e0a\u6e38\u8fc1\u79fb\u003c/h2\u003e\n\u003cp\u003e\u003cimg alt=\"\" src=\"data:image/webp;base64,UklGRtA/AABXRUJQVlA4IMQ/AADw2gGdASoABdACPu12tlSppysjIZM5eWAdiWVu+9r2IrKwAzB/ae9RzPFDqASLuMjUnJfr76p/c/zXfrbozTf+HwW+N/8XlDe0/yfnM/3nqk/r3qJ/2f0Gf9n91PdZ/i//J6mvOZ9OP9x34z0N+mg/vvpTajZ52/0H997zf9D4y+h35zty4J/i/8jzc+wL8j/E+i3+88LfkF/l/cR8hf5j/Of99vzOweYj7Q/b/On+98yv4r1AeDD/LeoJ/RvOW1JknsJLG61jdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1kEOgJ0ljdaxutY3WsbrWN1rG61jdaxutY3WsbrWN1rG61jdaxutTkoIkDApeRhf5BqY8sKxJkPrWbS4LXzGV9ULs/foteAzmvTpw0Xk6LydF5Oi8nReTovJ0Xk6LydF5Oi8nReTovJ0XGkRN84R4l2mFYapy2evpsCgjTI8BiBGnPA/I0B13C3PqCH1BD6gh9QQ+oIf <div id="pager"><span id="cur">1</span> / <span id="total">–</span></div>
<script>
// 无输入（或直接打开模板）时的演示内容，方便在浏览器里调试样式
// 两页：第 1 页内容少（不缩放），第 2 页内容多（测整页等比缩放）
const DEMO_SLIDES = [
  String.raw`<h1>演示幻灯片</h1>
   <h2>内容元素</h2>
   <p>这是 <code>slides.html</code> 模板的<strong>演示内容</strong>（无输入时的 fallback）。</p>
   <ul>
     <li>按 <b>Space/→/j/l</b> 翻页，<b>←/h/k</b> 后退，<b>Home/End</b> 首末页</li>
     <li><b>f</b> 全屏，<b>q</b> 关闭窗口</li>
   </ul>
   <h2>内容元素</h2>
   <blockquote>引用：AI 时代，四年学习的价值到底是什么？</blockquote>
   <p>正文 <a href="#">链接</a>；行内 <code>code</code> 与 <span class="aigc">AI 行内补充（<a href="#">链接</a>）</span>。</p>`,
  String.raw`<h1>长内容测试 · 自动缩放</h1>
   <h2>代码块与公式</h2>
   <pre><code class="language-python">def hello():
    print("Hello, slides!")
</code></pre>
   <p>行内公式 $x^2 + y^2 = z^2$ 与块级公式：</p>
   <p>$$\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}$$</p>
   <h2>要点列表</h2>
   <ul>
     <li>内容较多时整页等比缩小，不滚动、不裁剪</li>
     <li>窗口变小自动重新适配（resize 监听）</li>
     <li>图片 / MathJax 异步加载后也会重新适配</li>
     <li>这一页足够长，在任何分辨率下都能看出缩放效果</li>
     <li>缩放只缩不放，内容少时保持原始大小</li>
     <li>要点：Lorem ipsum dolor sit amet, consectetur adipiscing elit.</li>
     <li>要点：Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</li>
     <li>要点：Ut enim ad minim veniam, quis nostrud exercitation ullamco.</li>
     <li>要点：Duis aute irure dolor in reprehenderit in voluptate velit esse.</li>
     <li>要点：Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia.</li>
     <li>要点：Deserunt mollit anim id est laborum, sed quia consequuntur magni dolores.</li>
     <li>要点：Eos qui ratione voluptatem sequi nesciunt, neque porro quisquam est.</li>
     <li>要点：Qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit.</li>
     <li>要点：Sed quia non numquam eius modi tempora incidunt ut labore et dolore.</li>
     <li>要点：Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis.</li>
     <li>要点：Suscipit laboriosam nisi ut aliquid ex ea commodi consequatur quis autem.</li>
     <li>要点：Vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis.</li>
     <li>要点：Praesentium voluptatum deleniti atque corrupti quos dolores et quas.</li>
   </ul>`,
];

// 组装单页：开头的 <h1> 提为 .titlebar（放在 .inner 之外），
// 使标题条不参与整页缩放、左右始终顶格；其余内容进 .inner 等比缩放。
function makeSlide(html, i) {
  const section = document.createElement('section');
  // 首页带 no-anim：刷新时直接显示、不播入场动画；首次翻页即移除，此后正常过渡
  section.className = 'slide' + (i === 0 ? ' active no-anim' : '');
  const m = html.match(/^\s*<h1[^>]*>[\s\S]*?<\/h1\s*>/i);
  const title = m ? '<div class="titlebar">' + m[0].trim() + '</div>' : '';
  const body = m ? html.slice(m[0].length) : html;
  section.innerHTML = title + '<div class="inner">' + body + '</div>';
  return section;
}

// 真实幻灯片数据：渲染时由 Jinja2 注入；直接打开模板/无输入时解析失败 → 用 DEMO
let slides = [];
try {
  const data = JSON.parse(document.getElementById('slides-data').textContent);
  if (Array.isArray(data) && data.length) {
    slides = data.map((html, i) => makeSlide(html, i));
    slides.forEach(s => document.body.insertBefore(s, document.getElementById('pager')));
  }
} catch (e) { /* 忽略：走 DEMO */ }

if (slides.length === 0) {
  DEMO_SLIDES.forEach((html, i) => {
    document.body.insertBefore(makeSlide(html, i), document.getElementById('pager'));
  });
  slides = Array.from(document.querySelectorAll('.slide'));
}

let i = 0;
const cur = document.getElementById('cur');
const total = document.getElementById('total');

total.textContent = slides.length;

// 初始高亮/排版当前页
if (window.hljs) slides[0].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
fitSlides();
if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);

function show(n) {
  const target = Math.max(0, Math.min(n, slides.length - 1));
  if (target === i) return;                       // 越界翻页：不动
  const dir = target > i ? 1 : -1;                // 前进从右推入，后退从左推入
  const old = slides[i];
  slides.forEach(s => s.classList.remove('leaving', 'no-anim'));
  old.style.setProperty('--dir', dir);
  old.classList.remove('active');
  old.classList.add('leaving');                   // 旧页保持在下层，动画结束再隐藏
  old.addEventListener('animationend', () => old.classList.remove('leaving'), { once: true });
  i = target;
  slides[i].style.setProperty('--dir', dir);
  slides[i].classList.add('active');
  cur.textContent = i + 1;
  total.textContent = slides.length;
  window.scrollTo(0, 0);
  if (window.hljs) slides[i].querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  fitSlides();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);
}

// 标题保留独立字号；正文按扣除标题、padding 后的真实空间等比缩小。
function fitSlides() {
  slides.forEach(s => {
    if (!s.classList.contains('active')) return; // 隐藏页没有可测量的尺寸
    const inner = s.querySelector('.inner');
    const title = s.querySelector('.titlebar');
    const css = getComputedStyle(s);
    const width = s.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
    const bottom = s.clientHeight - parseFloat(css.paddingBottom);
    // 极窄/极矮窗口或长标题：标题最多占用屏幕 30%，给正文留出空间。
    if (title) {
      title.style.fontSize = '';
      const base = parseFloat(css.fontSize);
      let lo = 0, hi = base;
      for (let n = 0; n < 16; n++) {
        const size = (lo + hi) / 2;
        title.style.fontSize = `${size}px`;
        if (title.offsetHeight <= s.clientHeight * .3 && title.scrollWidth <= title.clientWidth) lo = size;
        else hi = size;
      }
      title.style.fontSize = `${lo}px`;
    }
    inner.style.transform = 'none';
    const height = Math.max(1, bottom - inner.offsetTop);
    const images = inner.querySelectorAll('img');
    inner.style.setProperty('--image-height', `${height / Math.max(1, images.length)}px`);
    const scale = Math.min(1,
      Math.max(1, width - 1) / Math.max(1, inner.scrollWidth),
      Math.max(1, height - 1) / Math.max(1, inner.scrollHeight, inner.offsetHeight));
    inner.style.transform = `scale(${scale})`;
  });
}
// 合并异步排版事件；transform 不改变布局尺寸，不会触发观察器循环。
let fitFrame;
function scheduleFit() {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitSlides);
}
slides.forEach(s => {
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleFit);
    observer.observe(s.querySelector('.inner'));
    const title = s.querySelector('.titlebar');
    if (title) observer.observe(title);
  }
  s.addEventListener('load', scheduleFit, true);
  s.addEventListener('error', scheduleFit, true);
});
window.addEventListener('resize', scheduleFit);
window.addEventListener('load', scheduleFit);
if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone', scheduleFit);
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ': case 'ArrowRight': case 'ArrowDown': case 'j': case 'l': case 'Enter': case 'PageDown':
      e.preventDefault(); show(i + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'h': case 'k': case 'Backspace': case 'PageUp':
      e.preventDefault(); show(i - 1); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(slides.length - 1); break;
    case 'f':
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
    case 'q':
      window.close();
      break;
  }
});
</script>
