<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><style>text {font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;}</style><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker></defs><rect width="1000" height="440" fill="white"/><text x="500" y="48" text-anchor="middle" font-size="27" font-weight="600" fill="#1e293b">只保存原始状态，让派生值跟随变化</text><rect x="40" y="125" width="230" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.7"/><text x="155.0" y="168.0" font-size="20" fill="#1e40af" text-anchor="middle">原始状态</text><text x="155.0" y="196.0" font-size="16" fill="#1e40af" text-anchor="middle">courses + query</text><rect x="385" y="125" width="230" height="100" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.7"/><text x="500.0" y="168.0" font-size="20" fill="#6b21a8" text-anchor="middle">纯派生值</text><text x="500.0" y="196.0" font-size="16" fill="#6b21a8" text-anchor="middle">visibleCourses</text><rect x="740" y="125" width="220" height="100" rx="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.7"/><text x="850.0" y="168.0" font-size="20" fill="#166534" text-anchor="middle">界面</text><text x="850.0" y="196.0" font-size="16" fill="#166534" text-anchor="middle">渲染筛选结果</text><path d="M275,175 L374,175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="324" y="139" font-size="17" fill="#1e293b" text-anchor="middle">计算</text><path d="M620,175 L729,175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="674" y="139" font-size="17" fill="#1e293b" text-anchor="middle">渲染</text><path d="M850,230 C850,320 155,320 155,236" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="500" y="322" font-size="19" fill="#1e40af" text-anchor="middle">用户输入只更新 query，再沿依赖重新计算</text><text x="500" y="365" font-size="17" fill="#475569" text-anchor="middle">可由原始状态算出的结果，不另存一份独立可修改的事实</text><text x="500" y="409" font-size="15" fill="#64748b" text-anchor="middle">据第 7 讲绘制</text></svg>
